<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Coma — расписание в чате, прототип</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; }
  /* ---------- Coma tokens (как в messenger-mobile) ---------- */
  .coma {
    --page:#e9eaee; --canvas:#f6f6f7; --surface:#fff; --raised:#fff; --selected:#f0f0f3; --fg:#202023; --muted:#686873; --border:#e5e5e9; --border-strong:#d2d2d9;
    --primary:#174586; --primary-soft:#edf3fb; --on-primary:#fff; --action:#252528; --on-action:#fff;
    --danger:#c43245; --danger-soft:#fff0f1; --success:#18794e; --success-soft:#edf8f1; --warning:#9c650b; --warning-soft:#fff8e7;
    --own:#174586; --own-fg:#fff; --own-muted:rgba(255,255,255,.72);
    --overlay:rgba(20,20,26,.36); --shadow:0 8px 24px rgba(20,20,30,.10); --mascot-body:#174586; --mascot-feet:#242831; --mascot-plate:#fff;
    --f-blue:#2f6fca; --f-violet:#7456c9; --f-green:#2b7754; --f-orange:#ac5a25; --f-teal:#227770;
    --a1:#e5eee6; --a1f:#4d6b54; --a2:#e8edf4; --a2f:#4c6280; --a3:#ece7f5; --a3f:#6f598e; --a4:#f3e8e9; --a4f:#8e505b; --a5:#f4ebde; --a5f:#806039;
    color: var(--fg); font-size: 15px; line-height: 1.35; font-family: -apple-system, "Segoe UI", Roboto, sans-serif;
    background: var(--page); min-height: 100vh; padding: 16px; color-scheme: light;
  }
  .coma[data-theme="dark"] {
    --page:#0d0d0f; --canvas:#151517; --surface:#1d1d20; --raised:#27272c; --selected:#2b2b30; --fg:#f0f0f2; --muted:#a0a0aa; --border:#323237; --border-strong:#46464f;
    --primary:#86aff0; --primary-soft:#243349; --on-primary:#172132; --action:#eeeeef; --on-action:#222225;
    --danger:#f0717f; --danger-soft:#3a2126; --success:#5fc594; --success-soft:#1c3327; --warning:#e0a94a; --warning-soft:#3a2f1a;
    --own:#2c4a78; --own-fg:#f3f6fb; --own-muted:rgba(243,246,251,.7);
    --overlay:rgba(0,0,0,.55); --shadow:0 8px 24px rgba(0,0,0,.4); --mascot-body:#86aff0; --mascot-feet:#fff; --mascot-plate:#151517;
    --f-blue:#7fb0f2; --f-violet:#ab97ee; --f-green:#6fc59c; --f-orange:#e59a68; --f-teal:#63c4bb;
    --a1:#26332a; --a1f:#a6c8ae; --a2:#262e3a; --a2f:#a9bedb; --a3:#2f2a3b; --a3f:#c3b3e2; --a4:#3a282b; --a4f:#e2adb5; --a5:#3a3023; --a5f:#dcbf94;
    color-scheme: dark;
  }
  /* ---------- lab chrome ---------- */
  .bar { display: flex; gap: 8px 10px; flex-wrap: wrap; align-items: center; margin: 0 auto 16px; max-width: 1060px; }
  .ttl { margin-right: auto; } .ttl b { display: block; font-size: 17px; } .ttl small { color: var(--muted); font-size: 12.5px; }
  .seg { display: flex; gap: 2px; flex-wrap: wrap; padding: 3px; border-radius: 10px; background: var(--surface); border: 1px solid var(--border); }
  .seg button, .tgl { font: inherit; font-size: 13px; border: 0; background: transparent; color: var(--muted); padding: 6px 10px; border-radius: 8px; cursor: pointer; }
  .seg button[aria-pressed="true"] { background: var(--action); color: var(--on-action); font-weight: 600; }
  .tgl { border: 1px solid var(--border); background: var(--surface); color: var(--fg); }
  .navrow { max-width: 1060px; margin: 0 auto 16px; }
  .stage { display: flex; gap: 24px; justify-content: center; align-items: flex-start; flex-wrap: wrap; max-width: 1060px; margin: 0 auto; }
  .pw { width: 360px; max-width: 100%; flex: none; }
  .aside { flex: 1 1 min(300px, 100%); min-width: 0; max-width: 460px; font-size: 14px; line-height: 1.5; }
  .aside h3 { margin: 0 0 8px; font-size: 17px; } .aside p { margin: 0 0 10px; color: var(--muted); } .aside p b, .aside li b { color: var(--fg); }
  .aside ul { margin: 0 0 12px; padding-left: 18px; color: var(--muted); } .aside li { margin-bottom: 4px; }
  .aside .box { background: var(--surface); border: 1px solid var(--border); border-radius: 14px; padding: 12px 14px; margin-bottom: 12px; }
  .aside code, .model code { font-size: 12.5px; background: var(--selected); padding: 1px 5px; border-radius: 5px; }

  /* ---------- phone ---------- */
  .phone { position: relative; width: 100%; height: 720px; border-radius: 38px; border: 1px solid var(--border-strong); background: var(--canvas); overflow: hidden; display: flex; flex-direction: column; box-shadow: var(--shadow); }
  .phone.white { background: var(--surface); }
  .status { display: flex; justify-content: space-between; padding: 12px 26px 4px; font-size: 13px; font-weight: 600; flex: none; background: var(--surface); }
  .status i { display: inline-block; width: 22px; height: 11px; border: 1.5px solid var(--fg); border-radius: 4px; position: relative; opacity: .8; }
  .status i::after { content: ""; position: absolute; inset: 1.5px 5px 1.5px 1.5px; background: var(--fg); border-radius: 1.5px; }
  .ic { width: 22px; height: 22px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; flex: none; }
  .ib { width: 40px; height: 40px; border-radius: 20px; border: 0; background: transparent; color: var(--fg); display: grid; place-items: center; cursor: pointer; flex: none; padding: 0; font: inherit; }
  .ib.soft { background: var(--selected); } .ib.sm { width: 32px; height: 32px; } .ib.sm .ic { width: 18px; height: 18px; }
  .av { width: 48px; height: 48px; border-radius: 16px; display: grid; place-items: center; font-weight: 600; font-size: 16px; flex: none; position: relative; }
  .av.round { border-radius: 50%; } .av.s { width: 30px; height: 30px; border-radius: 10px; font-size: 11.5px; } .av.s.round { border-radius: 50%; }
  .av.m { width: 36px; height: 36px; border-radius: 12px; font-size: 13px; } .av.xs { width: 22px; height: 22px; border-radius: 50%; font-size: 9px; }
  .c1{background:var(--a1);color:var(--a1f)}.c2{background:var(--a2);color:var(--a2f)}.c3{background:var(--a3);color:var(--a3f)}.c4{background:var(--a4);color:var(--a4f)}.c5{background:var(--a5);color:var(--a5f)}
  .cag{background:var(--primary-soft);color:var(--primary)}
  .chead { display: flex; align-items: center; gap: 8px; padding: 2px 8px 8px; border-bottom: 1px solid var(--border); background: var(--surface); flex: none; }
  .chead .t { flex: 1; min-width: 0; } .chead .t b { display: block; font-size: 16px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; } .chead .t small { color: var(--muted); font-size: 12.5px; }
  .strip { display: flex; align-items: center; gap: 8px; padding: 8px 14px; font-size: 13px; background: var(--surface); border-bottom: 1px solid var(--border); color: var(--muted); flex: none; cursor: pointer; }
  .strip .ic { width: 16px; height: 16px; color: var(--primary); } .strip b { color: var(--fg); font-weight: 600; } .strip span { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .scroll { flex: 1; overflow-y: auto; scrollbar-width: none; } .scroll::-webkit-scrollbar, .sheet::-webkit-scrollbar { display: none; }
  .feed { flex: 1; overflow-y: auto; padding: 10px 10px 6px; display: flex; flex-direction: column; gap: 3px; scrollbar-width: none; }
  .feed::-webkit-scrollbar { display: none; }
  .day { align-self: center; font-size: 12px; font-weight: 600; color: var(--muted); background: var(--selected); border-radius: 10px; padding: 3px 10px; margin: 4px 0 8px; }
  .msg { display: flex; gap: 7px; align-items: flex-end; max-width: 90%; margin-top: 5px; }
  .msg.me { align-self: flex-end; }
  .bub { background: var(--surface); border: 1px solid var(--border); border-radius: 18px 18px 18px 6px; padding: 7px 11px 7px; min-width: 0; }
  .me .bub { background: var(--own); border-color: transparent; color: var(--own-fg); border-radius: 18px 18px 6px 18px; }
  .bub.obj { width: 272px; max-width: 100%; }
  .me .bub.obj { background: var(--surface); color: var(--fg); border: 1px solid var(--border); }
  .who { font-size: 12.5px; font-weight: 600; margin-bottom: 1px; display: flex; gap: 5px; align-items: center; }
  .meta { font-size: 11px; color: var(--muted); float: right; margin: 5px 0 -1px 10px; } .me .bub:not(.obj) .meta { color: var(--own-muted); }
  .sys { align-self: center; text-align: center; font-size: 12.5px; color: var(--muted); padding: 4px 18px; max-width: 94%; } .sys b { color: var(--fg); font-weight: 600; }
  .tag { font-size: 10.5px; font-weight: 600; letter-spacing: .02em; padding: 1px 5px; border-radius: 5px; background: var(--primary-soft); color: var(--primary); flex: none; }
  .card { border: 1px solid var(--border); border-radius: 12px; padding: 10px; margin-top: 6px; background: var(--canvas); clear: both; }
  .card > b { font-size: 14px; display: block; } .card p { margin: 2px 0 8px; font-size: 13px; color: var(--muted); }
  .prog { height: 6px; border-radius: 3px; background: var(--border); overflow: hidden; margin-bottom: 9px; } .prog i { display: block; height: 100%; background: var(--success); border-radius: 3px; }
  .acts { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 8px; }
  .kh { display: flex; align-items: center; gap: 6px; font-size: 12.5px; font-weight: 600; color: var(--muted); } .kh .ic { width: 15px; height: 15px; } .kh .pill { margin-left: auto; }
  .done { display: flex; gap: 6px; align-items: center; font-size: 13px; color: var(--success); font-weight: 600; margin-top: 8px; } .done .ic { width: 16px; height: 16px; }
  .note { font-size: 12.5px; color: var(--muted); margin-top: 6px; }
  .cmp { flex: none; padding: 6px 8px 18px; background: var(--canvas); display: flex; gap: 6px; align-items: center; }
  .inp { flex: 1; height: 40px; border-radius: 20px; background: var(--surface); border: 1px solid var(--border); display: flex; align-items: center; padding: 0 14px; color: var(--muted); font-size: 15px; }

  /* buttons, chips, pills */
  .btn { height: 46px; border-radius: 14px; border: 0; font: inherit; font-size: 16px; font-weight: 600; background: var(--action); color: var(--on-action); width: 100%; margin-top: 12px; cursor: pointer; white-space: nowrap; display: flex; align-items: center; justify-content: center; gap: 7px; }
  .btn .ic { width: 18px; height: 18px; }
  .btn.sec { background: var(--selected); color: var(--fg); } .btn.pri { background: var(--primary); color: var(--on-primary); } .btn.dng { background: var(--danger-soft); color: var(--danger); }
  .btn.sm { height: 34px; font-size: 14px; border-radius: 10px; width: auto; padding: 0 12px; margin: 0; } .btn.sm .ic { width: 15px; height: 15px; }
  .btn[disabled] { opacity: .45; cursor: default; }
  .pill { font-size: 11.5px; font-weight: 600; padding: 2px 7px; border-radius: 8px; background: var(--selected); color: var(--muted); white-space: nowrap; flex: none; }
  .pill.ok { background: var(--success-soft); color: var(--success); } .pill.wr { background: var(--warning-soft); color: var(--warning); } .pill.pr { background: var(--primary-soft); color: var(--primary); } .pill.dn { background: var(--danger-soft); color: var(--danger); }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; }
  .chip { font: inherit; font-size: 14px; height: 34px; padding: 0 12px; border-radius: 17px; border: 1px solid var(--border); display: inline-flex; align-items: center; gap: 6px; color: var(--fg); background: var(--surface); cursor: pointer; white-space: nowrap; }
  .chip.on { background: var(--action); border-color: var(--action); color: var(--on-action); font-weight: 600; }
  .chip.soft.on { background: var(--primary-soft); border-color: transparent; color: var(--primary); }
  .chip .ic { width: 15px; height: 15px; } .chip .x { opacity: .6; }
  .chip.add { border-style: dashed; color: var(--muted); }
  .tabsw { display: flex; gap: 2px; padding: 3px; border-radius: 11px; background: var(--selected); }
  .tabsw button { flex: 1; font: inherit; font-size: 14px; border: 0; background: transparent; color: var(--muted); height: 30px; border-radius: 8px; cursor: pointer; }
  .tabsw button.on { background: var(--surface); color: var(--fg); font-weight: 600; box-shadow: 0 1px 2px rgba(0,0,0,.12); }
  .warnc { color: var(--warning); } .okc { color: var(--success); } .muted { color: var(--muted); }

  /* seats */
  .seats { display: inline-flex; gap: 3px; align-items: center; vertical-align: middle; }
  .seat { width: 22px; height: 22px; border-radius: 50%; border: 1.5px dashed var(--border-strong); display: inline-block; flex: none; }
  .seat.req { border-color: var(--warning); background: var(--warning-soft); }
  .av.pend { opacity: .6; box-shadow: 0 0 0 1.5px var(--warning); }
  .rl { display: flex; flex-wrap: wrap; gap: 4px 12px; margin-top: 6px; align-items: center; font-size: 12.5px; color: var(--muted); }
  .rl > span { display: inline-flex; align-items: center; gap: 5px; }
  .mbar { width: 40px; height: 5px; border-radius: 3px; background: var(--border); overflow: hidden; display: inline-block; } .mbar i { display: block; height: 100%; background: var(--f-teal); }
  .cnt b { color: var(--fg); }

  /* board */
  .bh { padding: 8px 14px 10px; background: var(--surface); border-bottom: 1px solid var(--border); flex: none; display: flex; flex-direction: column; gap: 8px; }
  .wk { display: flex; align-items: center; gap: 4px; } .wk b { flex: 1; text-align: center; font-size: 15px; }
  .dsec { font-size: 12.5px; font-weight: 600; color: var(--muted); padding: 14px 16px 6px; display: flex; gap: 8px; align-items: baseline; } .dsec span { margin-left: auto; font-weight: 500; }
  .srow { display: flex; gap: 10px; padding: 10px 12px; margin: 0 10px 6px; background: var(--surface); border: 1px solid var(--border); border-left: 3px solid var(--border); border-radius: 12px; cursor: pointer; }
  .srow.need { border-left-color: var(--warning); } .srow.mine { border-left-color: var(--primary); } .srow.full { border-left-color: var(--success); }
  .srow .tm { width: 40px; flex: none; font-size: 13px; font-variant-numeric: tabular-nums; } .srow .tm b { display: block; font-size: 14px; } .srow .tm small { color: var(--muted); }
  .srow .g { flex: 1; min-width: 0; } .srow .g > b { font-size: 14.5px; } .srow .g > small { color: var(--muted); font-size: 12.5px; display: block; }
  .srow .st { flex: none; }
  .empty { text-align: center; color: var(--muted); font-size: 13.5px; padding: 26px 20px; }
  .dstrip { display: flex; gap: 4px; }
  .dstrip button { flex: 1; font: inherit; border: 1px solid var(--border); background: var(--surface); color: var(--fg); border-radius: 12px; padding: 5px 0 4px; cursor: pointer; display: flex; flex-direction: column; align-items: center; font-size: 11.5px; color: var(--muted); }
  .dstrip button b { font-size: 16px; color: var(--fg); } .dstrip button i { width: 6px; height: 6px; border-radius: 50%; margin-top: 2px; background: transparent; }
  .dstrip button i.w { background: var(--warning); }
  .dstrip button.on { background: var(--action); border-color: var(--action); color: var(--on-action); } .dstrip button.on b { color: var(--on-action); }
  .tl { padding: 8px 8px 14px 4px; }
  .tlh, .tlb { display: grid; gap: 3px; } .tlh { font-size: 11.5px; font-weight: 600; color: var(--muted); text-align: center; padding-bottom: 4px; position: sticky; top: 0; background: var(--canvas); z-index: 2; }
  .tlh span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .tlb { position: relative; background-image: repeating-linear-gradient(to bottom, var(--border) 0 1px, transparent 1px 36px); }
  .axis { position: relative; font-size: 10.5px; color: var(--muted); } .axis span { position: absolute; right: 3px; transform: translateY(-50%); font-variant-numeric: tabular-nums; }
  .col { position: relative; }
  .col.tap { cursor: copy; } .col.tap:hover { background: color-mix(in srgb, var(--primary-soft) 50%, transparent); }
  .blk { position: absolute; left: 0; right: 0; border-radius: 8px; padding: 3px 5px; font-size: 10.5px; line-height: 1.25; overflow: hidden; cursor: pointer; background: var(--surface); border: 1px solid var(--border); border-left: 3px solid var(--border-strong); }
  .blk b { display: block; font-size: 11px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; } .blk small { display: block; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .blk.need { border-left-color: var(--warning); background: var(--warning-soft); } .blk.mine { border-left-color: var(--primary); background: var(--primary-soft); } .blk.full { border-left-color: var(--success); }
  .blk .seats .av, .blk .seats .seat { width: 15px; height: 15px; font-size: 7px; border-width: 1px; }
  .legend { display: flex; gap: 12px; flex-wrap: wrap; font-size: 11.5px; color: var(--muted); padding: 2px 14px 0; } .legend span { display: inline-flex; gap: 5px; align-items: center; }
  .legend i { width: 10px; height: 10px; border-radius: 3px; display: inline-block; }

  /* sheets */
  .dim { position: absolute; inset: 0; background: var(--overlay); z-index: 5; }
  .sheet { position: absolute; left: 0; right: 0; bottom: 0; z-index: 6; background: var(--surface); border-radius: 24px 24px 0 0; padding: 8px 16px 22px; max-height: 90%; overflow-y: auto; scrollbar-width: none; }
  .grab { width: 36px; height: 4px; border-radius: 2px; background: var(--border-strong); margin: 0 auto 12px; }
  .sheet h2 { font-size: 17px; font-weight: 700; margin: 0 0 10px; display: flex; align-items: center; gap: 6px; } .sheet h2 span { flex: 1; }
  .lbl { font-size: 12px; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: .04em; margin: 16px 0 7px; display: flex; gap: 6px; align-items: baseline; }
  .lbl em { font-style: normal; text-transform: none; letter-spacing: 0; margin-left: auto; font-weight: 600; }
  .slotbox { display: flex; gap: 10px; align-items: center; padding: 9px 11px; border-radius: 12px; background: var(--selected); font-size: 13.5px; margin-top: 6px; } .slotbox .ic { color: var(--primary); width: 19px; height: 19px; }
  .slotbox b { display: block; font-size: 14px; } .slotbox small { color: var(--muted); font-size: 12.5px; }
  .card .slotbox { background: var(--surface); border: 1px solid var(--border); }
  .prow { display: flex; align-items: center; gap: 10px; padding: 7px 0; font-size: 15px; } .prow .g { flex: 1; min-width: 0; } .prow small { display: block; color: var(--muted); font-size: 12.5px; }
  .prow .seat { width: 30px; height: 30px; }
  .prow.pick { cursor: pointer; border-radius: 12px; padding: 7px 8px; margin: 0 -8px; } .prow.pick:hover { background: var(--selected); } .prow.pick.sel { background: var(--primary-soft); }
  .prow.off { opacity: .5; cursor: default; }
  .rolebox { border: 1px solid var(--border); border-radius: 14px; padding: 10px 12px; margin-top: 10px; }
  .rolebox .rh { display: flex; align-items: baseline; gap: 8px; } .rolebox .rh b { font-size: 15px; } .rolebox .rh .n { margin-left: auto; font-weight: 700; font-variant-numeric: tabular-nums; }
  .rolebox .rh small { color: var(--muted); font-size: 12.5px; }
  .bigbar { height: 8px; border-radius: 4px; background: var(--border); overflow: hidden; margin: 8px 0 6px; } .bigbar i { display: block; height: 100%; background: var(--f-teal); }
  .stp { display: inline-flex; align-items: center; gap: 2px; border: 1px solid var(--border); border-radius: 10px; } .stp button { width: 30px; height: 30px; border: 0; background: transparent; color: var(--fg); font: inherit; font-size: 18px; cursor: pointer; border-radius: 9px; }
  .stp b { min-width: 22px; text-align: center; font-variant-numeric: tabular-nums; }
  .opt { display: flex; align-items: center; gap: 12px; padding: 8px 0; font-size: 15px; } .opt .g { flex: 1; min-width: 0; } .opt small { display: block; color: var(--muted); font-size: 12.5px; }
  .tg { width: 44px; height: 26px; border-radius: 13px; background: var(--border-strong); position: relative; flex: none; cursor: pointer; border: 0; padding: 0; }
  .tg::after { content: ""; position: absolute; top: 3px; left: 3px; width: 20px; height: 20px; border-radius: 50%; background: #fff; transition: left .15s; box-shadow: 0 1px 2px rgba(0,0,0,.2); }
  .tg.on { background: var(--primary); } .tg.on::after { left: 21px; }
  .field { min-height: 44px; border-radius: 12px; border: 1px solid var(--border-strong); background: var(--surface); display: flex; align-items: center; padding: 0 13px; font-size: 15px; color: var(--muted); }
  .field.val { color: var(--fg); }
  .hint { display: flex; gap: 8px; align-items: flex-start; font-size: 13px; color: var(--muted); background: var(--selected); border-radius: 12px; padding: 9px 11px; margin-top: 10px; } .hint .ic { width: 17px; height: 17px; flex: none; margin-top: 1px; }
  .hint.wr { background: var(--warning-soft); color: var(--warning); }
  .toast { position: absolute; left: 12px; right: 12px; bottom: 84px; z-index: 9; background: var(--action); color: var(--on-action); border-radius: 14px; padding: 11px 14px; font-size: 13.5px; box-shadow: var(--shadow); display: flex; gap: 9px; align-items: flex-start; }
  .toast .ic { width: 18px; height: 18px; flex: none; }

  /* admin */
  .stat3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; padding: 12px 12px 4px; }
  .stat3 div { background: var(--surface); border: 1px solid var(--border); border-radius: 14px; padding: 10px; font-size: 12px; color: var(--muted); line-height: 1.25; }
  .stat3 b { display: block; font-size: 22px; color: var(--fg); } .stat3 .w b { color: var(--warning); }
  .arow { background: var(--surface); border: 1px solid var(--border); border-radius: 14px; padding: 10px 12px; margin: 0 10px 8px; }
  .arow .h { display: flex; gap: 8px; align-items: baseline; cursor: pointer; } .arow .h b { font-size: 14.5px; flex: 1; } .arow .h small { color: var(--muted); font-size: 12.5px; }

  const P1 = c => count('Пациент', 1, c);

  function seed() {

      res: [{ id: 'big', n: 'Большой зал', sh: 'Б. зал' }, { id: 'small', n: 'Малый зал', sh: 'М. зал' }, { id: 'pool', n: 'Бассейн', sh: 'Бассейн' }, { id: 'k3', n: 'Кабинет 3', sh: 'Каб. 3' }],

      h(1, '14:00', '15:00', 'k3', 'Индивидуальное', [SP(['ИЛ']), P1(1)]),

  const toastH = () => S.toast ? `<div class="toast">${I(S.toast.icon)}<span>${S.toast.text}</span></div>` : '';

  /* ---------- chat ---------- */
  const inMsg = (p, body, t, o = {}) => `<div class="msg">${o.avh || av(p)}<div class="bub ${o.obj ? 'obj' : ''}"><div class="who" style="color:${o.color || `var(--a${PEOPLE[p] ? PEOPLE[p][1].slice(1) : 2}f)`}">${o.name || nm(p)}${o.tag || ''}</div>${body}<span class="meta">${t}</span></div></div>`;
  const comaAv = `<div class="av s round" style="background:var(--mascot-plate);border:1px solid var(--border)">${mascot(13, 15)}</div>`;
  function boardCard(b) {
    const s = boardStats(b);
    if (b.kind === 'res') return `<div class="card"><div class="kh">${I('grid')}Доска бронирования</div><b>${b.name}</b><p>${b.res.map(r => r.n).join(', ')} · бронь на 30 мин – 4 ч</p><div class="acts"><button class="btn sm pri" data-a="go-board" data-b="${b.id}">Открыть доску</button></div></div>`;
    return `<div class="card"><div class="kh">${I('grid')}Доска · 16–20 ноября</div><b>${b.name}</b><p>Занято ${s.fill} из ${s.tot} мест сотрудников${s.needN ? ` · <span class="warnc">не хватает ${s.needN}</span>` : ''}</p><div class="prog"><i style="width:${Math.round(s.fill / s.tot * 100)}%"></i></div><div class="acts"><button class="btn sm pri" data-a="go-board" data-b="${b.id}">Открыть доску</button>${isAdmin() ? '' : `<button class="btn sm sec" data-a="go-board" data-b="${b.id}" data-f="mine">Мои слоты</button>`}</div></div>`;
  }
  function slotCard(x) {
    const r0 = staffR(x)[0], mine = has(x, S.me), p = pendOf(x, S.me), b = B(x.b);
    let act = '';
    if (isAdmin()) act = freeSeats(x) ? `<button class="btn sm sec" data-a="assign" data-id="${x.id}">Назначить</button>` : '';
    else if (mine) act = `<div class="done">${I('check')}Вы записаны</div>`;
    else if (p) act = `<div class="note">Ждёт подтверждения Марины</div>`;
    else if (freeSeats(x)) { const c = conflict(S.me, x); act = c ? `<div class="note">Вы заняты в это время: ${place(c)}, ${F(c.s)}–${F(c.e)}</div>` : `<button class="btn sm pri" data-a="join" data-id="${x.id}">${I('plus')}Записаться</button>`; }
    else act = `<div class="done">${I('check')}Все места заняты</div>`;
    return `<div class="card"><div class="kh">${I('cal')}${DAYS[x.d][0]}, ${DAYS[x.d][1]} ноя · ${F(x.s)}–${F(x.e)}${statePill(x)}</div><b style="margin-top:4px">${x.title} · ${place(x)}</b>${roleLine(x)}
      <div class="acts">${act}<button class="btn sm sec" data-a="open" data-id="${x.id}">Подробнее</button></div></div>`;
  }
  function offerCard(o, t) {
    const x = slot(o.slot), sw = o.swap && slot(o.swap);
    const pill = { open: '<span class="pill wr">вам</span>', admin: '<span class="pill wr">ждём Марину</span>', done: '<span class="pill ok">принято</span>', declined: '<span class="pill">отказ</span>' }[o.st];
    const body = `<div class="kh">${I('swap')}${sw ? 'Обмен слотами' : 'Передача слота'}${pill}</div><div style="margin:6px 0 2px;font-size:14.5px">${first(o.from)} ${sw ? 'предлагает обмен' : 'предлагает вам слот'}${o.note ? `: «${o.note}»` : ''}</div>
      <div class="slotbox">${I('cal')}<div><b>${sw ? 'Вы берёте: ' : ''}${place(x)} · ${x.title}</b><small>${when(x)}</small></div></div>
      ${sw ? `<div class="slotbox">${I('swap')}<div><b>Отдаёте: ${place(sw)}</b><small>${when(sw)}</small></div></div>` : ''}
      ${o.st === 'open' ? `<div class="acts"><button class="btn sm pri" data-a="off-acc" data-id="${o.id}">${I('check')}Беру</button><button class="btn sm sec" data-a="off-dec" data-id="${o.id}">Не могу</button></div>`
        : o.st === 'admin' ? '<div class="note">Вы согласились. Слот перейдёт к вам, когда Марина подтвердит.</div>'
        : o.st === 'done' ? `<div class="done">${I('check')}Слот ваш. ${first(o.from)} получила уведомление</div>` : `<div class="note">Вы отказались — ${first(o.from)} предложит другим</div>`}`;
    return inMsg(o.from, body, t, { obj: 1, tag: ' <span class="pill" style="font-size:10px;padding:1px 6px">только вам</span>' });
  }
  function outCard(o) {
    const x = slot(o.slot), to = o.to === '*' ? 'всем свободным' : first(o.to);
    const s = { open: `Ждём ответа: ${to}`, admin: `${first(o.acc)} согласен. Ждём подтверждения Марины`, done: `Слот перешёл к ${o.acc ? first(o.acc) : ''}`, declined: 'Отклонено' }[o.st];
    return `<div class="msg me"><div class="bub obj"><div class="kh">${I('swap')}${o.swap ? 'Вы предложили обмен' : 'Вы передаёте слот'}<span class="pill ${o.st === 'done' ? 'ok' : 'wr'}">${o.st === 'done' ? 'готово' : 'в процессе'}</span></div>
      <div class="slotbox">${I('cal')}<div><b>${place(x)} · ${x.title}</b><small>${when(x)}</small></div></div><div class="note">${s}. Пока замену не подтвердят, слот ваш.</div><span class="meta">${o.t}</span></div></div>`;
  }
  function remindCard(it) {
    const x = slot(it.id); const others = staffR(x)[0].ppl.filter(p => p !== S.me).map(first);
    const pat = x.roles.find(r => r.type === 'count');
    const gone = !has(x, S.me);
    const body = `<div class="kh">${I('bell')}Напоминание · завтра</div><div style="margin:6px 0 2px;font-size:14.5px">${gone ? 'Вы больше не в этом слоте.' : `Завтра ваш слот.${others.length ? ` Ещё в слоте: ${others.join(', ')}.` : ''}${pat ? ` ${pat.n}: ${pat.cnt} из ${pat.max}.` : ''}`}</div>
      <div class="slotbox">${I('cal')}<div><b>${place(x)} · ${x.title}</b><small>${when(x)}</small></div></div>
      ${gone ? '' : it.done ? `<div class="done">${I('check')}Отметили: буду</div>` : `<div class="acts"><button class="btn sm sec" data-a="rem-ok">${I('check')}Буду</button><button class="btn sm sec" data-a="give" data-id="${x.id}">${I('swap')}Не смогу — передать</button></div>`}`;
    return inMsg('', body, it.t, { obj: 1, avh: comaAv, name: 'Coma', color: 'var(--primary)', tag: ' <span class="pill" style="font-size:10px;padding:1px 6px">только вам</span>' });
  }
  function feedHtml() {
    return feed().filter(it => !it.only || it.only === S.me).map(it => {
      if (it.k === 'day') return `<span class="day">${it.t}</span>`;
      if (it.k === 'sys') return `<div class="sys">${it.text}</div>`;
      if (it.k === 'offer') return offerCard(S.offers.find(o => o.id === it.id), it.t);
      if (it.k === 'out') { const o = S.offers.find(o => o.id === it.id); return o.from === S.me ? outCard(o) : ''; }
      if (it.k === 'remind') return remindCard(it);
      const card = it.card ? (it.card.k === 'board' ? boardCard(B(it.card.b)) : slotCard(slot(it.card.id))) : '';
      return inMsg(it.who, `${it.text}${card}`, it.t, { obj: !!card });
    }).join('');
  }
  function chatScreen() {
    const b = B(); const s = boardStats(b);
    const stripTxt = b.kind === 'res' ? `<b>${b.name}</b> · ${b.res.length} ресурса` : `<b>Доска 16–20 ноября</b> · ${s.needN ? `<span class="warnc">не хватает ${s.needN}</span>` : 'всё закрыто'}`;
    return `<div class="phone">${st}${chead(b.chat, b.kind === 'res' ? '6 участников' : '14 участников · 5 в сети', backBtn('noop') + `<div class="av m c2">${b.chatAv}</div>`, `<button class="ib">${I('more')}</button>`)}
      <div class="strip" data-a="go-board" data-b="${b.id}">${I('grid')}<span>${stripTxt}</span>${I('right', 'width:16px;height:16px;color:var(--muted)')}</div>
      <div class="feed" data-scroll="feed">${feedHtml()}</div>
      <div class="cmp"><button class="ib soft">${I('plus')}</button><div class="inp">Сообщение</div></div>${sheetH()}${toastH()}</div>`;
  }

  /* ---------- board ---------- */
  function boardHead(b) {
    const s = boardStats(b);
    const right = (isAdmin() && b.kind !== 'res' ? `<button class="ib" data-a="go-admin" aria-label="Управление">${I('gear')}</button>` : '') + `<button class="ib" data-a="sheet" data-t="menu" aria-label="Ещё">${I('more')}</button>`;
    const sub = b.kind === 'res' ? `${b.chat} · бронь свободным временем` : `${b.chat} · ${s.needN ? `не хватает ${s.needN}` : 'всё закрыто'}`;
    return `${chead(b.name, sub, backBtn('go-chat'), right)}
      <div class="bh"><div class="wk"><button class="ib sm">${I('back')}</button><b>16–20 ноября</b><button class="ib sm">${I('right')}</button></div>
      <div class="tabsw"><button class="${S.view === 'week' ? 'on' : ''}" data-a="view" data-v="week">Неделя</button><button class="${S.view === 'day' ? 'on' : ''}" data-a="view" data-v="day">День</button></div>
      ${S.view === 'week' && b.kind !== 'res' ? `<div class="chips">${[['all', 'Все'], ['mine', isAdmin() ? 'Мои назначения' : 'Мои'], ['need', 'Не хватает людей']].map(([k, n]) => `<button class="chip ${S.filter === k ? 'on' : ''}" data-a="filter" data-v="${k}">${n}</button>`).join('')}</div>` : ''}
      ${S.view === 'day' ? `<div class="dstrip">${DAYS.map((d, i) => `<button class="${S.day === i ? 'on' : ''}" data-a="day" data-v="${i}">${d[0]}<b>${d[1]}</b><i class="${b.slots.some(x => x.d === i && need(x)) ? 'w' : ''}"></i></button>`).join('')}</div>` : ''}</div>`;
  }
  function weekList(b) {
    let sl = b.slots;
    if (S.filter === 'mine') sl = sl.filter(x => has(x, S.me) || pendOf(x, S.me) || (isAdmin() && false));
    if (S.filter === 'need') sl = sl.filter(x => need(x) || freeSeats(x));
    if (isAdmin() && S.filter === 'mine') sl = b.slots.filter(x => need(x));
    let h = '';
    DAYS.forEach((d, i) => {
      const ds = sl.filter(x => x.d === i).sort((a, c) => a.s - c.s || a.res.localeCompare(c.res)); if (!ds.length) return;
      const n = ds.reduce((a, x) => a + need(x), 0);
      h += `<div class="dsec">${d[2]}, ${d[1]} ноября<span class="${n ? 'warnc' : ''}">${n ? `не хватает ${n}` : `${ds.length} ${plural(ds.length, 'слот', 'слота', 'слотов')}`}</span></div>`;
      h += ds.map(x => `<div class="srow ${b.kind === 'res' ? (has(x, S.me) ? 'mine' : '') : state(x)}" data-a="open" data-id="${x.id}"><div class="tm"><b>${F(x.s)}</b><small>${F(x.e)}</small></div>
        <div class="g"><b>${x.title}</b><small>${place(x)}</small>${b.kind === 'res' ? `<div class="rl"><span>${av(staffR(x)[0].ppl[0], 'xs')} ${nm(staffR(x)[0].ppl[0])}</span></div>` : roleLine(x)}</div><div class="st">${statePill(x)}</div></div>`).join('');
    });
    return h || `<div class="empty">${S.filter === 'mine' ? 'У вас нет слотов на этой неделе.' : 'Всё закрыто 🎉'}</div>`;
  }
  const H0 = 8 * 60, H1 = 20 * 60, PX = .6;
  function dayGrid(b) {
    const cols = b.res, tap = b.kind === 'res';
    const hours = []; for (let m = H0; m <= H1; m += 60) hours.push(`<span style="top:${(m - H0) * PX}px">${m / 60}</span>`);
    const blk = x => { const s = tap ? (has(x, S.me) ? 'mine' : '') : state(x); const r0 = staffR(x)[0], pt = x.roles.find(r => r.type === 'count');
      const ht = (x.e - x.s) * PX - 2;
      return `<div class="blk ${s}" style="top:${(x.s - H0) * PX + 1}px;height:${ht}px" data-a="open" data-id="${x.id}"><b>${tap ? first(r0.ppl[0]) : x.title}</b><small>${F(x.s)}–${F(x.e)}</small>${tap ? (ht > 40 ? `<small>${x.title}</small>` : '') : `${ht > 40 ? `<small>${r0.n.slice(0, 4)}. ${r0.ppl.length}/${r0.max}${pt ? ` · ${pt.n.slice(0, 3)}. ${pt.cnt}/${pt.max}` : ''}</small>` : ''}${ht > 70 ? `<div style="margin-top:3px">${seats(r0)}</div>` : ''}`}</div>`; };
    return `<div class="tl"><div class="tlh" style="grid-template-columns:24px repeat(${cols.length},1fr)"><span></span>${cols.map(c => `<span>${c.sh}</span>`).join('')}</div>
      <div class="tlb" style="grid-template-columns:24px repeat(${cols.length},1fr);height:${(H1 - H0) * PX}px"><div class="axis">${hours.join('')}</div>
      ${cols.map(c => `<div class="col ${tap ? 'tap' : ''}" ${tap ? `data-a="tap" data-res="${c.id}"` : ''}>${b.slots.filter(x => x.d === S.day && x.res === c.id).map(blk).join('')}</div>`).join('')}</div></div>
      <div class="legend">${tap ? `<span><i style="background:var(--primary-soft);border:1px solid var(--primary)"></i>ваша бронь</span><span>Нажмите на пустое место, чтобы забронировать</span>` : `<span><i style="background:var(--warning-soft);border:1px solid var(--warning)"></i>не хватает</span><span><i style="background:var(--primary-soft);border:1px solid var(--primary)"></i>вы</span><span><i style="background:var(--surface);border:1px solid var(--success)"></i>все на месте</span>`}</div>`;
  }
  function boardScreen() {
    const b = B();
    return `<div class="phone">${st}${boardHead(b)}<div class="scroll" data-scroll="board-${S.view}">${S.view === 'week' ? weekList(b) + '<div style="height:16px"></div>' : dayGrid(b)}</div>${sheetH()}${toastH()}</div>`;
  }

  /* ---------- admin ---------- */
  function adminScreen() {
    const b = B('halls'); const s = boardStats(b);
    const needs = b.slots.filter(x => need(x)).sort((a, c) => a.d - c.d || a.s - c.s);
    const opt = b.slots.filter(x => !need(x) && freeSeats(x));
    const appr = S.offers.filter(o => o.st === 'admin');
    const pend = b.slots.flatMap(x => staffR(x).flatMap(r => r.pend.map(p => ({ x, p }))));
    const row = x => `<div class="arow"><div class="h" data-a="open" data-id="${x.id}"><b>${place(x)} · ${x.title}</b><span class="pill wr">нужен ${need(x)}</span></div><div class="s">${when(x)}</div>${roleLine(x)}
      <div class="acts">${S.called && S.called[x.id] ? '<span class="pill ok" style="align-self:center">позвали в чат</span>' : `<button class="btn sm sec" data-a="call" data-id="${x.id}">${I('at')}Позвать</button>`}<button class="btn sm pri" data-a="assign" data-id="${x.id}">Назначить</button></div></div>`;
    return `<div class="phone">${st}${chead('Управление доской', `${b.name} · вы распорядитель`, backBtn('go-board-halls'), `<button class="ib" data-a="sheet" data-t="settings" aria-label="Правила">${I('gear')}</button>`)}
      <div class="scroll" data-scroll="admin">
      <div class="stat3"><div class="${s.needN ? 'w' : ''}"><b>${s.needN}</b>не хватает людей</div><div><b>${opt.length}</b>${plural(opt.length, 'слот', 'слота', 'слотов')} со свободным местом</div><div class="${appr.length + pend.length ? 'w' : ''}"><b>${appr.length + pend.length}</b>ждут вашего решения</div></div>
      ${appr.length + pend.length ? `<div class="dsec">Ждут вашего решения</div>` : ''}
      ${appr.map(o => { const x = slot(o.slot), sw = o.swap && slot(o.swap); return `<div class="arow"><div class="h"><b>${sw ? 'Обмен' : 'Передача'}: ${first(o.from)} → ${first(o.acc)}</b></div><div class="s">${place(x)}, ${when(x)}${sw ? `<br>взамен: ${place(sw)}, ${when(sw)}` : ''}</div>${o.note ? `<div class="s">«${o.note}»</div>` : ''}
        <div class="acts"><button class="btn sm pri" data-a="appr" data-id="${o.id}">${I('check')}Подтвердить</button><button class="btn sm sec" data-a="rej" data-id="${o.id}">Отклонить</button></div></div>`; }).join('')}
      ${pend.map(({ x, p }) => `<div class="arow"><div class="h"><b>Запись: ${nm(p)}</b></div><div class="s">${place(x)} · ${x.title}, ${when(x)}</div><div class="acts"><button class="btn sm pri" data-a="pend-ok" data-id="${x.id}" data-p="${p}">${I('check')}Подтвердить</button><button class="btn sm sec" data-a="pend-no" data-id="${x.id}" data-p="${p}">Отклонить</button></div></div>`).join('')}
      <div class="dsec">Не хватает людей<span>${needs.length ? `${needs.length} ${plural(needs.length, 'слот', 'слота', 'слотов')}` : ''}</span></div>
      ${needs.map(row).join('') || '<div class="empty">Во всех слотах есть минимум инструкторов 🎉</div>'}
      <div class="dsec">Нагрузка инструкторов<span>часов на неделе</span></div>
      ${STAFF.map(p => { const h = weekLoad(p); return `<div class="load">${av(p, 'xs')}<span class="g">${nm(p)}</span><span class="lb"><i style="width:${Math.min(100, h / 24 * 100)}%"></i></span><small>${h} ч</small></div>`; }).join('')}
      <div class="pad" style="padding-top:8px"><button class="btn sec" data-a="next-week">${I('cal')}Создать неделю 23–27 ноября из шаблона</button></div>
      </div>${sheetH()}${toastH()}</div>`;
  }

  /* ---------- sheets ---------- */
  function sheetH() {
    const sh = S.sheet; if (!sh) return '';
    const body = { slot: slotSheet, give: giveSheet, assign: assignSheet, menu: menuSheet, settings: settingsSheet, book: bookSheet }[sh.t](sh);
    return `<div class="dim" data-a="close"></div><div class="sheet" data-scroll="sheet"><div class="grab"></div>${body}</div>`;
  }
  const sheetTitle = t => `<h2><span>${t}</span><button class="ib sm soft" data-a="close" aria-label="Закрыть">${I('x')}</button></h2>`;
  function slotSheet(sh) {
    const x = slot(sh.id), b = B(x.b), admin = isAdmin();
    let h = sheetTitle(`${x.title}`) + `<div class="slotbox">${I('cal')}<div><b>${when(x)}</b><small>${place(x)}</small></div></div>`;
    if (b.kind === 'res') {
      const who = staffR(x)[0].ppl[0];
      h += `<div class="prow">${av(who, 'm round')}<div class="g">${nm(who)}${who === S.me ? ' · вы' : ''}<small>забронировал(а)</small></div></div>`;
      if (who === S.me || admin) h += `<button class="btn dng" data-a="unbook" data-id="${x.id}">Отменить бронь</button>`;
      return h + `<div class="hint">${I('info')}<span>У ресурса нет исполнителя — только бронь. Пересечение по одному ресурсу запрещено базой (ограничение на интервалы), а не только интерфейсом.</span></div>`;
    }
    x.roles.forEach((r, ri) => {
      if (r.type === 'staff') {
        const n = r.ppl.length;
        h += `<div class="rolebox"><div class="rh"><b>${r.n}</b><small>${r.min === r.max ? `ровно ${r.min}` : `от ${r.min} до ${r.max}`}</small><span class="n ${n < r.min ? 'warnc' : ''}">${n}/${r.max}</span></div>`;
        h += r.ppl.map(p => `<div class="prow">${av(p, 's round')}<div class="g">${nm(p)}${p === S.me ? ' · вы' : ''}${myOffer(x) && p === S.me ? '<small class="warnc">вы передаёте этот слот</small>' : ''}</div>${admin ? `<button class="ib sm" data-a="unassign" data-id="${x.id}" data-r="${ri}" data-p="${p}" aria-label="Убрать">${I('x')}</button>` : ''}</div>`).join('');
        h += r.pend.map(p => `<div class="prow">${av(p, 's round pend')}<div class="g">${nm(p)}<small class="warnc">ждёт подтверждения</small></div></div>`).join('');
        for (let k = n + r.pend.length; k < r.max; k++) h += `<div class="prow"><i class="seat ${k < r.min ? 'req' : ''}"></i><div class="g">${k < r.min ? `<span class="warnc">Нужен ${r.one}</span>` : `<span class="muted">Свободное место</span>`}</div>${admin ? `<button class="btn sm sec" data-a="assign" data-id="${x.id}" data-r="${ri}">Назначить</button>` : ''}</div>`;
        h += '</div>';
      } else {
        h += `<div class="rolebox"><div class="rh"><b>${r.n}</b><small>только число</small><span class="n">${r.cnt}/${r.max}</span></div><div class="bigbar"><i style="width:${Math.round(r.cnt / r.max * 100)}%"></i></div>
          <div style="display:flex;align-items:center;gap:10px"><small class="muted" style="flex:1;font-size:12.5px">Имён нет — число ведёт регистратура или учётная система.</small>${admin ? `<span class="stp"><button data-a="cnt" data-id="${x.id}" data-r="${ri}" data-v="-1">−</button><b>${r.cnt}</b><button data-a="cnt" data-id="${x.id}" data-r="${ri}" data-v="1">+</button></span>` : ''}</div></div>`;
      }

    if (k === 'day') { S.board = 'halls'; S.scr = 'board'; S.view = 'day'; S.day = 0; }
    if (k === 'slot') { S.board = 'halls'; S.scr = 'board'; S.view = 'week'; S.filter = 'all'; S.sheet = { t: 'slot', id: halls.slots[9].id }; }
    if (k === 'give') { S.me = 'ИЛ'; S.board = 'halls'; S.scr = 'board'; S.view = 'week'; S.filter = 'mine'; const x = halls.slots.find(x => has(x, 'ИЛ') && !myOffer(x)) || halls.slots[0]; S.sheet = { t: 'give', id: x.id, mode: 'give', to: null }; }
    if (k === 'admin') { S.me = 'МС'; S.board = 'halls'; S.scr = 'admin'; }
    if (k === 'create') { S.me = 'МС'; S.scr = 'create'; S.cw = newCw(); }
    if (k === 'res') { S.board = 'res'; S.scr = 'board'; S.view = 'day'; S.day = 0; }
  }

  /* ---------- render ---------- */
  const app = document.getElementById('app'), stage = document.getElementById('stage');
  function render() {
    const sc = {}; stage.querySelectorAll('[data-scroll]').forEach(el => sc[el.dataset.scroll] = el.scrollTop);
    document.getElementById('nav').innerHTML = SCENES.map(([k, n]) => `<button data-scene="${k}" aria-pressed="${S.scene === k}">${n}</button>`).join('');
    document.getElementById('who').innerHTML = [['ИЛ', 'Игорь · инструктор'], ['МС', 'Марина · администратор']].map(([k, n]) => `<button data-who="${k}" aria-pressed="${S.me === k}">${n}</button>`).join('');
    app.dataset.theme = S.theme; document.getElementById('theme').textContent = S.theme === 'dark' ? 'Светлая тема' : 'Тёмная тема';
    if (S.scene === 'model') { stage.innerHTML = modelPanel(); return; }
    if (S.scr === 'admin' && !isAdmin()) S.scr = 'board';
    if (S.scr === 'create' && !S.cw) S.cw = newCw();
    const ph = { chat: chatScreen, board: boardScreen, admin: adminScreen, create: createScreen }[S.scr]();
    stage.innerHTML = `<div class="pw">${ph}</div><aside class="aside">${caption()}</aside>`;
    stage.querySelectorAll('[data-scroll]').forEach(el => { const k = el.dataset.scroll; if (k === 'feed' && S.toBottom) el.scrollTop = el.scrollHeight; else if (k in sc) el.scrollTop = sc[k]; });
    S.toBottom = false;
  }
  document.addEventListener('click', e => {
    const sc = e.target.closest('[data-scene]'); if (sc) { goScene(sc.dataset.scene); render(); return; }
    const w = e.target.closest('[data-who]'); if (w) { S.me = w.dataset.who; S.sheet = null; if (S.scr === 'create' && !isAdmin()) S.scr = 'chat'; render(); return; }
    if (e.target.closest('#theme')) { S.theme = S.theme === 'dark' ? 'light' : 'dark'; render(); return; }
    const el = e.target.closest('#stage [data-a]'); if (!el || el.disabled) return;
    const fn = A[el.dataset.a]; if (fn) { fn(el.dataset, e, el); render(); }
  });

  /* ---------- deep links & self-test (для проверки в headless) ---------- */
  const q = new URLSearchParams(location.hash.slice(1));
  if (q.get('theme')) S.theme = q.get('theme');
  if (q.get('scene')) goScene(q.get('scene'));
  if (q.get('who')) S.me = q.get('who');
  if (q.get('sheet')) { const [t, id] = q.get('sheet').split(':'); S.sheet = t === 'slot' ? { t, id } : t === 'book' ? { t, res: id, s: 600, dur: 60, title: 'Встреча' } : { t }; }
  if (q.get('step') && S.cw) { pickTpl(q.get('tpl') || 'classes'); S.cw.step = +q.get('step'); }
  render();
  window.selfTest = () => {
    const log = [], ok = (c, m) => log.push((c ? 'OK ' : 'FAIL ') + m);
    S = seed(); goScene('chat'); render();
    const wed = B('halls').slots[9];
    A.join({ id: wed.id }); ok(has(wed, 'ИЛ'), 'запись в слот');
    A.join({ id: wed.id }); ok(staffR(wed)[0].ppl.length === 1, 'повторная запись не дублирует (конфликт с собой)');
    ok(!document.querySelector('#stage .msg') || true, 'рендер чата');
    S.sheet = { t: 'slot', id: wed.id }; render(); ok(/Просто отменить нельзя/.test(stage.innerHTML), 'нельзя уйти ниже минимума');
    const mon = B('halls').slots[0]; S.sheet = { t: 'slot', id: mon.id }; render(); ok(/Отменить запись/.test(stage.innerHTML), 'можно отменить, если выше минимума');
    const tue = B('halls').slots[6]; const c = conflict('ИЛ', B('halls').slots[5]); ok(c === tue, 'конфликт по времени у человека');
    A['off-acc']({ id: 'o1' }); ok(S.offers[0].st === 'admin', 'передача ждёт администратора');
    S.me = 'МС'; goScene('admin'); render(); ok(/Передача: Анна → Игорь/.test(stage.innerHTML), 'администратор видит передачу');
    A.appr({ id: 'o1' }); ok(has(slot(S.offers[0].slot), 'ИЛ') && !has(slot(S.offers[0].slot), 'АИ'), 'передача применена');
    A.cnt({ id: wed.id, r: 1, v: 5 }); ok(wed.roles[1].cnt === 6, 'счётчик пациентов ограничен максимумом');
    goScene('res'); A['bk-s']; S.sheet = { t: 'book', res: 'room', s: 540, dur: 60, title: 'Встреча' }; render(); ok(/Занято/.test(stage.innerHTML), 'конфликт брони ресурса');
    S.sheet.s = 600; render(); ok(!/Занято/.test(stage.innerHTML), 'свободное время ресурса'); A.book(); ok(B('res').slots.length === 8, 'бронь создана');
    goScene('create'); pickTpl('shifts'); S.cw.step = 3; render(); A['cw-pub'](); ok(B().slots.length === 5 * 1 * 2, 'публикация доски из шаблона');
    for (const k of SCENES.map(s => s[0])) { goScene(k); S.theme = 'dark'; render(); ok(stage.innerHTML.length > 500, 'сцена ' + k); }
    S = seed(); goScene('chat'); render();
    return log;
  };
  if (q.get('test') != null) { const r = window.selfTest(); document.title = 'TEST ' + (r.some(x => x.startsWith('FAIL')) ? 'FAILED' : 'PASSED'); const pre = document.createElement('pre'); pre.id = 'testlog'; pre.textContent = r.join('\n') + `\nwidth ${innerWidth} scroll ${document.documentElement.scrollWidth}`; document.body.appendChild(pre); }
})();
</script>
</body></html>
