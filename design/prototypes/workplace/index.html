<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Coma — рабочие функции, прототип</title></head><body>
<!-- Прототип рабочих (не ИИ) функций мобильного Coma. Токены и шаблоны — из design/prototypes/messenger-mobile. ?v=<вкладка или номер>&theme=dark -->
<style>
  .lab { font-family: var(--font-sans, -apple-system, "Segoe UI", Roboto, sans-serif); color: var(--foreground, #202023); }
  .lab * { box-sizing: border-box; }
  .bar { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin-bottom: 14px; }
  .seg { display: flex; gap: 2px; flex-wrap: wrap; padding: 3px; border-radius: 10px; background: var(--secondary, #f0f0f3); }
  .seg button, .tgl { font: inherit; font-size: 13px; border: 0; background: transparent; color: var(--muted-foreground, #686873); padding: 6px 11px; border-radius: 8px; cursor: pointer; }
  .seg button[aria-selected="true"] { background: var(--card, #fff); color: var(--foreground, #202023); font-weight: 600; box-shadow: 0 1px 2px rgba(0,0,0,.12); }
  .tgl { margin-left: auto; border: 1px solid var(--border, #e5e5e9); }
  .view { display: none; }
  .view.on { display: grid; grid-template-columns: repeat(auto-fit, minmax(290px, 1fr)); gap: 22px 18px; justify-items: center; }
  .slot { width: 100%; max-width: 340px; }
  .cap { font-size: 12.5px; line-height: 1.45; color: var(--muted-foreground, #686873); margin-top: 10px; }
  .cap b { color: var(--foreground, #202023); font-weight: 600; }

  /* ---------- Coma tokens ---------- */
  .coma {
    --canvas:#f6f6f7; --surface:#fff; --raised:#fff; --selected:#f0f0f3; --fg:#202023; --muted:#686873; --border:#e5e5e9; --border-strong:#d2d2d9;
    --primary:#174586; --primary-soft:#edf3fb; --on-primary:#fff; --action:#252528; --on-action:#fff;
    --danger:#c43245; --danger-soft:#fff0f1; --success:#18794e; --success-soft:#edf8f1; --warning:#9c650b; --warning-soft:#fff8e7;
    --own:#174586; --own-fg:#fff; --own-muted:rgba(255,255,255,.72); --own-track:rgba(255,255,255,.34);
    --overlay:rgba(20,20,26,.36); --shadow:0 8px 24px rgba(20,20,30,.10); --mascot-body:#174586; --mascot-feet:#242831; --mascot-plate:#fff;
    --f-blue:#2f6fca; --f-violet:#7456c9; --f-green:#2b7754; --f-orange:#ac5a25; --f-pink:#ae457b; --f-teal:#227770;
    --a1:#e5eee6; --a1f:#4d6b54; --a2:#e8edf4; --a2f:#4c6280; --a3:#ece7f5; --a3f:#6f598e; --a4:#f3e8e9; --a4f:#8e505b; --a5:#f4ebde; --a5f:#806039;
    color: var(--fg); font-size: 15px; line-height: 1.35;
  }
  .coma[data-theme="dark"] {
    --canvas:#151517; --surface:#1d1d20; --raised:#27272c; --selected:#2b2b30; --fg:#f0f0f2; --muted:#a0a0aa; --border:#323237; --border-strong:#46464f;
    --primary:#86aff0; --primary-soft:#243349; --on-primary:#172132; --action:#eeeeef; --on-action:#222225;
    --danger:#f0717f; --danger-soft:#3a2126; --success:#5fc594; --success-soft:#1c3327; --warning:#e0a94a; --warning-soft:#3a2f1a;
    --own:#2c4a78; --own-fg:#f3f6fb; --own-muted:rgba(243,246,251,.7); --own-track:rgba(243,246,251,.3);
    --overlay:rgba(0,0,0,.55); --shadow:0 8px 24px rgba(0,0,0,.4); --mascot-body:#86aff0; --mascot-feet:#fff; --mascot-plate:#151517;
    --f-blue:#7fb0f2; --f-violet:#ab97ee; --f-green:#6fc59c; --f-orange:#e59a68; --f-pink:#e58bb7; --f-teal:#63c4bb;
    --a1:#26332a; --a1f:#a6c8ae; --a2:#262e3a; --a2f:#a9bedb; --a3:#2f2a3b; --a3f:#c3b3e2; --a4:#3a282b; --a4f:#e2adb5; --a5:#3a3023; --a5f:#dcbf94;
  }
  .phone { position: relative; width: 100%; height: 690px; border-radius: 38px; border: 1px solid var(--border-strong); background: var(--canvas); overflow: hidden; display: flex; flex-direction: column; box-shadow: var(--shadow); }
  .status { display: flex; justify-content: space-between; padding: 12px 26px 4px; font-size: 13px; font-weight: 600; flex: none; }
  .status i { display: inline-block; width: 22px; height: 11px; border: 1.5px solid var(--fg); border-radius: 4px; position: relative; opacity: .8; }
  .status i::after { content: ""; position: absolute; inset: 1.5px 5px 1.5px 1.5px; background: var(--fg); border-radius: 1.5px; }
  .ic { width: 22px; height: 22px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; flex: none; }
  .ib { width: 40px; height: 40px; border-radius: 20px; border: 0; background: transparent; color: var(--fg); display: grid; place-items: center; cursor: pointer; flex: none; padding: 0; }
  .ib.soft { background: var(--selected); }
  .ib.pri { background: var(--primary); color: var(--on-primary); }
  .ib.dng { color: var(--danger); }
  .av { width: 48px; height: 48px; border-radius: 16px; display: grid; place-items: center; font-weight: 600; font-size: 16px; flex: none; position: relative; }
  .av.round { border-radius: 50%; } .av.s { width: 30px; height: 30px; border-radius: 10px; font-size: 11.5px; } .av.s.round { border-radius: 50%; }
  .av.m { width: 36px; height: 36px; border-radius: 12px; font-size: 13px; }
  .av .on { position: absolute; right: -2px; bottom: -2px; width: 13px; height: 13px; border-radius: 50%; background: var(--success); border: 2.5px solid var(--canvas); }
  .c1{background:var(--a1);color:var(--a1f)}.c2{background:var(--a2);color:var(--a2f)}.c3{background:var(--a3);color:var(--a3f)}.c4{background:var(--a4);color:var(--a4f)}.c5{background:var(--a5);color:var(--a5f)}
  .cag{background:var(--primary-soft);color:var(--primary)}

  /* chat list */
  .top { display: flex; align-items: center; gap: 8px; padding: 6px 14px 8px; flex: none; }
  .top h1 { font-size: 22px; font-weight: 700; margin: 0; flex: 1; letter-spacing: -.01em; }
  .plate { width: 34px; height: 34px; border-radius: 11px; background: var(--mascot-plate); border: 1px solid var(--border); display: grid; place-items: center; }
  .search { margin: 0 14px 10px; height: 38px; border-radius: 12px; background: var(--selected); display: flex; align-items: center; gap: 8px; padding: 0 12px; color: var(--muted); font-size: 15px; flex: none; }
  .search .ic { width: 18px; height: 18px; }
  .folders { display: flex; gap: 6px; padding: 0 14px 10px; overflow-x: auto; flex: none; scrollbar-width: none; border-bottom: 1px solid var(--border); }
  .folders::-webkit-scrollbar { display: none; }
  .fd { font: inherit; font-size: 14px; font-weight: 500; white-space: nowrap; height: 34px; padding: 0 12px; border-radius: 17px; border: 1px solid var(--border); background: var(--surface); color: var(--muted); display: flex; align-items: center; gap: 6px; cursor: pointer; flex: none; }
  .fd[aria-selected="true"] { background: var(--action); color: var(--on-action); border-color: var(--action); }
  .fd .dot { width: 8px; height: 8px; border-radius: 50%; }
  .fd .n { font-size: 12px; font-weight: 600; opacity: .8; }
  .fd.add { width: 34px; padding: 0; justify-content: center; border-style: dashed; }
  .fd.add .ic { width: 16px; height: 16px; }
  .list { flex: 1; overflow-y: auto; scrollbar-width: none; }
  .list::-webkit-scrollbar, .feed::-webkit-scrollbar, .sheet::-webkit-scrollbar { display: none; }
  .row { display: flex; gap: 12px; padding: 9px 14px; align-items: center; }
  .row .bd { flex: 1; min-width: 0; }
  .row .l1 { display: flex; align-items: baseline; gap: 6px; }
  .row .nm { font-weight: 600; font-size: 15.5px; flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .row .tm { font-size: 12px; color: var(--muted); flex: none; }
  .row .l2 { display: flex; gap: 6px; align-items: center; margin-top: 2px; }
  .row .pv { color: var(--muted); font-size: 14px; flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .row .pv em { font-style: normal; color: var(--fg); } .row .pv .dr { color: var(--danger); }
  .row .pv .ic, .row .mk .ic { width: 14px; height: 14px; vertical-align: -2px; }
  .bdg { min-width: 20px; height: 20px; padding: 0 6px; border-radius: 10px; background: var(--primary); color: var(--on-primary); font-size: 12px; font-weight: 700; display: grid; place-items: center; flex: none; }
  .bdg.mute { background: var(--border-strong); color: var(--fg); } .bdg.at { padding: 0 4px; }
  .mk { color: var(--muted); flex: none; }
  .tag { font-size: 10.5px; font-weight: 600; letter-spacing: .02em; padding: 1px 5px; border-radius: 5px; background: var(--primary-soft); color: var(--primary); flex: none; }
  .tabs { display: flex; border-top: 1px solid var(--border); background: var(--surface); padding: 6px 6px 18px; flex: none; }
  .tabs div { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 2px; font-size: 11px; font-weight: 500; color: var(--muted); position: relative; }
  .tabs div.on { color: var(--primary); }
  .tabs .pip { position: absolute; top: -2px; left: calc(50% + 6px); min-width: 16px; height: 16px; border-radius: 8px; background: var(--danger); color: #fff; font-size: 10px; font-weight: 700; display: grid; place-items: center; padding: 0 4px; }
  .fab { position: absolute; right: 16px; bottom: 86px; width: 52px; height: 52px; border-radius: 18px; background: var(--primary); color: var(--on-primary); display: grid; place-items: center; box-shadow: var(--shadow); }

  /* sheets */
  .dim { position: absolute; inset: 0; background: var(--overlay); z-index: 5; }
  .sheet { position: absolute; left: 0; right: 0; bottom: 0; z-index: 6; background: var(--surface); border-radius: 24px 24px 0 0; padding: 8px 16px 22px; max-height: 88%; overflow-y: auto; scrollbar-width: none; }
  .grab { width: 36px; height: 4px; border-radius: 2px; background: var(--border-strong); margin: 0 auto 12px; }
  .sheet h2 { font-size: 17px; font-weight: 700; margin: 0 0 12px; display: flex; align-items: center; }
  .sheet h2 span { flex: 1; } .sheet h2 a { font-size: 15px; font-weight: 600; color: var(--primary); cursor: pointer; }
  .lbl { font-size: 12px; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: .04em; margin: 14px 0 7px; }
  .field { height: 44px; border-radius: 12px; border: 1px solid var(--border-strong); background: var(--surface); display: flex; align-items: center; padding: 0 13px; font-size: 16px; }
  .field.focus { border-color: var(--primary); box-shadow: 0 0 0 3px var(--primary-soft); }
  .sw { display: flex; gap: 10px; } .sw i { width: 30px; height: 30px; border-radius: 50%; display: grid; place-items: center; color: #fff; }
  .sw i.sel { box-shadow: 0 0 0 2px var(--surface), 0 0 0 4px currentColor; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; }
  .chip { font-size: 14px; height: 34px; padding: 0 12px; border-radius: 17px; border: 1px solid var(--border); display: flex; align-items: center; gap: 6px; color: var(--fg); background: var(--surface); }
  .chip.on { background: var(--primary-soft); border-color: transparent; color: var(--primary); font-weight: 600; }
  .chip .ic { width: 15px; height: 15px; }
  .opt { display: flex; align-items: center; gap: 12px; padding: 7px 0; font-size: 15px; }
  .opt .g { flex: 1; min-width: 0; } .opt small { display: block; color: var(--muted); font-size: 13px; }
  .cb { width: 22px; height: 22px; border-radius: 7px; border: 1.5px solid var(--border-strong); display: grid; place-items: center; flex: none; color: var(--on-primary); }
  .cb.on { background: var(--primary); border-color: var(--primary); } .cb .ic { width: 14px; height: 14px; stroke-width: 2.6; }
  .btn { height: 46px; border-radius: 14px; border: 0; font: inherit; font-size: 16px; font-weight: 600; background: var(--action); color: var(--on-action); width: 100%; margin-top: 14px; cursor: pointer; }
  .btn { white-space: nowrap; } .btn.sec { background: var(--selected); color: var(--fg); } .btn.sm { height: 34px; font-size: 14px; border-radius: 10px; width: auto; padding: 0 13px; margin: 0; }
  .btn.pri { background: var(--primary); color: var(--on-primary); }
  .grid4 { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
  .tile { display: flex; flex-direction: column; align-items: center; gap: 6px; font-size: 12px; color: var(--muted); text-align: center; }
  .tile i { width: 54px; height: 54px; border-radius: 18px; background: var(--selected); color: var(--fg); display: grid; place-items: center; }
  .tile i.ac { background: var(--primary-soft); color: var(--primary); }
  .ph { display: grid; grid-template-columns: repeat(4, 1fr); gap: 4px; margin-bottom: 14px; }
  .ph b { aspect-ratio: 1; border-radius: 10px; display: block; }

  /* conversation */
  .chead { display: flex; align-items: center; gap: 8px; padding: 2px 8px 8px; border-bottom: 1px solid var(--border); background: var(--surface); flex: none; }
  .chead .t { flex: 1; min-width: 0; } .chead .t b { display: block; font-size: 16px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; } .chead .t small { color: var(--muted); font-size: 12.5px; }
  .strip { display: flex; align-items: center; gap: 8px; padding: 7px 14px; font-size: 13px; background: var(--surface); border-bottom: 1px solid var(--border); color: var(--muted); flex: none; cursor: pointer; }
  .strip .ic { width: 16px; height: 16px; color: var(--primary); } .strip b { color: var(--fg); font-weight: 600; } .strip span { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .feed { flex: 1; overflow-y: auto; padding: 10px 10px 6px; display: flex; flex-direction: column; gap: 3px; scrollbar-width: none; }
  .day { align-self: center; font-size: 12px; font-weight: 600; color: var(--muted); background: var(--selected); border-radius: 10px; padding: 3px 10px; margin: 4px 0 8px; }
  .msg { display: flex; gap: 7px; align-items: flex-end; max-width: 86%; margin-top: 5px; }
  .msg.me { align-self: flex-end; }
  .bub { background: var(--surface); border: 1px solid var(--border); border-radius: 18px 18px 18px 6px; padding: 7px 11px 6px; min-width: 0; }
  .me .bub { background: var(--own); border-color: transparent; color: var(--own-fg); border-radius: 18px 18px 6px 18px; }
  .who { font-size: 12.5px; font-weight: 600; margin-bottom: 1px; display: flex; gap: 5px; align-items: center; }
  .meta { font-size: 11px; color: var(--muted); float: right; margin: 5px 0 -1px 10px; display: flex; gap: 3px; align-items: center; }
  .me .meta { color: var(--own-muted); } .meta .ic { width: 14px; height: 14px; }
  .rx { display: flex; gap: 4px; margin-top: 5px; flex-wrap: wrap; clear: both; }
  .rx span { font-size: 12.5px; padding: 2px 8px; border-radius: 11px; background: var(--selected); font-weight: 600; } .rx span.my { background: var(--primary-soft); color: var(--primary); }
  .quote { border-left: 3px solid var(--primary); padding: 1px 0 1px 8px; margin-bottom: 4px; font-size: 13px; color: var(--muted); } .quote b { display: block; color: var(--primary); font-size: 12.5px; }
  .me .quote { border-color: var(--own-fg); color: var(--own-muted); } .me .quote b { color: var(--own-fg); }
  .voice { display: flex; align-items: center; gap: 10px; width: 214px; max-width: 100%; }
  .vb { flex: 1; min-width: 0; }
  .vt { width: 28px; height: 28px; border-radius: 50%; border: 0; padding: 0; background: var(--selected); color: var(--muted); display: grid; place-items: center; flex: none; align-self: flex-start; margin-top: 2px; } .vt .ic { width: 15px; height: 15px; }
  .vt.on { background: var(--primary-soft); color: var(--primary); } .me .vt { background: var(--own-track); color: var(--own-fg); }
  .nd { width: 6px; height: 6px; border-radius: 50%; background: var(--primary); } .me .nd { background: var(--own-fg); }
  .voice .pl { width: 42px; height: 42px; border-radius: 50%; background: var(--primary); color: var(--on-primary); display: grid; place-items: center; flex: none; cursor: pointer; }
  .me .voice .pl { background: var(--own-fg); color: var(--own); }
  .voice .pl .ic { width: 18px; height: 18px; fill: currentColor; stroke: none; }
  .wave { display: flex; align-items: center; gap: 2px; height: 24px; flex: 1; overflow: hidden; }
  .wave i { width: 2.500px; border-radius: 2px; background: var(--muted); opacity: .4; flex: none; } .wave i.p { background: var(--primary); opacity: 1; }
  .me .wave i { background: var(--own-fg); } .me .wave i.p { background: var(--own-fg); }
  .vmeta { display: flex; gap: 6px; align-items: center; font-size: 11.500px; color: var(--muted); margin-top: 2px; font-variant-numeric: tabular-nums; } .vmeta .tm { margin-left: auto; display: flex; gap: 3px; align-items: center; } .vmeta .tm .ic { width: 14px; height: 14px; } .me .vmeta { color: var(--own-muted); }
  .spd { font-weight: 700; padding: 1px 6px; border-radius: 8px; background: var(--selected); color: var(--fg); font-size: 11px; } .me .spd { background: var(--own-track); color: var(--own-fg); }
  .tr { font-size: 13.5px; margin-top: 6px; padding-top: 6px; border-top: 1px solid var(--border); color: var(--fg); clear: both; } .tr small { display: block; font-size: 11px; color: var(--muted); font-weight: 600; margin-bottom: 1px; }
  .card { border: 1px solid var(--border); border-radius: 12px; padding: 10px; margin-top: 6px; background: var(--canvas); clear: both; }
  .card b { font-size: 14px; } .card p { margin: 2px 0 8px; font-size: 13px; color: var(--muted); }
  .prog { height: 6px; border-radius: 3px; background: var(--border); overflow: hidden; margin-bottom: 9px; } .prog i { display: block; height: 100%; width: 78%; background: var(--success); border-radius: 3px; }
  .card .acts { display: flex; gap: 6px; flex-wrap: wrap; }
  .sched { align-self: flex-end; max-width: 86%; margin-top: 5px; }
  .sched .bub { background: transparent; border: 1.5px dashed var(--border-strong); border-radius: 18px 18px 6px 18px; color: var(--fg); }
  .sched .when { font-size: 11.5px; color: var(--primary); font-weight: 600; display: flex; gap: 4px; align-items: center; margin-top: 3px; } .sched .when .ic { width: 13px; height: 13px; }

  .phone.white { background: var(--surface); } .phone.white .av .on { border-color: var(--surface); }
  .phone:has(.chead) .status, .phone.white .status, .phone.white .top { background: var(--surface); }
  .thr { display: flex; align-items: center; gap: 7px; margin-top: 7px; padding-top: 7px; border-top: 1px solid var(--border); clear: both; font-size: 12px; color: var(--muted); cursor: pointer; }
  .thr b { color: var(--primary); font-size: 13px; font-weight: 600; white-space: nowrap; } .thr > span:not(.stack) { white-space: nowrap; } .thr > .ic { width: 15px; height: 15px; margin-left: auto; }
  .stack { display: flex; } .stack .av { width: 22px; height: 22px; border-radius: 50%; font-size: 9px; box-shadow: 0 0 0 2px var(--surface); margin-left: -5px; } .stack .av:first-child { margin-left: 0; }
  .meta .star { color: var(--warning); fill: currentColor; width: 12px; height: 12px; }
  .ctx { position: absolute; inset: 0; z-index: 6; background: var(--overlay); backdrop-filter: blur(5px); -webkit-backdrop-filter: blur(5px); display: flex; flex-direction: column; justify-content: flex-end; align-items: flex-end; gap: 8px; padding: 0 10px 20px; }
  .ctx .msg { margin: 0; }
  .menu { width: 272px; background: var(--raised); border: 1px solid var(--border); border-radius: 18px; box-shadow: var(--shadow); padding: 5px; }
  .menu .qr { display: flex; justify-content: space-between; padding: 3px 3px 8px; margin-bottom: 4px; border-bottom: 1px solid var(--border); }
  .menu .qr span { width: 40px; height: 40px; border-radius: 12px; display: grid; place-items: center; font-size: 22px; } .menu .qr span.my { background: var(--primary-soft); }
  .menu .qr span.mo { border: 1px dashed var(--border-strong); color: var(--muted); } .menu .qr .ic { width: 17px; height: 17px; }
  .mi { display: flex; align-items: center; gap: 12px; height: 39px; padding: 0 10px; border-radius: 10px; font-size: 15px; } .mi .ic { width: 19px; height: 19px; color: var(--muted); }
  .mi.d, .mi.d .ic { color: var(--danger); } .mi small { margin-left: auto; color: var(--muted); font-size: 12.500px; }
  .md { height: 1px; background: var(--border); margin: 4px 0; }
  .troot { background: var(--surface); padding: 12px 14px; border-bottom: 1px solid var(--border); flex: none; }
  .troot .h { display: flex; gap: 9px; align-items: center; margin-bottom: 6px; } .troot .h b { font-size: 14.500px; } .troot .h small { color: var(--muted); font-size: 12px; display: block; }
  .tdiv { display: flex; align-items: center; gap: 10px; font-size: 12px; font-weight: 600; color: var(--muted); margin: 4px 4px 2px; } .tdiv::after { content: ""; flex: 1; height: 1px; background: var(--border); }
  .also { display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--muted); padding: 0 6px 7px; } .also .cb { width: 18px; height: 18px; border-radius: 6px; }
  .imp { display: flex; gap: 10px; padding: 11px 14px; border-bottom: 1px solid var(--border); background: var(--surface); }
  .imp .bd { flex: 1; min-width: 0; } .imp .l1 { display: flex; gap: 6px; align-items: baseline; } .imp .l1 b { font-size: 14.500px; } .imp .l1 span { margin-left: auto; font-size: 12px; color: var(--muted); flex: none; }
  .imp .ch { font-size: 12.500px; color: var(--primary); font-weight: 500; margin-bottom: 3px; } .imp p { margin: 0; font-size: 14.500px; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }

  const t1 = {

      { id: 'A', label: 'Автор · администратор', cap: '<b>Живой.</b> «+» → «Подтвердить» (или удержите кнопку отправки) — над полем появится плашка со сроком, срок меняется по нажатию. Отправьте: счётчик под сообщением растёт, нажмите на него — откроется «Кто подтвердил».', r: s => {

        const pop = a.pop ? `<div class="pop"><div data-a="a-flagpop">${I('dcheck')}С подтверждением</div><div>${I('clock')}Отправить позже</div><div>${I('belloff')}Отправить без звука</div></div>` : '';
        let sh = '';
        if (a.sheet === 'plus') sh = plusSheet('a-tile', 'a-close', 'ack');
        if (a.sheet === 'due') sh = sheet(`<h2><span>Подтвердить до</span></h2><div class="q2">${[['Без срока','просто отметка'],['Сегодня','до 18:00'],['Завтра','до 12:00'],['До пятницы','20 ноября, 18:00']].map(([b, sm], k) => { const v = ['без срока','сегодня до 18:00','завтра до 12:00','до пт, 18:00'][k]; return `<div class="qo ${a.due === v ? 'sel' : ''}" data-a="a-duepick" data-v="${v}" style="cursor:pointer"><b>${b}</b><small>${sm}</small></div>`; }).join('')}</div>
          <div class="opt" style="margin-top:10px"><div class="g">Напомнить неподтвердившим за 2 часа до срока<small>Им придёт пуш, вам — итог</small></div>${tg(true, 'noop')}</div>
          <div class="opt"><div class="g">Показывать получателям, сколько уже подтвердили<small>«Подтвердили 12 из 15» под кнопкой</small></div>${tg(true, 'noop')}</div><button class="btn pri" data-a="a-close">Готово</button>`, 'a-close');
        return `<div class="phone">${st}${chead('Общий', '15 участников · 6 в сети', av('ОБ', 'c1', 'm'))}<div class="feed" data-scroll="feed">${day('Сегодня')}
          ${inMsg('ДР', 'Кабинет 2 свободен после 15:00, если кому нужен.', '8:40')}${inMsg('ОЧ', 'Ключи от раздевалки на стойке.', '8:52')}${msgs}</div>
          ${composer({ top, plus: 'a-plus', bind: 'a.text', value: a.text, send: 'a-send', hold: 'a-hold', pop })}${sh}${toastH(s, 'A')}</div>`;

          <div class="row">${av('СН', 'c2')}<div class="bd"><div class="l1"><span class="nm">Слоты на неделю</span><span class="tm">8:50</span></div><div class="l2"><span class="pv">Доска на 16–20 ноября · свободно 5</span><span class="bdg at">@</span></div></div></div>
          <div class="row">${av('ВР', 'c5')}<div class="bd"><div class="l1"><span class="nm">Врачи</span><span class="tm">Вчера</span></div><div class="l2"><span class="pv"><em>Дина:</em> обновила график осмотров</span><span class="mk">${I('belloff')}</span><span class="bdg mute">12</span></div></div></div>
          </div>${tabbar(0, 'd-tab', { 2: need ? 3 : 2 })}</div>`;
        return `<div class="phone white">${st}<div class="top"><h1>Важные</h1><button class="ib soft">${I('search')}</button></div>
          <div class="folders" style="background:var(--surface)"><span class="fd" aria-selected="true">Ждут вас<span class="n">${need ? 3 : 2}</span></span><span class="fd">Сохранённые</span><span class="fd">Напоминания</span><span class="fd">Задачи</span></div>
          <div class="list">
          ${need ? imp(pa('МС', 'm round'), 'Марина Соколова', 'Общий · подтвердить до пт, 18:00', '9:10', REG, `<div style="display:flex;gap:6px;margin-top:8px"><button class="btn sm pri" data-a="r-ack">${I('check', 'width:16px;height:16px;vertical-align:-3px')} Ознакомлен(а)</button><button class="btn sm sec">Открыть</button></div>`) : ''}

          ${imp(pa('ДР', 'm round'), 'Задача от Дины Рябовой', 'Инструкторы · зал · срок завтра, 12:00', 'Вчера', 'Проверить аптечку в большом зале, докупить бинты', `<div style="margin-top:8px"><button class="btn sm sec">Готово</button></div>`)}
          <div class="sect">Сохранённые</div>${imp(pa('МС', 'm round'), 'Марина Соколова', 'Инструкторы · зал', '9:12', 'Коллеги, завтра с 9:00 до 13:00 нужен инструктор в большой зал. Кто возьмёт слот?')}

        if (a.flag) { a.n = 0; a.flag = false; const step = () => later(s, 450, () => { if (a.n < 12) { a.n++; step(); } }); step(); } },

      '1) Кто может включать — все или только админы/владельцы чата? 2) Показывать ли получателям «Подтвердили 12 из 15» (давит, но мотивирует)? 3) Текст кнопки: «Ознакомлен(а)» или нейтральное «Подтверждаю»? 4) Нужен ли экспорт списка (для проверок) — это уже «юридическая» функция. 5) Можно ли редактировать сообщение после подтверждений — сбрасывать ли отметки?'),

  /* ======================================================================
     2. ОПРОСЫ

  const mkPoll = (q, opts, o = {}) => ({ q, opts: opts.map(([t, v]) => ({ t, v: v || [] })), multi: !!o.multi, anon: !!o.anon, due: o.due || '', closed: !!o.closed, me: o.me || 'ИЛ', author: o.author || 'МС', members: o.members || 14 });
  const voters = p => new Set(p.opts.flatMap(o => o.v)).size;
  const pollH = (p, id, ph) => {
    const total = voters(p), mine = p.opts.map((o, i) => o.v.includes(p.me) ? i : -1).filter(i => i >= 0);
    const show = mine.length > 0 || p.closed || p.author === p.me;
    const max = Math.max(...p.opts.map(o => o.v.length));
    const opts = p.opts.map((o, i) => { const pct = total ? Math.round(o.v.length / total * 100) : 0, sel = mine.includes(i), win = p.closed && o.v.length === max && max > 0;

          ${s.d.banner && s.tasks[3].st !== 'done' ? `<div class="ibanner" data-a="td-hide"><span class="appi">${mascot(12, 14)}</span><div class="bd"><b>Через час срок задачи</b>Повесить новое расписание бассейна<small> · Слоты на неделю</small></div></div>` : ''}${toastH(s, 'D')}</div>`;

    ],

  /* ======================================================================
     5. СЛОТЫ
     ====================================================================== */
  const HALLS = [['big', 'Большой зал'], ['small', 'Малый зал'], ['pool', 'Бассейн']];
  const DAYS = [['Пн', 16], ['Вт', 17], ['Ср', 18], ['Чт', 19], ['Пт', 20]];
  const TIMES = ['9:00–13:00', '13:00–17:00'];
  const seedSlots = () => {
    const A = { // hall-day-time -> person|null
      'big-0-0':'СК','big-0-1':'ОБ','big-1-0':'АИ','big-1-1':null,'big-2-0':'ИЛ','big-2-1':'ОЧ','big-3-0':'ПМ','big-3-1':null,'big-4-0':'СК','big-4-1':'ТВ',
      'small-0-0':'ТВ','small-0-1':'ИЛ','small-1-0':'ОЧ','small-1-1':'НК','small-2-0':null,'small-2-1':'АИ','small-3-0':'ОЧ','small-3-1':'ОБ','small-4-0':'НК','small-4-1':null,
      'pool-0-0':'АП','pool-0-1':'ПМ','pool-1-0':'АП','pool-1-1':'ТВ','pool-2-0':'АП','pool-2-1':'НК','pool-3-0':'ИЛ','pool-3-1':'АИ','pool-4-0':null,'pool-4-1':'ПМ' };
    return Object.entries(A).map(([id, who]) => { const [h, d, t] = id.split('-'); return { id, h, d: +d, t: +t, who, offer: null }; });
  };
  const hallN = h => HALLS.find(x => x[0] === h)[1];
  const slotT = x => `${hallN(x.h)} · ${DAYS[x.d][0].toLowerCase()} ${DAYS[x.d][1]}, ${TIMES[x.t]}`;

      'Администратор раз в неделю создаёт доску из шаблона (залы × дни × часы) — она закрепляется в чате «Слоты на неделю». Инструктор записывается одной кнопкой; свой слот может отдать: конкретному свободному коллеге или «всем», с согласием администратора или без. Пока замену не подтвердили, слот за ним. Накануне в 18:00 — пуш и личная карточка «Завтра ваш слот». Администратор видит незакрытые, зовёт в чат или назначает. <b>Вариант А</b> лучше для планирования и администратора, <b>Б</b> — для инструктора с телефона. Можно оба: А по умолчанию у админа, Б у остальных, переключатель в шапке.',

  /* ======================================================================
     6. СТАТУС «ОТСУТСТВУЮ»
     ====================================================================== */
  const KINDS = { vac: ['🌴', 'В отпуске', 'в отпуске'], recv: ['🩺', 'На приёме', 'на приёме'], out: ['🚗', 'На выезде', 'на выезде'], dnd: ['🔕', 'Не беспокоить', 'не беспокоить'] };
  const UNT = { vac: ['20 ноября', '30 ноября', 'выбрать дату'], recv: ['14:00', '16:00', 'конец дня'], out: ['13:00', '18:00', 'завтра'], dnd: ['1 час', '18:00', 'завтра 9:00'] };
  const stLine = a => a ? `${KINDS[a.kind][2]} до ${a.until}` : '';
  const t6 = {
    init: () => ({ away: { kind: 'vac', until: '20 ноября', auto: true, text: 'Я в отпуске до 20 ноября. По слотам — к Марине Соколовой.', sub: 'МС', mute: true },

        const a = s.away, d = s.draft;
        const sh = s.sheet ? sheet(`<h2><span>Статус</span>${s.away ? '<a data-a="aw-clear">Снять</a>' : ''}</h2><div class="q3">${Object.entries(KINDS).map(([k, [e, n]]) => `<div class="qo ${d.kind === k ? 'sel' : ''}" data-a="aw-kind" data-v="${k}" style="cursor:pointer"><span class="e">${e}</span><b>${n}</b></div>`).join('')}</div>
          <div class="lbl">До</div><div class="chips">${UNT[d.kind].map(v => chip(d.until === v, v, 'aw-until')).join('')}</div>
          <div class="opt" style="margin-top:10px"><div class="g">Автоответ в личных сообщениях<small>Один раз каждому собеседнику</small></div>${tg(d.auto, 'aw-tg', 'auto')}</div>
          ${d.auto ? `<textarea class="fi" data-bind="draft.text">${esc(d.text)}</textarea>` : ''}
          <div class="lbl">Вместо меня</div><div class="chips">${['МС', 'ОЧ', ''].map(k => `<span class="chip ${d.sub === k ? 'on' : ''}" data-a="aw-sub" data-v="${k}">${k ? first(k) + ' ' + PP[k][0].split(' ')[1][0] + '.' : 'Никого'}</span>`).join('')}</div>
          <div class="opt" style="margin-top:8px"><div class="g">Не присылать уведомления<small>кроме срочных от администратора</small></div>${tg(d.mute, 'aw-tg', 'mute')}</div>
          <button class="btn pri" data-a="aw-save">Сохранить</button>`, 'aw-close') : '';
        return `<div class="phone white">${st}<div class="top"><h1>Ещё</h1></div><div class="list" style="background:var(--canvas);padding-top:6px">

          <div class="stbtn" data-a="aw-open"><span class="e ${a ? '' : 'none'}">${a ? KINDS[a.kind][0] : I('moon', 'width:18px;height:18px')}</span><div class="g">${a ? KINDS[a.kind][1] + ' до ' + a.until : 'Установить статус'}<small>${a ? (a.auto ? 'Автоответ включён' : 'Без автоответа') + (a.sub ? ' · вместо меня: ' + first(a.sub) : '') : 'Отпуск, приём, выезд, не беспокоить'}</small></div>${I('right', 'color:var(--muted)')}</div>

          </div>${tabbar(4)}${sh}${toastH(s, 'A')}</div>`;
      } },
      { id: 'B', label: 'Личка: шапка и автоответ', cap: '<b>Живой.</b> В шапке вместо «в сети» — статус. Под шапкой — кто замещает, с переходом в чат. Отправьте сообщение — придёт автоответ (помечен, один раз). Без статуса всё как обычно.', r: s => {
        const a = s.away;
        const msgs = s.dm.msgs.map(m => m.auto ? `<div class="msg auto">${pa('АИ')}<div class="bub"><div class="who" style="color:${colf('АИ')}">Анна Иванова <span class="autot">АВТООТВЕТ</span></div>${esc(m.t)}<span class="meta">9:41</span></div></div>` : meMsg(esc(m.t), '9:41')).join('');
        return `<div class="phone">${st}${chead('Анна Иванова', a ? `<span class="stl">${KINDS[a.kind][0]} ${stLine(a)}</span>` : 'была в сети в 9:30', pa('АИ', 'm round', a ? `<span class="stx">${KINDS[a.kind][0]}</span>` : ''))}
          ${a && a.sub ? `<div class="strip">${I('swap')}<span>Вместо Анны — <b>${nm(a.sub)}</b></span>${I('right', 'color:var(--muted)')}</div>` : ''}
          <div class="feed" data-scroll="feed">${day('Вчера')}${inMsg('АИ', 'С понедельника ухожу в отпуск, слоты в бассейне отдала.', '17:40')}${meMsg('Хорошего отдыха!', '17:45')}${day('Сегодня')}${msgs}</div>

      { id: 'C', label: '@упоминание в группе', cap: '<b>Живой.</b> Выберите Анну в подсказке — над полем появится «Анна в отпуске — ответит позже» и предложение упомянуть замещающего. Отправьте — под сообщением тихая строка, видна только вам.', r: s => {
        const a = s.away, m = s.mt;
        const sug = m.stage === 'suggest' ? `<div class="sug">${[['АИ'], ['АП']].map(([k]) => `<div class="su" data-a="mt-pick" data-v="${k}">${pa(k, 'm round', k === 'АИ' && a ? `<span class="stx">${KINDS[a.kind][0]}</span>` : '')}<div class="g">${nm(k)}${k === 'АИ' && a ? `<small class="aw">${KINDS[a.kind][0]} ${stLine(a)}</small>` : `<small>${PP[k][2]} · в сети</small>`}</div></div>`).join('')}</div>` : '';
        const txt = m.stage === 'suggest' ? '@А' : m.stage === 'picked' ? `<span class="ment">@${m.who === 'АИ' ? 'Анна' : m.who === 'МС' ? 'Марина' : 'Артём'}</span> сможешь в среду подменить в бассейне?` : '';
        const hint = m.stage === 'picked' && m.who === 'АИ' && a ? `<div class="hint2"><span class="e">${KINDS[a.kind][0]}</span><span>Анна ${stLine(a)} — ответит позже.${a.sub ? ` <a data-a="mt-sub">Упомянуть ${first(a.sub).replace('Марина', 'Марину')}</a>` : ''}</span></div>` : '';
        const msgs = m.msgs.map(x => meMsg(`<span class="ment">@${x.n}</span> сможешь в среду подменить в бассейне?`, '9:41') + (x.away ? sysl(`${x.away} Уведомление придёт ей без звука · видно только вам`) : '')).join('');
        return `<div class="phone">${st}${chead('Инструкторы · зал', '9 участников · 4 в сети', av('ИЗ', 'c1', 'm'))}<div class="feed" data-scroll="feed">${day('Сегодня')}${inMsg('МС', 'В среду в бассейне нужен человек на утро.', '9:30')}${msgs}</div>
          <div class="cmp">${hint}<div class="cl"><button class="ib soft">${I('plus')}</button><div class="inp"><div class="txt ${txt ? '' : 'phd'}">${txt || 'Сообщение'}</div><button class="ib">${I('smile')}</button></div><button class="ib ${txt ? 'pri' : 'soft'}" data-a="${m.stage === 'picked' ? 'mt-send' : m.stage === 'sent' ? 'mt-reset' : 'noop'}">${I(txt ? 'up' : 'mic')}</button></div>${sug}</div>${toastH(s, 'C')}</div>`;
      } },
      { id: 'D', label: 'Люди: кто на месте', cap: '<b>Список людей</b> («Ещё → Люди»): у аватара значок статуса, под именем — до когда. Фильтр «Отсутствуют» — быстро понять, кого нет. Статус Анны берётся из первого телефона.', r: s => {
        const a = s.away;
        const P2 = [['АИ', a ? KINDS[a.kind][0] : '', a ? stLine(a) : 'в сети', !!a], ['ДР', '🩺', 'на приёме до 14:00', true], ['ИЛ', '🚗', 'на выезде до 13:00', true], ['ЕГ', '🔕', 'не беспокоить до 18:00', true], ['МС', '', 'в сети', false], ['ОЧ', '', 'в сети', false], ['СК', '', 'был в сети в 8:12', false], ['ОБ', '', 'в сети', false]];
        const L = P2.filter(x => s.pl === 'all' || (s.pl === 'away' ? x[3] : !x[3]));
        return `<div class="phone white">${st}${chead('Люди', '16 человек', '', `<button class="ib">${I('search')}</button>`)}
          <div class="folders" style="background:var(--surface);padding-top:10px">${[['all', 'Все', 16], ['here', 'На месте', 16 - P2.filter(x => x[3]).length], ['away', 'Отсутствуют', P2.filter(x => x[3]).length]].map(([k, n, c]) => `<button class="fd" aria-selected="${s.pl === k}" data-a="pl-f" data-v="${k}">${n}<span class="n">${c}</span></button>`).join('')}</div>
          <div class="list" data-scroll="l">${L.map(([k, e, t, aw]) => `<div class="row">${pa(k, 'm round', e ? `<span class="stx">${e}</span>` : t === 'в сети' ? '<span class="on"></span>' : '')}<div class="bd"><div class="l1"><span class="nm">${nm(k)}</span></div><div class="l2"><span class="pv" ${aw ? 'style="color:var(--warning)"' : ''}>${PP[k][2]} · ${t}</span></div></div></div>`).join('')}</div></div>`;
      } },
    ],
    on: {
      'aw-open': s => { s.draft = JSON.parse(JSON.stringify(s.away || { kind: 'vac', until: '20 ноября', auto: true, text: 'Я в отпуске до 20 ноября. По слотам — к Марине Соколовой.', sub: 'МС', mute: true })); s.sheet = true; },
      'aw-close': s => s.sheet = false, 'aw-kind': (s, d) => { const k = d.v, t = { vac: 'Я в отпуске до 20 ноября. По слотам — к Марине Соколовой.', recv: 'Я на приёме до 14:00, отвечу после.', out: 'Я на выезде до 13:00, отвечу после.', dnd: 'Не беспокоить — отвечу позже.' }; s.draft.kind = k; s.draft.until = UNT[k][0]; s.draft.text = t[k]; s.draft.mute = k !== 'recv'; },
      'aw-until': (s, d) => s.draft.until = d.v, 'aw-tg': (s, d) => s.draft[d.k] = !s.draft[d.k], 'aw-sub': (s, d) => s.draft.sub = d.v,
      'aw-save': s => { s.away = s.draft; s.sheet = false; s.dm.msgs = s.dm.msgs.filter(m => !m.auto); toast(s, 'A', 'Статус установлен — его видят коллеги'); },
      'aw-clear': s => { s.away = null; s.sheet = false; toast(s, 'A', 'Статус снят'); },
      'dm-send': s => { const t = (s.dm.text || '').trim(); if (!t) return; s.dm.msgs.push({ t }); s.dm.text = ''; s.bottom = 'B';
        if (s.away && s.away.auto && !s.dm.msgs.some(m => m.auto)) later(s, 800, () => { s.dm.msgs.push({ auto: 1, t: s.away.text }); s.bottom = 'B'; }); },
      'mt-pick': (s, d) => { s.mt.stage = 'picked'; s.mt.who = d.v; }, 'mt-sub': s => s.mt.who = 'МС',
      'mt-send': s => { const n = s.mt.who === 'АИ' ? 'Анна' : s.mt.who === 'МС' ? 'Марина' : 'Артём'; s.mt.msgs.push({ n, away: s.mt.who === 'АИ' && s.away ? `${KINDS[s.away.kind][0]} Анна ${stLine(s.away)}.` : '' }); s.mt.stage = 'sent'; s.bottom = 'C'; later(s, 1800, () => s.mt.stage = 'suggest'); },
      'mt-reset': s => s.mt.stage = 'suggest', 'pl-f': (s, d) => s.pl = d.v,

    notes: notes(

      'Поле статуса пользователя <code>presence_status(kind, until, autoreply_text, substitute_id, mute)</code> — отдаётся вместе с присутствием (у нас уже есть «в сети» в шапке); снятие по сроку — планировщик; автоответ — серверное сообщение с флагом <code>auto</code>, не чаще раза в сутки одному собеседнику; приглушение пушей на стороне push-relay; подсказка при упоминании — на клиенте по уже пришедшему статусу.',

  const recView = () => `<div class="rec2">

  const compView = () => {
    const pd = mkPoll('Во сколько планёрка?', [['8:30', ['ОЧ', 'АИ', 'ИЛ']], ['13:00', ['СК']], ['17:00', []]], { me: 'ИЛ' });
    const pn = mkPoll('Во сколько планёрка?', [['8:30', []], ['13:00', []], ['17:00', []]], { me: 'ИЛ', due: 'до пт' });
    return `<div class="ds on">
    <div class="pn"><h3>Подтверждение</h3><div class="msg" style="margin:0;max-width:100%"><div class="bub">Текст сообщения<div class="ack"><div class="ackh">${I('clock')}Нужно подтвердить до пт, 18:00</div><button class="ackbtn">${I('check')}Ознакомлен(а)</button><div class="acs">Подтвердили 12 из 15</div></div></div></div>
      <div class="msg me" style="margin-top:8px"><div class="bub">Своё<div class="ack"><div class="acount">${I('dcheck')}<span class="g">Подтвердили <b>12 из 15</b></span>${I('right')}</div><div class="trk"><i style="width:80%"></i></div></div></div></div>
      <div class="rw" style="margin-top:10px"><span class="need">${I('dcheck')}до пт</span><span class="ackdone" style="margin:0">${I('check')}Вы подтвердили</span></div>
      <div class="cap">Жёлтый (--warning) — «от вас ждут действия». Зелёный — «сделано». Синий — действие.</div></div>
    <div class="pn"><h3>Опрос: до и после</h3><div class="bub" style="border-radius:18px">${pollH(pn, 'x', '')}</div><div class="bub" style="border-radius:18px;margin-top:8px">${pollH(pd, 'x', '')}</div></div>
    <div class="pn"><h3>Задача, чек-лист, статусы</h3><div class="bub" style="border-radius:18px">${taskCard({ id: 0, title: 'Подготовить большой зал', who: 'ОЧ', due: 'ср, 8:45', st: 'prog' }, 'МС')}</div>
      <div class="bub" style="border-radius:18px;margin-top:8px"><div class="cli done">${cb(true)}<span>Разложить маты</span><span class="by">${pa('ОЧ', 'round')}</span></div><div class="cli">${cb(false)}<span>Проветрить зал</span></div></div>
      <div class="rw" style="margin-top:10px"><span class="pill">Открыта</span><span class="pill pr">В работе</span><span class="pill ok">Готово</span><span class="pill dg">Просрочена</span><span class="pill wr">до пт</span></div></div>
    <div class="pn"><h3>Слоты</h3><div style="display:grid;grid-template-columns:repeat(5,44px);gap:5px;margin-bottom:10px"><div class="sh free">${I('plus')}</div><div class="sh mine">Я</div><div class="sh c1">ОЧ</div><div class="sh c3">ОБ</div><div class="sh off">Я</div></div>
      <div class="sc2 free" style="margin:0 0 8px"><span class="hx">${I('door')}</span><div class="g"><b>Малый зал</b><small class="warnc">свободно</small></div><button class="btn sm pri">Записаться</button></div>
      <div class="sc2 mine" style="margin:0"><span class="hx" style="background:var(--primary);color:var(--on-primary)">${I('check')}</span><div class="g"><b>Большой зал</b><small>вы</small></div><button class="btn sm sec">Отдать</button></div></div>
    <div class="pn"><h3>Статусы людей</h3><div class="rw">${Object.values(KINDS).map(([e, n]) => `<span class="chip">${e} ${n}</span>`).join('')}</div>
      <div class="rw">${pa('АИ', 'm round', '<span class="stx">🌴</span>')}${pa('ДР', 'm round', '<span class="stx">🩺</span>')}${pa('ИЛ', 'm round', '<span class="stx">🚗</span>')}${pa('ЕГ', 'm round', '<span class="stx">🔕</span>')}</div>
      <div class="hint2" style="margin:0"><span class="e">🌴</span><span>Анна в отпуске до 20 ноября — ответит позже. <a>Упомянуть Марину</a></span></div></div>
    <div class="pn"><h3>Переключатель, уведомление, тост</h3><div class="rw">${tg(true, 'noop')}${tg(false, 'noop')}<span class="chip on">до пт, 18:00</span><span class="chip">без срока</span></div>
      <div style="position:relative;height:56px"><div class="toast" style="position:static;animation:none">${I('bell')}<span>Напомню завтра в 9:00</span></div></div>
      <div class="cap">Тост — тёмная кнопочная плашка над полем ввода, 2,8 с. Пуш «Напоминание» — системный, с действиями.</div></div></div>`;
  };

  /* ================= engine ================= */
  const VIEWS = { 'Подтверждение': t1, 'Опросы': t2, 'Напомнить мне': t3, 'Задачи': t4, 'Слоты': t5, 'Отсутствую': t6 };
  const names = [...Object.keys(VIEWS), 'Рекомендация', 'Компоненты'];
  const root = document.getElementById('root'), nav = document.getElementById('nav');
  let cur = names[0], S = null;
  const cap = t => `<div class="cap">${t}</div>`;
  const fit = el => el.querySelectorAll('.inp textarea').forEach(t => { t.style.height = '38px'; t.style.height = Math.min(t.scrollHeight, 98) + 'px'; });
  function render() {
    const v = VIEWS[cur];
    nav.innerHTML = names.map(x => `<button role="tab" aria-selected="${x === cur}">${x}</button>`).join('');
    if (!v) { root.innerHTML = cur === 'Рекомендация' ? recView() : compView(); return; }
    root.innerHTML = `<div class="view on">${v.phones.map(p => `<div class="slot">${p.label ? `<div class="vlabel">${p.label}</div>` : ''}<div data-ph="${p.id}">${p.r(S)}</div>${cap(p.cap)}</div>`).join('')}${v.notes}</div>`;
    root.querySelectorAll('.feed').forEach(f => f.scrollTop = 1e5); fit(root);
  }
  function rerender() {
    const v = VIEWS[cur]; if (!v) return;
    v.phones.forEach(p => {
      const box = root.querySelector(`[data-ph="${p.id}"]`); if (!box) return;
      const sc = {}; box.querySelectorAll('[data-scroll]').forEach(e => sc[e.dataset.scroll] = e.scrollTop);
      const ae = document.activeElement, bind = ae && box.contains(ae) && ae.dataset.bind, pos = bind && ae.selectionStart;
      box.innerHTML = p.r(S); fit(box);
      box.querySelectorAll('[data-scroll]').forEach(e => { if (e.dataset.scroll in sc) e.scrollTop = sc[e.dataset.scroll]; if (e.dataset.scroll === 'feed' && (S.bottom === p.id || !(e.dataset.scroll in sc))) e.scrollTop = 1e5; });
      if (bind) { const n = box.querySelector(`[data-bind="${bind}"]`); if (n) { n.focus(); try { n.setSelectionRange(pos, pos); } catch (e) {} } }
    });
    S.bottom = null;
  }
  const show = n => { cur = names.includes(n) ? n : names[0]; S = VIEWS[cur] ? VIEWS[cur].init() : {}; render(); };
  nav.onclick = e => { const b = e.target.closest('button'); if (b) show(b.textContent); };
  const themeBtn = document.getElementById('theme');
  const setTheme = d => { root.dataset.theme = d ? 'dark' : 'light'; themeBtn.textContent = d ? 'Светлая тема' : 'Тёмная тема'; document.body.style.background = d ? '#0f0f11' : ''; document.querySelector('.lab').style.color = d ? '#f0f0f2' : ''; document.querySelector('.bar').style.background = d ? '#0f0f11' : ''; };
  themeBtn.onclick = () => setTheme(root.dataset.theme !== 'dark');

  const setPath = (o, path, val) => { const k = path.split('.'); let x = o; for (let i = 0; i < k.length - 1; i++) x = x[k[i]]; x[k[k.length - 1]] = val; };
  root.addEventListener('input', e => {
    const b = e.target.dataset.bind; if (!b || !S) return; setPath(S, b, e.target.value);
    const btn = e.target.closest('.cmp') && e.target.closest('.cmp').querySelector('[data-sendbtn]');
    if (btn) { const has = !!e.target.value.trim(); btn.className = 'ib ' + (has ? 'pri' : 'soft'); btn.innerHTML = I(has ? 'up' : 'mic'); }
    if (e.target.tagName === 'TEXTAREA' && e.target.closest('.inp')) { e.target.style.height = '38px'; e.target.style.height = Math.min(e.target.scrollHeight, 98) + 'px'; }
  });
  let hold, held = false;
  root.addEventListener('pointerdown', e => { held = false; const h = e.target.closest('[data-hold]'); if (!h) return; hold = setTimeout(() => { held = true; const fn = VIEWS[cur].on[h.dataset.hold]; if (fn) { fn(S, h.dataset, h); rerender(); } }, 420); });
  root.addEventListener('pointerup', () => clearTimeout(hold));
  root.addEventListener('contextmenu', e => { if (e.target.closest('[data-hold]')) e.preventDefault(); });
  root.addEventListener('click', e => {
    const a = e.target.closest('[data-a]'); if (!a || !VIEWS[cur]) return;
    if (a.dataset.hold && held) { held = false; return; }
    if (e.target.closest('input,textarea') && a.contains(e.target.closest('input,textarea'))) return;
    const fn = VIEWS[cur].on[a.dataset.a]; if (!fn) return;
    fn(S, a.dataset, a, e); rerender();
  });
  window.__proto = { show, setTheme, get S() { return S; }, rerender };
  const q = new URLSearchParams(location.search);
  if (q.get('theme') === 'dark') setTheme(true);
  const v = q.get('v'); show(v == null ? names[0] : (isNaN(+v) ? v : names[+v]));
})();
</script>
</body></html>
