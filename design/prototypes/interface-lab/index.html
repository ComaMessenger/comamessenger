      /* 01. Semantic tokens. This prototype is independent of the production UI. */
      :root {
        --ds-canvas: #f6f6f7;
        --ds-surface: #ffffff;
        --ds-subtle: #fafafa;
        --ds-hover: #f1f1f3;
        --ds-raised: #fff;
        --ds-text: #202023;
        --ds-muted: #686873;
        --ds-faint: #6d6d77;
        --ds-border: #e5e5e9;
        --ds-border-strong: #d2d2d9;
        --ds-primary: #252528;
        --ds-on-primary: #fff;
        --ds-accent: #174586;
        --ds-accent-hover: #12386f;
        --ds-accent-soft: #edf3fb;
        --ds-accent-text: #174586;
        --ds-success: #18794e;
        --ds-success-soft: #edf8f1;
        --ds-warning: #9c650b;
        --ds-warning-soft: #fff8e7;
        --ds-danger: #c43245;
        --ds-danger-soft: #fff0f1;
        --ds-info: #2563b4;
        --ds-info-soft: #eef5ff;
        --ds-overlay: rgba(20, 20, 26, 0.36);
        --ds-shadow:
          0 3px 12px rgba(20, 20, 30, 0.06), 0 1px 3px rgba(20, 20, 30, 0.03);
        --ds-shadow-pop:
          0 12px 40px rgba(20, 20, 30, 0.12), 0 2px 8px rgba(20, 20, 30, 0.04);
        --ds-radius-sm: 6px;
        --ds-radius-md: 8px;
        --ds-radius-lg: 12px;
        --ds-radius-xl: 16px;
        --ds-control: 36px;
        --ds-row: 40px;
        --ds-space-1: 4px;
        --ds-space-2: 8px;
        --ds-space-3: 12px;
        --ds-space-4: 16px;
        --ds-space-6: 24px;
        --ds-space-8: 32px;
        --ds-text-xs: 11px;
        --ds-text-sm: 12px;
        --ds-text-base: 13px;
        --ds-text-lg: 17px;
        --ds-text-title: 24px;
        --ds-weight-regular: 400;
        --ds-weight-medium: 500;
        --ds-weight-semibold: 600;
        --ds-motion: 140ms;
        --ds-font:
          Onest, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        --ds-mono: ui-monospace, SFMono-Regular, Consolas, monospace;
      }
      :root[data-theme="dark"] {
        color-scheme: dark;
        --ds-canvas: #151517;
        --ds-surface: #1d1d20;
        --ds-subtle: #222225;
        --ds-hover: #2b2b30;
        --ds-raised: #27272c;
        --ds-text: #f0f0f2;
        --ds-muted: #a0a0aa;
        --ds-faint: #9898a3;
        --ds-border: #323237;
        --ds-border-strong: #46464f;
        --ds-primary: #eeeeef;
        --ds-on-primary: #222225;
        --ds-accent: #86aff0;
        --ds-accent-hover: #a3c3f5;
        --ds-accent-soft: #243349;
        --ds-accent-text: #a6c7ff;
        --ds-success: #79cf9b;
        --ds-success-soft: #20372a;
        --ds-warning: #e6bf72;
        --ds-warning-soft: #3b3121;
        --ds-danger: #ff98a3;
        --ds-danger-soft: #40262b;
        --ds-info: #93beff;
        --ds-info-soft: #24334b;
        --ds-overlay: rgba(0, 0, 0, 0.64);
        --ds-shadow: none;
        --ds-shadow-pop: 0 0 0 1px var(--ds-border-strong);
      }
      :root[data-accent="violet"] {
        --ds-accent: #7651be;
        --ds-accent-hover: #63439f;
        --ds-accent-soft: #f3effb;
        --ds-accent-text: #6c45b4;
      }
      :root[data-accent="green"] {
        --ds-accent: #327360;
        --ds-accent-hover: #245a4a;
        --ds-accent-soft: #edf6f1;
        --ds-accent-text: #28644f;
      }
      :root[data-theme="dark"][data-accent="violet"] {
        --ds-accent: #bd9cf2;
        --ds-accent-hover: #d2b8ff;
        --ds-accent-soft: #342a45;
        --ds-accent-text: #d0b6fa;
      }
      :root[data-theme="dark"][data-accent="green"] {
        --ds-accent: #8ccdb4;
        --ds-accent-hover: #afe6d0;
        --ds-accent-soft: #243a31;
        --ds-accent-text: #a7dec8;
      }
      :root[data-density="compact"] {
        --ds-control: 30px;
        --ds-row: 34px;
      }

      /* 02. Primitives. Controls share dimensions, focus, spacing and states. */
      * {
        box-sizing: border-box;
      }
      html {
        font-family: var(--ds-font);
        color: var(--ds-text);
        background: transparent;
        font-size: 13px;
        -webkit-font-smoothing: antialiased;
      }
      body {
        margin: 0;
        background: transparent;
      }
      button,
      input,
      textarea,
      select {
        font: inherit;
        color: inherit;
      }
      button {
        cursor: pointer;
      }
      button,
      a,
      input,
      textarea,
      select {
        touch-action: manipulation;
      }
      button {
        border: 0;
      }
      button:disabled {
        opacity: 0.42;
        cursor: not-allowed;
      }
      a {
        color: inherit;
        text-decoration: none;
      }
      h1,
      h2,
      h3,
      h4,
      p {
        margin: 0;
      }
      h1 {
        font-size: 29px;
        font-weight: 620;
        line-height: 1.3;
        letter-spacing: -1.05px;
      }
      h2 {
        font-size: 17px;
        font-weight: 600;
        letter-spacing: -0.4px;
      }
      h3 {
        font-size: 13px;
        font-weight: 600;
      }
      p {
        line-height: 1.65;
      }
      svg {
        display: block;
      }
      .icon {
        width: 18px;
        height: 18px;
        flex: none;
        stroke: currentColor;
        stroke-width: 1.65;
        fill: none;
        stroke-linecap: round;
        stroke-linejoin: round;
      }
      .icon.sm {
        width: 15px;
        height: 15px;
      }
      .icon.lg {
        width: 22px;
        height: 22px;
      }
      .sprite {
        position: absolute;
        width: 0;
        height: 0;
        overflow: hidden;
      }
      button:focus-visible,
      a:focus-visible,
      input:focus-visible,
      textarea:focus-visible,
      select:focus-visible,
      [tabindex]:focus-visible {
        outline: 3px solid color-mix(in srgb, var(--ds-accent) 38%, transparent);
        outline-offset: 3px;
      }
      ::selection {
        background: var(--ds-accent-soft);
      }
      [hidden] {
        display: none !important;
      }
      .sr-only {
        position: absolute;
        width: 1px;
        height: 1px;
        padding: 0;
        margin: -1px;
        overflow: hidden;
        clip: rect(0, 0, 0, 0);
        white-space: nowrap;
        border: 0;
      }
      .muted {
        color: var(--ds-muted);
      }
      .faint {
        color: var(--ds-faint);
      }
      .mono {
        font-family: var(--ds-mono);
        font-size: 10px;
      }
      .small {
        font-size: 12px;
      }
      .tiny {
        font-size: 11px;
      }
      .truncate {
        overflow: hidden;
        white-space: nowrap;
        text-overflow: ellipsis;
        min-width: 0;
      }
      .flex {
        display: flex;
        align-items: center;
        gap: 8px;
      }
      .between {
        justify-content: space-between;
      }
      .wrap {
        flex-wrap: wrap;
      }
      .stack {
        display: grid;
        gap: 16px;
      }
      .grow {
        flex: 1;
        min-width: 0;
      }
      .rule {
        height: 1px;
        background: var(--ds-border);
        margin: 18px 0;
      }
      .dot {
        width: 6px;
        height: 6px;
        border-radius: 50%;
        background: currentColor;
        flex: none;
      }
      .caption {
        font-size: 10px;
        font-weight: 500;
        color: var(--ds-muted);
        letter-spacing: 0.9px;
        text-transform: uppercase;
      }
      .kbd {
        display: inline-flex;
        gap: 3px;
        align-items: center;
        justify-content: center;
        border: 1px solid var(--ds-border);
        border-bottom-width: 2px;
        border-radius: 4px;
        padding: 1px 4px;
        font: 10px/15px var(--ds-font);
        color: var(--ds-muted);
        background: var(--ds-surface);
      }
      .btn {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 7px;
        min-height: var(--ds-control);
        padding: 7px 12px;
        border: 1px solid var(--ds-border-strong);
        border-radius: var(--ds-radius-md);
        background: var(--ds-surface);
        font-size: 12px;
        font-weight: 500;
        line-height: 18px;
        white-space: nowrap;
        transition:
          background var(--ds-motion),
          border-color var(--ds-motion),
          color var(--ds-motion);
        box-shadow: 0 1px 2px #00000004;
      }
      .btn:hover:not(:disabled) {
        background: var(--ds-hover);
        border-color: var(--ds-border-strong);
      }
      .btn.primary {
        color: var(--ds-on-primary);
        background: var(--ds-primary);
        border-color: var(--ds-primary);
      }
      .btn.primary:hover:not(:disabled) {
        opacity: 0.88;
        background: var(--ds-primary);
      }
      .btn.accent {
        background: var(--ds-accent);
        color: var(--ds-surface);
        border-color: var(--ds-accent);
      }
      [data-theme="dark"] .btn.accent {
        color: #172132;
      }
      .btn.accent:hover:not(:disabled) {
        background: var(--ds-accent-hover);
      }
      .btn.ghost {
        background: transparent;
        border-color: transparent;
        box-shadow: none;
        color: var(--ds-muted);
      }
      .btn.ghost:hover:not(:disabled) {
        color: var(--ds-text);
        background: var(--ds-hover);
        border-color: transparent;
      }
      .btn.danger {
        color: var(--ds-danger);
        background: var(--ds-danger-soft);
        border-color: transparent;
      }
      .btn.sm {
        min-height: 28px;
        padding: 4px 9px;
        font-size: 11px;
        border-radius: 6px;
      }
      .btn.lg {
        min-height: 42px;
        padding: 10px 16px;
      }
      .icon-btn {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        width: var(--ds-control);
        height: var(--ds-control);
        border: 1px solid transparent;
        border-radius: 7px;
        background: transparent;
        color: var(--ds-muted);
        flex: none;
      }
      .icon-btn:hover {
        color: var(--ds-text);
        background: var(--ds-hover);
      }
      .icon-btn.outline {
        border-color: var(--ds-border);
        background: var(--ds-surface);
      }
      .icon-btn.active {
        color: var(--ds-accent-text);
        background: var(--ds-accent-soft);
      }
      .icon-btn.sm {
        width: 28px;
        height: 28px;
      }
      .badge {
        display: inline-flex;
        align-items: center;
        gap: 5px;
        width: max-content;
        max-width: 100%;
        border: 1px solid var(--ds-border);
        border-radius: 5px;
        padding: 2px 6px;
        background: var(--ds-subtle);
        font-size: 10px;
        font-weight: 500;
        line-height: 16px;
        white-space: nowrap;
      }
      .badge.blue {
        color: var(--ds-accent-text);
        background: var(--ds-accent-soft);
        border-color: transparent;
      }
      .badge.green {
        color: var(--ds-success);
        background: var(--ds-success-soft);
        border-color: transparent;
      }
      .badge.amber {
        color: var(--ds-warning);
        background: var(--ds-warning-soft);
        border-color: transparent;
      }
      .badge.red {
        color: var(--ds-danger);
        background: var(--ds-danger-soft);
        border-color: transparent;
      }
      .badge.count {
        min-width: 18px;
        justify-content: center;
        padding: 0 5px;
        font-size: 10px;
      }
      .field {
        display: grid;
        gap: 6px;
        min-width: 0;
      }
      .field label {
        font-size: 12px;
        font-weight: 500;
      }
      .field input,
      .field textarea,
      .field select,
      .input {
        width: 100%;
        min-width: 0;
        min-height: var(--ds-control);
        padding: 8px 10px;
        border: 1px solid var(--ds-border-strong);
        border-radius: var(--ds-radius-md);
        background: var(--ds-surface);
        font-size: 12px;
        line-height: 18px;
        transition: border-color var(--ds-motion);
      }
      input::placeholder,
      textarea::placeholder {
        color: var(--ds-faint);
      }
      input:focus,
      textarea:focus,
      select:focus {
        border-color: var(--ds-accent);
      }
      input:disabled {
        background: var(--ds-subtle);
        color: var(--ds-faint);
      }
      .input-wrap {
        position: relative;
      }
      .input-wrap > .icon {
        position: absolute;
        left: 10px;
        top: 10px;
        color: var(--ds-faint);
        pointer-events: none;
      }
      .input-wrap > input {
        padding-left: 34px;
      }
      .hint {
        font-size: 11px;
        color: var(--ds-muted);
        line-height: 1.5;
      }
      .field.error input {
        border-color: var(--ds-danger);
      }
      .field.error .hint {
        color: var(--ds-danger);
      }
      .switch {
        display: inline-flex;
        align-items: center;
        justify-content: flex-start;
        flex: none;
        width: 30px;
        height: 18px;
        padding: 2px;
        border: 1px solid transparent;
        border-radius: 99px;
        background: var(--ds-border-strong);
        transition: background var(--ds-motion);
      }
      .switch::before {
        content: "";
        width: 12px;
        height: 12px;
        border-radius: 50%;
        background: #fff;
        box-shadow: 0 1px 2px #0002;
        transition: transform var(--ds-motion);
      }
      .switch[aria-checked="true"] {
        background: var(--ds-accent);
      }
      .switch[aria-checked="true"]::before {
        transform: translateX(12px);
      }
      .check-row {
        display: flex;
        align-items: center;
        gap: 9px;
        font-size: 12px;
        cursor: pointer;
      }
      .check-row input {
        appearance: none;
        display: grid;
        place-content: center;
        width: 15px;
        height: 15px;
        margin: 0;
        border: 1px solid var(--ds-border-strong);
        border-radius: 4px;
        background: var(--ds-surface);
        flex: none;
      }
      .check-row input:checked {
        border-color: var(--ds-accent);
        background: var(--ds-accent);
      }
      .check-row input:checked::after {
        content: "";
        width: 7px;
        height: 4px;
        border-left: 1.5px solid white;
        border-bottom: 1.5px solid white;
        transform: rotate(-45deg) translateY(-1px);
      }
      .check-row input[type="radio"] {
        border-radius: 50%;
      }
      .check-row input[type="radio"]:checked::after {
        width: 5px;
        height: 5px;
        border: 0;
        background: white;
        border-radius: 50%;
        transform: none;
      }
      .avatar {
        --av-bg: #e8edf4;
        --av-text: #576b87;
        position: relative;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        width: 34px;
        height: 34px;
        background: var(--av-bg);
        color: var(--av-text);
        border-radius: 50%;
        font-size: 11px;
        font-weight: 600;
        flex: none;
        letter-spacing: -0.3px;
      }
      .avatar[data-color="rose"] {
        --av-bg: #f3e8e9;
        --av-text: #8e505b;
      }
      .avatar[data-color="sage"] {
        --av-bg: #e5eee6;
        --av-text: #4d6b54;
      }
      .avatar[data-color="lilac"] {
        --av-bg: #ece7f5;
        --av-text: #6f598e;
      }
      .avatar[data-color="sand"] {
        --av-bg: #f4ebde;
        --av-text: #806039;
      }
      .avatar.sm {
        width: 26px;
        height: 26px;
        font-size: 9px;
      }
      .avatar.lg {
        width: 44px;
        height: 44px;
        font-size: 13px;
      }
      .avatar.xl {
        width: 56px;
        height: 56px;
        font-size: 17px;
      }
      .avatar.square {
        border-radius: 9px;
      }
      .avatar.online::after {
        content: "";
        position: absolute;
        right: -1px;
        bottom: 0;
        width: 8px;
        height: 8px;
        border: 2px solid var(--ds-surface);
        border-radius: 50%;
        background: #409367;
      }
      .avatar-group {
        display: flex;
        padding-left: 0;
      }
      .avatar-group .avatar + .avatar {
        margin-left: -7px;
        border: 2px solid var(--ds-surface);
      }
      .avatar.more {
        background: var(--ds-hover);
        color: var(--ds-muted);
      }
      .segmented {
        display: inline-flex;
        gap: 3px;
        max-width: 100%;
        padding: 3px;
        background: var(--ds-hover);
        border-radius: 8px;
      }
      .segmented button {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 5px;
        min-height: 26px;
        padding: 4px 10px;
        border-radius: 5px;
        background: transparent;
        color: var(--ds-muted);
        font-size: 11px;
        font-weight: 500;
        white-space: nowrap;
      }
      .segmented button[aria-selected="true"] {
        background: var(--ds-surface);
        color: var(--ds-text);
        box-shadow: var(--ds-shadow);
      }
      .tabline {
        display: flex;
        align-items: center;
        gap: 20px;
        border-bottom: 1px solid var(--ds-border);
      }
      .tabline button {
        display: flex;
        align-items: center;
        gap: 6px;
        position: relative;
        padding: 12px 0;
        background: transparent;
        color: var(--ds-muted);
        font-size: 12px;
        white-space: nowrap;
      }
      .tabline button[aria-selected="true"] {
        color: var(--ds-text);
        font-weight: 500;
      }
      .tabline button[aria-selected="true"]::after {
        content: "";
        position: absolute;
        bottom: -1px;
        left: 0;
        right: 0;
        height: 2px;
        background: var(--ds-text);
        border-radius: 3px;
      }

      /* 03. The lab shell. Content determines height; no viewport units. */
      .lab {
        padding: 16px;
        border-radius: 16px;
        background: var(--ds-canvas);
        min-width: 0;
      }
      .topbar {
        display: flex;
        align-items: center;
        gap: 14px;
        min-height: 56px;
        padding: 0 12px 16px;
      }
      .brand {
        display: flex;
        align-items: center;
        gap: 9px;
        font-size: 23px;
        font-weight: 650;
        letter-spacing: -1.1px;
        line-height: 1;
      }
      .brand-mark {
        width: 27px;
        height: 28px;
        color: #174586;
      }
      .top-separator {
        height: 18px;
        width: 1px;
        background: var(--ds-border-strong);
        margin: 0 1px;
      }
      .top-label {
        color: var(--ds-muted);
        font-size: 12px;
      }
      .top-actions {
        margin-left: auto;
        display: flex;
        align-items: center;
        gap: 8px;
      }
      .global-search {
        display: flex;
        align-items: center;
        gap: 8px;
        min-width: 206px;
        min-height: 32px;
        padding: 6px 9px;
        border: 1px solid var(--ds-border);
        border-radius: 7px;
        background: var(--ds-surface);
        color: var(--ds-muted);
        font-size: 11px;
      }
      .global-search .kbd {
        margin-left: auto;
      }
      .lab-grid {
        display: grid;
        grid-template-columns: 196px minmax(0, 1fr);
        align-items: stretch;
        gap: 16px;
      }
      .sidebar {
        display: flex;
        flex-direction: column;
        padding: 16px 6px 12px;
        min-width: 0;
      }
      .side-caption {
        display: block;
        padding: 0 10px;
        margin-bottom: 10px;
        color: var(--ds-faint);
        font-size: 10px;
        font-weight: 500;
        letter-spacing: 0.5px;
      }
      .side-group {
        display: grid;
        gap: 3px;
        margin-bottom: 27px;
      }
      .side-item {
        display: flex;
        align-items: center;
        gap: 9px;
        width: 100%;
        min-height: 36px;
        padding: 8px 10px;
        border: 1px solid transparent;
        border-radius: 7px;
        background: transparent;
        color: var(--ds-muted);
        font-size: 12px;
        text-align: left;
      }
      .side-item .icon {
        width: 16px;
        height: 16px;
      }
      .side-item .badge {
        margin-left: auto;
      }
      .side-item:hover {
        background: var(--ds-hover);
        color: var(--ds-text);
      }
      .side-item.active {
        background: var(--ds-surface);
        border-color: var(--ds-border);
        color: var(--ds-text);
        box-shadow: 0 1px 2px #00000003;
      }
      .side-item.active .icon {
        color: var(--ds-accent);
      }
      .side-bottom {
        margin-top: auto;
        padding: 18px 10px 0;
        display: grid;
        gap: 14px;
      }
      .side-note {
        padding: 11px;
        border: 1px solid var(--ds-border);
        border-radius: 9px;
        background: color-mix(in srgb, var(--ds-surface) 50%, transparent);
        display: grid;
        gap: 8px;
      }
      .side-note p {
        font-size: 11px;
        color: var(--ds-muted);
        line-height: 1.5;
      }
      .side-foot {
        display: flex;
        align-items: center;
        gap: 7px;
        font-size: 10px;
        color: var(--ds-muted);
      }
      .side-foot .dot {
        color: var(--ds-success);
        width: 5px;
        height: 5px;
      }
      .stage {
        min-width: 0;
        min-height: 890px;
        border: 1px solid var(--ds-border);
        border-radius: 13px;
        background: var(--ds-surface);
        overflow: hidden;
      }
      .stage-top {
        display: flex;
        align-items: center;
        gap: 8px;
        min-height: 51px;
        padding: 10px 26px;
        border-bottom: 1px solid var(--ds-border);
        font-size: 11px;
        color: var(--ds-muted);
      }
      .stage-top .icon {
        width: 12px;
        height: 12px;
        color: var(--ds-faint);
      }
      .stage-top > span:last-of-type {
        color: var(--ds-text);
      }
      .stage-top .badge {
        margin-left: auto;
      }
      .stage-body {
        padding: 28px 30px 30px;
        min-width: 0;
      }
      .page-heading {
        display: flex;
        align-items: flex-start;
        justify-content: space-between;
        gap: 16px;
        margin-bottom: 26px;
      }
      .page-heading .caption {
        margin-bottom: 9px;
      }
      .page-heading p {
        margin-top: 8px;
        font-size: 12px;
        color: var(--ds-muted);
        max-width: 590px;
      }
      .page-heading .btn {
        margin-top: 5px;
      }
      .section-heading {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 10px;
        margin: 27px 0 12px;
      }
      .section-heading p {
        font-size: 11px;
        color: var(--ds-muted);
        margin-top: 3px;
      }
      .panel {
        min-width: 0;
        overflow: hidden;
        border: 1px solid var(--ds-border);
        border-radius: var(--ds-radius-lg);
        background: var(--ds-surface);
      }
      .panel-head {
        display: flex;
        align-items: center;
        gap: 9px;
        padding: 13px 16px;
        border-bottom: 1px solid var(--ds-border);
        background: var(--ds-subtle);
        font-size: 12px;
        font-weight: 500;
      }
      .panel-head .icon {
        width: 15px;
        height: 15px;
        color: var(--ds-muted);
      }
      .panel-head .badge,
      .panel-head .btn {
        margin-left: auto;
      }
      .panel-body {
        padding: 20px;
        min-width: 0;
      }
      .panel-foot {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 10px;
        padding: 10px 16px;
        border-top: 1px solid var(--ds-border);
        font-size: 10px;
        color: var(--ds-muted);
      }
      .grid-2 {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 16px;
      }
      .grid-3 {
        display: grid;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: 14px;
      }
      .principles {
        display: grid;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: 14px;
        margin-bottom: 22px;
      }
      .principle {
        padding: 15px 16px;
        border: 1px solid var(--ds-border);
        border-radius: 9px;
        background: var(--ds-subtle);
      }
      .principle .icon {
        color: var(--ds-muted);
        width: 17px;
        height: 17px;
        margin-bottom: 10px;
      }
      .principle strong {
        font-size: 12px;
        font-weight: 550;
      }
      .principle p {
        font-size: 11px;
        color: var(--ds-muted);
        margin-top: 4px;
        line-height: 1.55;
      }
      .sample-card {
        display: flex;
        flex-direction: column;
        min-height: 194px;
      }
      .sample-card .panel-body {
        flex: 1;
        display: flex;
        flex-direction: column;
        align-items: flex-start;
        justify-content: center;
        gap: 16px;
        padding: 20px;
      }
      .sample-label {
        font-size: 10px;
        color: var(--ds-faint);
        font-family: var(--ds-mono);
      }
      .spec {
        display: flex;
        align-items: center;
        gap: 12px;
      }
      .spec::before {
        content: "";
        width: 3px;
        height: 3px;
        background: var(--ds-faint);
        border-radius: 50%;
      }
      .tuning {
        display: flex;
        align-items: center;
        gap: 12px;
        flex-wrap: wrap;
        padding: 12px 16px;
        margin-top: 14px;
        background: var(--ds-subtle);
        border: 1px solid var(--ds-border);
        border-radius: 9px;
      }
      .color-pick {
        width: 18px;
        height: 18px;
        border-radius: 50%;
        background: var(--pick);
        border: 3px solid var(--ds-surface);
        outline: 1px solid var(--ds-border);
      }
      .color-pick[aria-pressed="true"] {
        outline: 2px solid var(--pick);
      }
      .palette {
        display: grid;
        grid-template-columns: repeat(6, minmax(0, 1fr));
        gap: 8px;
      }
      .color-token {
        display: grid;
        gap: 7px;
        text-align: left;
        background: transparent;
        padding: 0;
        min-width: 0;
      }
      .color-token .swatch {
        height: 66px;
        width: 100%;
        border-radius: 7px;
        border: 1px solid #0000000a;
      }
      .color-token strong {
        font-size: 10px;
        font-weight: 500;
      }
      .color-token code {
        font: 9px var(--ds-mono);
        color: var(--ds-muted);
      }
      .type-row {
        display: flex;
        align-items: baseline;
        justify-content: space-between;
        gap: 16px;
        padding: 17px 0;
        border-bottom: 1px solid var(--ds-border);
      }
      .type-row:last-child {
        border: 0;
      }
      .type-row code {
        font: 10px var(--ds-mono);
        color: var(--ds-muted);
        white-space: nowrap;
      }
      .scale-items {
        display: flex;
        align-items: flex-end;
        gap: 16px;
        flex-wrap: wrap;
      }
      .scale-item {
        display: grid;
        gap: 10px;
        text-align: center;
        font: 10px var(--ds-mono);
        color: var(--ds-muted);
      }
      .radius-box {
        width: 56px;
        height: 56px;
        border: 1px solid var(--ds-border-strong);
        background: var(--ds-subtle);
      }
      .space-bar {
        width: 28px;
        background: var(--ds-accent-soft);
        border: 1px solid color-mix(in srgb, var(--ds-accent) 25%, transparent);
        border-radius: 3px;
      }
      .component-filters {
        display: flex;
        align-items: center;
        gap: 14px;
        justify-content: space-between;
        flex-wrap: wrap;
        margin-bottom: 18px;
      }
      .component-grid {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 16px;
      }
      .component-grid .panel-body {
        min-height: 190px;
      }
      .component-grid .wide {
        grid-column: 1/-1;
      }
      .controls-row {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 16px;
        width: 100%;
        font-size: 12px;
      }
      .controls-row p {
        font-size: 11px;
        color: var(--ds-muted);
        margin-top: 3px;
      }
      .alert {
        display: flex;
        align-items: flex-start;
        gap: 9px;
        width: 100%;
        padding: 11px 12px;
        border: 1px solid var(--ds-border);
        border-radius: 8px;
        background: var(--ds-subtle);
        font-size: 11px;
      }
      .alert > .icon {
        width: 16px;
        height: 16px;
        margin-top: 1px;
        flex: none;
      }
      .alert p {
        font-size: 10px;
        margin-top: 2px;
        color: var(--ds-muted);
      }
      .alert.success {
        background: var(--ds-success-soft);
        border-color: transparent;
        color: var(--ds-success);
      }
      .alert.warning {
        background: var(--ds-warning-soft);
        border-color: transparent;
        color: var(--ds-warning);
      }
      .menu-sample {
        width: 100%;
        max-width: 240px;
        padding: 5px;
        border: 1px solid var(--ds-border);
        border-radius: 9px;
        background: var(--ds-raised);
        box-shadow: var(--ds-shadow);
      }
      .menu-row {
        display: flex;
        align-items: center;
        gap: 8px;
        width: 100%;
        min-height: 32px;
        padding: 7px 8px;
        border-radius: 5px;
        background: transparent;
        text-align: left;
        font-size: 11px;
      }
      .menu-row .icon {
        width: 15px;
        height: 15px;
        color: var(--ds-muted);
      }
      .menu-row:hover {
        background: var(--ds-hover);
      }
      .menu-row .kbd {
        margin-left: auto;
      }
      .menu-row.danger,
      .menu-row.danger .icon {
        color: var(--ds-danger);
      }
      .menu-divider {
        height: 1px;
        background: var(--ds-border);
        margin: 4px -1px;
      }
      .loading {
        animation: rotate 1s linear infinite;
      }
      @keyframes rotate {
        to {
          transform: rotate(360deg);
        }
      }
      .skeleton {
        height: 10px;
        border-radius: 4px;
        background: var(--ds-hover);
        animation: breathe 1.8s ease-in-out infinite;
      }
      @keyframes breathe {
        50% {
          opacity: 0.5;
        }
      }
      .empty {
        display: grid;
        justify-items: center;
        text-align: center;
        padding: 22px 12px;
        gap: 9px;
      }
      .empty-icon {
        display: grid;
        place-items: center;
        width: 42px;
        height: 42px;
        margin-bottom: 3px;
        border: 1px solid var(--ds-border);
        border-radius: 12px;
        background: var(--ds-subtle);
        color: var(--ds-muted);
      }
      .empty h3 {
        font-size: 12px;
      }
      .empty p {
        font-size: 11px;
        color: var(--ds-muted);
        max-width: 240px;
      }

      /* 04. Product patterns: list, message, composer, thread and preferences. */
      .messenger {
        display: grid;
        grid-template-columns: 52px 226px minmax(0, 1fr);
        grid-template-rows: minmax(0, 1fr);
        height: 664px;
        min-width: 0;
        position: relative;
        overflow: hidden;
        background: var(--ds-surface);
      }
      .messenger.mini {
        height: 386px;
        grid-template-columns: 44px 190px minmax(0, 1fr);
      }
      .app-rail {
        display: flex;
        flex-direction: column;
        min-height: 0;
        align-items: center;
        gap: 9px;
        padding: 13px 5px;
        border-right: 1px solid var(--ds-border);
        background: var(--ds-subtle);
      }
      .app-rail .brand-mark {
        width: 24px;
        height: 25px;
        margin: 2px 0 18px;
      }
      .app-rail .icon-btn {
        width: 33px;
        height: 33px;
      }
      .app-rail .rail-bottom {
        margin-top: auto;
        display: grid;
        gap: 12px;
        justify-items: center;
      }
      .inbox {
        display: flex;
        flex-direction: column;
        min-width: 0;
        min-height: 0;
        border-right: 1px solid var(--ds-border);
        background: var(--ds-subtle);
      }
      .inbox-head {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 16px 13px 12px;
        min-height: 58px;
      }
      .inbox-head h3 {
        font-size: 14px;
      }
      .inbox-search {
        padding: 0 11px 12px;
      }
      .inbox-search .input {
        background: var(--ds-surface);
        font-size: 11px;
        min-height: 31px;
        padding-top: 6px;
        padding-bottom: 6px;
      }
      .inbox-search .icon {
        top: 8px;
        width: 15px;
        height: 15px;
      }
      .inbox-tabs {
        padding: 0 11px 10px;
      }
      .inbox-tabs .segmented {
        display: flex;
        background: var(--ds-hover);
      }
      .inbox-tabs button {
        flex: 1;
        font-size: 10px;
        padding: 3px 6px;
        min-height: 25px;
      }
      .inbox-group {
        font-size: 9px;
        color: var(--ds-faint);
        padding: 9px 15px 7px;
        display: flex;
        align-items: center;
        gap: 5px;
      }
      .chat-list {
        overflow: auto;
        min-height: 0;
        flex: 1;
        padding: 0 6px;
      }
      .chat-row {
        position: relative;
        display: flex;
        align-items: center;
        gap: 9px;
        width: 100%;
        padding: 11px 7px;
        border: 1px solid transparent;
        border-radius: 8px;
        background: transparent;
        text-align: left;
        margin-bottom: 3px;
        min-height: 66px;
      }
      .chat-row:hover {
        background: var(--ds-hover);
      }
      .chat-row.selected {
        border-color: var(--ds-border);
        background: var(--ds-surface);
        box-shadow: 0 1px 2px #00000003;
      }
      .chat-row.selected::before {
        content: "";
        position: absolute;
        left: -7px;
        top: 22px;
        height: 19px;
        width: 2px;
        background: var(--ds-accent);
        border-radius: 0 2px 2px 0;
      }
      .chat-title {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 4px;
        font-size: 11px;
        font-weight: 550;
        min-width: 0;
      }
      .chat-title time {
        font-size: 9px;
        font-weight: 400;
        color: var(--ds-faint);
        flex: none;
      }
      .chat-preview {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 5px;
        margin-top: 5px;
        font-size: 10px;
        color: var(--ds-muted);
      }
      .chat-row .badge.count {
        font-size: 8px;
        line-height: 15px;
        min-width: 15px;
        padding: 0 4px;
        border: 0;
        background: var(--ds-accent);
        color: var(--ds-surface);
      }
      [data-theme="dark"] .chat-row .badge.count {
        color: #172132;
      }
      .inbox-footer {
        display: flex;
        align-items: center;
        gap: 6px;
        border-top: 1px solid var(--ds-border);
        padding: 11px 13px;
        font-size: 9px;
        color: var(--ds-muted);
      }
      .inbox-footer .dot {
        color: var(--ds-success);
        width: 5px;
        height: 5px;
      }
      .conversation {
        display: flex;
        flex-direction: column;
        min-width: 0;
        min-height: 0;
        background: var(--ds-surface);
      }
      .conversation-head {
        display: flex;
        align-items: center;
        flex-shrink: 0;
        gap: 10px;
        min-height: 60px;
        padding: 11px 19px;
        border-bottom: 1px solid var(--ds-border);
      }
      .conversation-head strong {
        font-size: 13px;
        font-weight: 600;
        display: block;
        overflow: hidden;
        white-space: nowrap;
        text-overflow: ellipsis;
      }
      .conversation-head .subtitle {
        font-size: 10px;
        color: var(--ds-muted);
        margin-top: 3px;
      }
      .conversation-head .hash {
        color: var(--ds-faint);
        margin-right: 3px;
      }
      .head-tools {
        display: flex;
        align-items: center;
        gap: 3px;
        margin-left: auto;
      }
      .head-tools .icon-btn {
        width: 29px;
        height: 29px;
      }
      .pinned {
        display: flex;
        align-items: center;
        flex-shrink: 0;
        gap: 8px;
        padding: 9px 20px;
        background: var(--ds-subtle);
        border-bottom: 1px solid var(--ds-border);
        font-size: 10px;
        color: var(--ds-muted);
      }
      .pinned > .icon {
        width: 12px;
        height: 12px;
        flex: none;
      }
      .pinned strong {
        font-weight: 500;
        color: var(--ds-text);
      }
      .message-feed {
        flex: 1;
        overflow: auto;
        min-height: 0;
        padding: 20px 22px 8px;
        scroll-behavior: smooth;
      }
      .day-divider {
        display: flex;
        align-items: center;
        gap: 12px;
        font-size: 9px;
        color: var(--ds-faint);
        margin: 0 0 22px;
      }
      .day-divider::before,
      .day-divider::after {
        content: "";
        height: 1px;
        background: var(--ds-border);
        flex: 1;
      }
      .message {
        position: relative;
        display: flex;
        gap: 10px;
        margin-bottom: 20px;
        min-width: 0;
      }
      .message .avatar {
        width: 30px;
        height: 30px;
        font-size: 10px;
      }
      .message-content {
        flex: 1;
        min-width: 0;
      }
      .message-author {
        display: flex;
        align-items: center;
        flex-wrap: wrap;
        gap: 7px;
        margin-bottom: 5px;
        font-size: 12px;
        font-weight: 550;
      }
      .message-author time {
        font-size: 10px;
        font-weight: 400;
        color: var(--ds-faint);
      }
      .message-author .badge {
        font-size: 8px;
        line-height: 12px;
        padding: 0 4px;
      }
      .message-text {
        font-size: 13px;
        line-height: 1.7;
        color: var(--ds-text);
        overflow-wrap: anywhere;
      }
      .mention {
        color: var(--ds-accent-text);
        background: var(--ds-accent-soft);
        border-radius: 3px;
        padding: 1px 3px;
      }
      .message-actions {
        position: absolute;
        top: -14px;
        right: 0;
        display: flex;
        padding: 2px;
        border: 1px solid var(--ds-border);
        border-radius: 7px;
        background: var(--ds-raised);
        box-shadow: var(--ds-shadow);
        opacity: 0;
        pointer-events: none;
        transition: opacity var(--ds-motion);
      }
      .message:hover .message-actions,
      .message:focus-within .message-actions {
        opacity: 1;
        pointer-events: auto;
      }
      .message-actions .icon-btn {
        width: 25px;
        height: 24px;
      }
      .message-actions .icon {
        width: 14px;
        height: 14px;
      }
      .reactions {
        display: flex;
        align-items: center;
        gap: 5px;
        margin-top: 8px;
        flex-wrap: wrap;
      }
      .reaction {
        display: flex;
        align-items: center;
        gap: 5px;
        min-height: 23px;
        padding: 2px 6px;
        border: 1px solid var(--ds-border);
        border-radius: 5px;
        background: var(--ds-subtle);
        font-size: 10px;
      }
      .reaction[aria-pressed="true"] {
        color: var(--ds-accent-text);
        border-color: color-mix(
          in srgb,
          var(--ds-accent) 35%,
          var(--ds-border)
        );
        background: var(--ds-accent-soft);
      }
      .thread-link {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        margin-top: 8px;
        padding: 0;
        background: transparent;
        color: var(--ds-accent-text);
        font-size: 10px;
      }
      .thread-link .avatar {
        width: 17px;
        height: 17px;
        font-size: 6px;
      }
      .file-card {
        display: flex;
        align-items: center;
        gap: 10px;
        width: max-content;
        max-width: 100%;
        padding: 10px 12px;
        margin-top: 9px;
        border: 1px solid var(--ds-border);
        border-radius: 8px;
        background: var(--ds-subtle);
        text-align: left;
      }
      .file-icon {
        display: grid;
        place-items: center;
        width: 29px;
        height: 33px;
        border: 1px solid var(--ds-border);
        border-radius: 5px;
        color: var(--ds-accent);
        background: var(--ds-surface);
      }
      .file-card strong {
        display: block;
        font-size: 10px;
        font-weight: 500;
        overflow-wrap: anywhere;
      }
      .file-card small {
        display: block;
        font-size: 9px;
        color: var(--ds-muted);
        margin-top: 3px;
      }
      .file-card > .icon {
        width: 14px;
        height: 14px;
        color: var(--ds-faint);
        margin-left: 9px;
      }
      .agent-summary {
        margin-top: 8px;
        border: 1px solid var(--ds-border);
        border-radius: 8px;
        background: var(--ds-subtle);
        padding: 11px 12px;
      }
      .agent-summary ul {
        margin: 6px 0 0;
        padding-left: 15px;
        font-size: 10px;
        line-height: 1.8;
        color: var(--ds-muted);
      }
      .composer-area {
        flex-shrink: 0;
        padding: 10px 18px 11px;
      }
      .composer {
        border: 1px solid var(--ds-border-strong);
        border-radius: 9px;
        background: var(--ds-surface);
        overflow: hidden;
        box-shadow: 0 1px 3px #00000003;
      }
      .composer:focus-within {
        border-color: var(--ds-accent);
        box-shadow: 0 0 0 2px var(--ds-accent-soft);
      }
      .composer textarea {
        display: block;
        width: 100%;
        height: 58px;
        min-height: 48px;
        max-height: 130px;
        resize: none;
        border: 0;
        background: transparent;
        padding: 13px 12px;
        font-size: 12px;
        line-height: 1.6;
        outline: none;
      }
      .composer textarea:focus-visible {
        outline: none;
      }
      .composer-bar {
        display: flex;
        align-items: center;
        gap: 2px;
        padding: 5px 7px;
        border-top: 1px solid var(--ds-border);
        background: var(--ds-subtle);
      }
      .composer-bar .icon-btn {
        width: 27px;
        height: 26px;
      }
      .composer-bar .icon {
        width: 15px;
        height: 15px;
      }
      .composer-bar .divider {
        width: 1px;
        height: 15px;
        background: var(--ds-border);
        margin: 0 5px;
      }
      .send-btn {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 6px;
        min-width: 28px;
        height: 27px;
        padding: 5px 7px;
        border-radius: 6px;
        background: var(--ds-primary);
        color: var(--ds-on-primary);
        margin-left: auto;
        font-size: 10px;
      }
      .send-btn:disabled {
        opacity: 0.4;
      }
      .composer-hint {
        display: flex;
        align-items: center;
        justify-content: space-between;
        font-size: 8px;
        color: var(--ds-faint);
        margin-top: 7px;
        padding: 0 2px;
      }
      .composer-hint .icon {
        width: 10px;
        height: 10px;
      }
      .attachment-draft {
        display: flex;
        align-items: center;
        gap: 6px;
        margin: 6px 10px;
        padding: 5px 8px;
        border-radius: 5px;
        background: var(--ds-subtle);
        font-size: 10px;
      }
      .mini .app-rail {
        gap: 6px;
        padding-top: 11px;
      }
      .mini .app-rail .brand-mark {
        width: 20px;
        height: 21px;
        margin-bottom: 13px;
      }
      .mini .app-rail .icon-btn {
        width: 29px;
        height: 29px;
      }
      .mini .app-rail .icon {
        width: 16px;
        height: 16px;
      }
      .mini .inbox-head {
        min-height: 48px;
        padding: 11px 11px 8px;
      }
      .mini .inbox-head h3 {
        font-size: 12px;
      }
      .mini .inbox-tabs {
        padding: 0 9px 7px;
      }
      .mini .inbox-search {
        padding: 0 9px 9px;
      }
      .mini .chat-row {
        padding: 9px 5px;
        gap: 7px;
        min-height: 57px;
      }
      .mini .chat-row .avatar {
        width: 28px;
        height: 28px;
        font-size: 9px;
      }
      .mini .chat-title {
        font-size: 10px;
      }
      .mini .chat-preview {
        font-size: 9px;
        margin-top: 3px;
      }
      .mini .chat-title time {
        font-size: 8px;
      }
      .mini .inbox-group {
        font-size: 8px;
        padding-top: 5px;
      }
      .mini .conversation-head {
        min-height: 49px;
        padding: 8px 14px;
      }
      .mini .conversation-head strong {
        font-size: 11px;
      }
      .mini .conversation-head .subtitle {
        font-size: 8px;
      }
      .mini .pinned {
        font-size: 9px;
        padding: 8px 14px;
      }
      .mini .message-feed {
        padding: 14px 16px 2px;
      }
      .mini .day-divider {
        margin-bottom: 16px;
        font-size: 8px;
      }
      .mini .message {
        margin-bottom: 15px;
        gap: 8px;
      }
      .mini .message-author {
        font-size: 10px;
        margin-bottom: 3px;
      }
      .mini .message-text {
        font-size: 10px;
        line-height: 1.6;
      }
      .mini .message .avatar {
        width: 26px;
        height: 26px;
        font-size: 9px;
      }
      .mini .message-author time {
        font-size: 8px;
      }
      .mini .composer-area {
        padding: 7px 12px 9px;
      }
      .mini .composer textarea {
        height: 45px;
        min-height: 40px;
        padding: 11px;
        font-size: 10px;
      }
      .mini .composer-bar {
        padding: 3px 5px;
      }
      .mini .composer-hint {
        display: none;
      }
      .mini .mini-hide {
        display: none;
      }
      .product-frame {
        border: 1px solid var(--ds-border);
        border-radius: 10px;
        overflow: hidden;
      }
      .back-to-list {
        display: none;
      }
      .thread-pane {
        position: absolute;
        right: 0;
        top: 0;
        bottom: 0;
        width: min(350px, 100%);
        z-index: 5;
        display: flex;
        flex-direction: column;
        border-left: 1px solid var(--ds-border);
        background: var(--ds-surface);
        box-shadow: -10px 0 28px #00000008;
      }
      .thread-pane .message-feed {
        padding-top: 24px;
      }
      .prefs {
        max-width: 670px;
        margin: 0 auto;
      }
      .prefs-section {
        margin-top: 26px;
      }
      .prefs-section > h3 {
        font-size: 12px;
        margin-bottom: 11px;
      }
      .prefs-card {
        padding: 0 17px;
        border: 1px solid var(--ds-border);
        border-radius: 10px;
      }
      .prefs-row {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 20px;
        min-height: 76px;
        padding: 16px 0;
        border-bottom: 1px solid var(--ds-border);
      }
      .prefs-row:last-child {
        border: 0;
      }
      .prefs-row h4 {
        font-size: 12px;
        font-weight: 500;
      }
      .prefs-row p {
        font-size: 11px;
        color: var(--ds-muted);
        margin-top: 4px;
        max-width: 410px;
      }
      .prefs-row .field {
        min-width: 145px;
      }
      .profile-card {
        display: flex;
        align-items: center;
        gap: 14px;
        padding: 20px;
        border: 1px solid var(--ds-border);
        border-radius: 10px;
      }
      .profile-card h3 {
        font-size: 13px;
      }
      .profile-card p {
        font-size: 11px;
        color: var(--ds-muted);
        margin-top: 3px;
      }
      .profile-card .btn {
        margin-left: auto;
      }
      .saved-indicator {
        display: flex;
        align-items: center;
        gap: 5px;
        font-size: 10px;
        color: var(--ds-success);
      }

      /* 05. Overlays and responsive layouts. */
      dialog {
        width: min(460px, calc(100% - 32px));
        padding: 0;
        border: 1px solid var(--ds-border);
        border-radius: 14px;
        background: var(--ds-surface);
        color: var(--ds-text);
        box-shadow: var(--ds-shadow-pop);
        max-height: 85%;
        overflow: auto;
      }
      dialog::backdrop {
        background: var(--ds-overlay);
        backdrop-filter: blur(3px);
      }
      .dialog-head {
        display: flex;
        align-items: flex-start;
        justify-content: space-between;
        gap: 16px;
        padding: 21px 22px 18px;
        border-bottom: 1px solid var(--ds-border);
      }
      .dialog-head h2 {
        font-size: 16px;
      }
      .dialog-head p {
        font-size: 11px;
        color: var(--ds-muted);
        margin-top: 5px;
      }
      .dialog-body {
        padding: 21px 22px;
        display: grid;
        gap: 16px;
      }
      .dialog-foot {
        display: flex;
        align-items: center;
        justify-content: flex-end;
        gap: 8px;
        padding: 14px 22px;
        border-top: 1px solid var(--ds-border);
        background: var(--ds-subtle);
      }
      .search-dialog {
        width: min(520px, calc(100% - 32px));
      }
      .search-dialog .dialog-head {
        align-items: center;
        padding: 14px 17px;
      }
      .search-dialog input {
        padding: 4px;
        border: 0;
        outline: 0;
        min-height: 30px;
        width: 100%;
        background: transparent;
        font-size: 13px;
      }
      .search-results {
        padding: 8px;
        max-height: 360px;
        overflow: auto;
        min-height: 100px;
      }
      .search-result {
        display: flex;
        align-items: center;
        gap: 10px;
        width: 100%;
        padding: 11px 12px;
        background: transparent;
        border-radius: 7px;
        text-align: left;
        font-size: 12px;
      }
      .search-result:hover {
        background: var(--ds-hover);
      }
      .search-result small {
        display: block;
        color: var(--ds-muted);
        font-size: 10px;
        margin-top: 3px;
      }
      .search-result > .icon {
        color: var(--ds-muted);
      }

          document.body.append(area);

        const msg = {
          id: "local-" + Date.now(),
          name: "Лев Павлов",
          initials: "ЛП",
          color: "",
          time: new Date().toLocaleTimeString("ru-RU", {
            hour: "2-digit",

          size: state.attachment

          attachment: state.attachment || undefined,

          msg.parent = state.threadParent;
          state.threadReplies.push(msg);

              el.setAttribute("aria-selected", String(el === button)),
            );
            const next = group.nextElementSibling;
            if (next?.hasAttribute("data-tab-description"))
              next.textContent = button.dataset.label;
            break;
          }
          case "select-chat":
            state.chat = button.dataset.chat;
            state.mobileChat = true;
            state.thread = false;
            chats.find((c) => c.id === state.chat).count = 0;
            updateChat();
            break;
          case "chat-filter":
            state.chatFilter = button.dataset.value;
            updateChat();
            break;
          case "back-to-list":
            state.mobileChat = false;
            updateChat();
            break;
          case "all-chats":
            state.chatFilter = "all";
            state.chatQuery = "";
            state.mobileChat = false;
            updateChat();
            break;
          case "go-settings":
            goView("settings");
            break;
          case "thread":
            if (state.view !== "messenger") goView("messenger");
            state.threadParent =
              button.dataset.message ||
              (messages[state.chat] || [])[0]?.id ||
              "m1";
            state.mobileChat = true;
            state.thread = true;
            updateChat();
            break;
          case "close-thread":
            state.thread = false;
            updateChat();
            break;
          case "react": {
            const message = findMessage(button.dataset.message);
            if (message) {
              message.reacted = !message.reacted;
              message.reaction += message.reacted ? 1 : -1;
              button.setAttribute("aria-pressed", String(message.reacted));
              button.querySelector("span:last-child").textContent =
                message.reaction;
            }
            break;
          }
          case "add-reaction": {
            const message = findMessage(button.dataset.message);
            if (message) {
              if (message.reacted) {
                toast("Вы уже поддержали сообщение");
                break;
              }
              message.reaction = (message.reaction || 0) + 1;
              message.reacted = true;
              const article = button.closest(".message");
              const fresh = document.createElement("div");
              fresh.innerHTML = renderMessage(message);
              article.replaceWith(fresh.firstElementChild);
            }
            break;
          }
          case "toggle-important": {
            const selected = button.getAttribute("aria-pressed") !== "true";
            button.setAttribute("aria-pressed", String(selected));
            button.classList.toggle("active", selected);
            toast(
              selected
                ? "Сообщение добавлено в важное"
                : "Сообщение убрано из важного",
            );
            break;
          }
          case "important":
            showDialog(
              `${dialogHead("Важные сообщения", "Сохранённое из ваших разговоров.")}<div class="dialog-body">${renderMessage(messages.design[0])}</div><div class="dialog-foot"><button class="btn" data-action="close-dialog">Закрыть</button></div>`,
            );
            break;
          case "members":
            showDialog(
              `${dialogHead("Участники", "Дизайн-команда · 8 участников")}<div class="dialog-body">${[
                ["АС", "rose", "Анна Смирнова", "Дизайнер"],
                ["МВ", "sand", "Михаил Волков", "Продакт-менеджер"],
                ["ЛП", "", "Лев Павлов", "Владелец"],
                ["ДК", "sage", "Дмитрий Козлов", "Разработчик"],
              ]
                .map(
                  ([initials, color, name, role]) =>
                    `<div class="flex" style="gap:10px">${A(initials, color, "", true)}<div class="grow"><strong class="small" style="font-weight:500">${name}</strong><p class="hint">${role}</p></div>${B("В сети", "green")}</div>`,
                )
                .join(
                  "",
                )}</div><div class="dialog-foot"><button class="btn" data-action="close-dialog">Закрыть</button><button class="btn primary" data-action="invite-demo">${I("plus", "sm")}Пригласить</button></div>`,
            );
            break;
          case "invite-demo": {
            const ok = await copy("https://coma.example/invite/design-demo");
            toast(
              ok
                ? "Демонстрационная ссылка скопирована"
                : "Копирование недоступно",
              ok ? "success" : "warning",
            );
            break;
          }
          case "menu":
            openMenu(button);
            break;
          case "message-menu":
            openMenu(button, button.dataset.message);
            break;
          case "copy-message": {
            const message = findMessage(button.dataset.message);
            if (message) {
              const content = document.createElement("div");
              content.innerHTML = message.trusted
                ? message.text
                : escapeHTML(message.text);
              const ok = await copy(content.textContent);
              toast(
                ok ? "Текст сообщения скопирован" : "Копирование недоступно",
                ok ? "success" : "warning",
              );
            }
            break;
          }
          case "mute":
            state.notification = !state.notification;
            toast(
              state.notification
                ? "Уведомления включены"
                : "Уведомления отключены",
            );
            break;
          case "download-demo":
            download("Coma — основы дизайна.txt", demoDocument());
            toast("Скачан текстовый пример документа");
            break;
          case "download-attachment": {
            const message = findMessage(button.dataset.message);
            if (message?.attachment) {
              const url = URL.createObjectURL(message.attachment);
              const link = document.createElement("a");
              link.href = url;
              link.download = message.attachment.name;
              link.click();
              setTimeout(() => URL.revokeObjectURL(url), 1000);
            }
            break;
          }
          case "upload":
            uploadContext = activeComposer(button);
            $("#attachment-input").click();
            break;
          case "remove-attachment":
            state.attachment = null;
            updateChat();
            break;
          case "emoji":
            insertText(activeComposer(button), "🙂 ");
            break;
          case "mention":
            insertText(activeComposer(button), "@Анна Смирнова ");
            break;
          case "format": {
            const form = activeComposer(button);
            if (form) {
              const input = $("textarea", form);
              const selection =
                input.value.slice(input.selectionStart, input.selectionEnd) ||
                "текст";
              insertText(form, "**" + selection + "**");
            }
            break;
          }
          case "assistant":
            insertText(
              activeComposer(button),
              "@Coma Assistant подведи итоги обсуждения",
            );
            break;
          case "open-assistant":
            state.chat = "assistant";
            state.mobileChat = true;
            goView("messenger");
            break;
          case "pin-info":
            showDialog(
              `${dialogHead("Закреплённое сообщение", "Дизайн-команда")}<div class="dialog-body">${renderMessage(messages.design[2])}</div><div class="dialog-foot"><button class="btn" data-action="close-dialog">Закрыть</button></div>`,
            );
            break;
          case "search-messages":
            showDialog(
              `${dialogHead("Поиск в переписке", escapeHTML(chats.find((c) => c.id === state.chat)?.title || "Чат"))}<div class="dialog-body"><div class="input-wrap">${I("search", "sm")}<input class="input" id="message-search" placeholder="Введите слово или фразу" aria-label="Поиск сообщений" autofocus></div><div id="message-search-results" class="stack"><p class="hint">Начните вводить, чтобы найти сообщение в текущем чате.</p></div></div>`,
            );
            break;
          case "edit-profile":
            showDialog(
              `<form id="profile-form">${dialogHead("Личный профиль", "Как вас видит команда.")}<div class="dialog-body"><div class="field"><label for="profile-name">Имя</label><input id="profile-name" name="name" value="${escapeHTML(storage.get("profile-name", "Лев Павлов"))}" maxlength="80" required autofocus></div><div class="field"><label for="profile-email">Электронная почта</label><input id="profile-email" name="email" type="email" value="${escapeHTML(storage.get("profile-email", "lev@coma.team"))}" required></div></div><div class="dialog-foot"><button type="button" class="btn" data-action="close-dialog">Отмена</button><button class="btn primary" type="submit">Сохранить</button></div></form>`,
            );
            break;
        }
      });
      document.addEventListener("input", (event) => {
        const el = event.target;
        if (el instanceof HTMLInputElement) el.setCustomValidity("");
        if (el.id === "component-search") {
          state.componentQuery = el.value;
          $("#component-grid").innerHTML = renderComponentCards();
        }
        if (el.id === "command-search")
          $("#command-results").innerHTML = searchItems(el.value);
        if (el.hasAttribute("data-chat-search")) {
          state.chatQuery = el.value;
          const root = el.closest("[data-messenger]");
          $(".chat-list", root).innerHTML = chatRows(
            root.classList.contains("mini"),
          );
        }
        if (el.hasAttribute("data-composer-input")) {
          const form = el.closest("form");
          state.drafts[
            form.dataset.composer === "main"
              ? state.chat
              : form.dataset.composer
          ] = el.value;
          $(".send-btn", form).disabled =
            !el.value.trim() &&
            !(state.attachment && form.dataset.composer === "main");
        }
        if (el.id === "message-search") {
          const query = el.value.trim().toLowerCase();
          const list = (messages[state.chat] || []).filter((m) =>
            m.text.toLowerCase().includes(query),
          );
          $("#message-search-results").innerHTML = !query
            ? '<p class="hint">Начните вводить, чтобы найти сообщение.</p>'
            : list.length
              ? list.map((m) => renderMessage(m)).join("")
              : '<p class="hint">Совпадений нет. Попробуйте другое слово.</p>';
        }
      });
      document.addEventListener("change", (event) => {
        const el = event.target;
        if (el.dataset.saveSelect) {
          storage.set("setting-" + el.dataset.saveSelect, el.value);
          markSaved();
        }
        if (el.id === "attachment-input" && el.files[0]) {
          const file = el.files[0];
          if (
            uploadContext?.dataset.composer === "thread" ||
            uploadContext?.dataset.composer === "pattern"
          ) {
            insertText(uploadContext, "[Файл: " + file.name + "]");
            toast("Имя файла добавлено к сообщению");
          } else {
            state.attachment = file;
            if (state.view !== "messenger") goView("messenger");
            state.mobileChat = true;
            const previous =
              $('textarea[data-composer-input="main"]')?.value || "";
            updateChat();
            const input = $('textarea[data-composer-input="main"]');
            if (input) {
              input.value = previous;
              input.dispatchEvent(new Event("input", { bubbles: true }));
              input.focus();
            }
            toast("Файл прикреплён: " + file.name);
          }
          el.value = "";
        }
      });
      document.addEventListener("submit", (event) => {
        const form = event.target;
        event.preventDefault();
        if (form.matches("[data-composer]")) sendMessage(form);
        if (form.id === "new-chat-form") {
          const data = new FormData(form);
          const title = String(data.get("name")).trim();
          if (!title) {
            $("#new-chat-name").setCustomValidity("Введите название чата");
            $("#new-chat-name").reportValidity();
            return;
          }
          const id = "chat-" + Date.now();
          chats.unshift({
            id,
            title,
            initials: title
              .split(/\s+/)
              .map((s) => s[0])
              .slice(0, 2)
              .join("")
              .toUpperCase(),
            color: "sage",
            preview: "Чат создан. Начните разговор",
            time: "Сейчас",
            count: 0,
            type: data.get("type"),
            members: "3 участника · 3 в сети",
          });
          messages[id] = [];
          state.chat = id;
          state.chatFilter = "all";
          state.chatQuery = "";
          state.mobileChat = true;
          $("#dialog").close();
          goView("messenger");
          toast("Чат «" + title + "» создан");
        }
        if (form.id === "profile-form") {
          const data = new FormData(form);
          const name = String(data.get("name")).trim();
          if (!name) {
            $("#profile-name").setCustomValidity("Введите имя");
            $("#profile-name").reportValidity();
            return;
          }
          storage.set("profile-name", name);
          storage.set("profile-email", String(data.get("email")).trim());
          $("#dialog").close();
          render();
          toast("Профиль обновлён");
        }
      });
      document.addEventListener("keydown", (event) => {
        const input = event.target;
        if (
          (event.metaKey || event.ctrlKey) &&
          event.key.toLowerCase() === "k"
        ) {
          event.preventDefault();
          openSearch();
          return;
        }
        if (event.key === "Escape") closeMenu();
        if (input.matches("input")) input.setCustomValidity("");
        if (
          input.matches("textarea[data-composer-input]") &&
          event.key === "Enter" &&
          !event.shiftKey &&
          !event.isComposing
        ) {
          event.preventDefault();
          sendMessage(input.closest("form"));
          return;
        }
        const menu = $(".floating-menu");
        if (
          menu &&
          ["ArrowDown", "ArrowUp", "Home", "End"].includes(event.key)
        ) {
          event.preventDefault();
          const buttons = $$("button", menu);
          const index = buttons.indexOf(document.activeElement);
          const next =
            event.key === "Home"
              ? 0
              : event.key === "End"
                ? buttons.length - 1
                : (index +
                    (event.key === "ArrowDown" ? 1 : -1) +
                    buttons.length) %
                  buttons.length;
          buttons[next].focus();
          return;
        }
        const search = $("#command-search");
        if (
          search &&
          $("#dialog").open &&
          ["ArrowDown", "ArrowUp", "Enter"].includes(event.key)
        ) {
          const buttons = $$(".search-result");
          if (!buttons.length) return;
          event.preventDefault();
          let index = buttons.indexOf(document.activeElement);
          if (event.key === "Enter") {
            (index >= 0 ? buttons[index] : buttons[0]).click();
            return;
          }
          index =
            (index + (event.key === "ArrowDown" ? 1 : -1) + buttons.length) %
            buttons.length;
          buttons[index].focus();
          return;
        }
        const group = input.closest('[role="tablist"]');
        if (
          group &&
          ["ArrowRight", "ArrowLeft", "Home", "End"].includes(event.key)
        ) {
          event.preventDefault();
          const buttons = $$("button", group);
          const index = buttons.indexOf(input);
          const next =
            event.key === "Home"
              ? 0
              : event.key === "End"
                ? buttons.length - 1
                : (index +
                    (event.key === "ArrowRight" ? 1 : -1) +
                    buttons.length) %
                  buttons.length;
          buttons[next].focus();
          buttons[next].click();
        }
      });
      $("#dialog").addEventListener("click", (event) => {
        if (event.target === $("#dialog")) {
          const rect = event.target.getBoundingClientRect();
          if (
            event.clientX < rect.left ||
            event.clientX > rect.right ||
            event.clientY < rect.top ||
            event.clientY > rect.bottom
          )
            event.target.close();
        }
      });
      window.addEventListener("hashchange", () => {
        const id = location.hash.slice(1);
        if (viewRenderers[id] && state.view !== id) {
          state.view = id;
          state.thread = false;
          render();
        }
      });
      function findMessage(id) {
        return [...Object.values(messages).flat(), ...state.threadReplies].find(
          (m) => m.id === id,
        );
      }
      function demoDocument() {
        return "Coma — основы дизайна\n\nВерсия 0.1 · HTML-прототип\n\n1. Нейтральные поверхности и тонкие границы.\n2. Один акцентный цвет.\n3. Шаг отступов 4 px.\n4. Скругления: 6, 8, 12 и 16 px.\n5. Onest: 400, 500, 600.\n6. Общие компоненты для мессенджера и настроек.\n\nСначала согласуем систему, затем перенесём её в продукт.\n";
      }
      if (viewRenderers[location.hash.slice(1)])
        state.view = location.hash.slice(1);
      render();
    </script>
  </body>
</html>
