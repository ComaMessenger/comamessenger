# Server address → sign in → chat list → send a message → threads → more.
# Needs a seeded instance; see README. Run: maestro test e2e/sign-in.yaml
appId: com.comamessenger.app
env:
  SERVER: localhost:8080
  EMAIL: lev@example.test
  PASSWORD: coma-mobile-dev-1
  METRO: http%3A%2F%2Flocalhost%3A8081
  DEV_CLIENT: "false"
---
- launchApp:
    clearState: true
    clearKeychain: true
# Development builds start in the dev-client launcher; point it at Metro
# (maestro test -e DEV_CLIENT=true e2e/sign-in.yaml). Release starts by itself.
- runFlow:
    when:
      true: ${DEV_CLIENT == 'true'}
    commands:
      - openLink: exp+coma://expo-development-client/?url=${METRO}
# First launch after a state reset shows the dev menu onboarding sheet.
- runFlow:
    when:
      visible: Continue
    commands:
      - tapOn: Continue
- runFlow:
    when:
      visible: Reload
    commands:
      - tapOn:
          point: 91%,47%
- extendedWaitUntil:
    visible: .*(Подключение|Вход).*
    timeout: 60000
# The server step is skipped when the app still remembers the address.
- runFlow:
    when:
      visible:
        id: server-address
    commands:
      - tapOn:
          id: server-address
      - inputText: http://${SERVER}
      - tapOn:
          id: server-continue
- extendedWaitUntil:
    visible:
      id: login-email
    timeout: 15000
- tapOn:
    id: login-email
- inputText: ${EMAIL}
# Typing into a secure field on the simulator drops characters; reveal first.
- tapOn:
    id: login-password-reveal
- tapOn:
    id: login-password
- inputText: ${PASSWORD}
- tapOn:
    id: login-submit
# iOS offers to save the password in the Passwords app.
- extendedWaitUntil:
    visible: (Не сейчас|Not Now)
    timeout: 5000
    optional: true
- runFlow:
    when:
      visible: (Не сейчас|Not Now)
    commands:
      - tapOn: (Не сейчас|Not Now)
- extendedWaitUntil:
    visible:
      id: chat-list
    timeout: 15000
- extendedWaitUntil:
    notVisible:
      id: connection-banner
    timeout: 15000
- takeScreenshot: chats
- tapOn:
    id: chat-row-0
- assertVisible:
    id: conversation
- runFlow:
    file: send-message.yaml
    env:
      TEXT: "Сообщение с телефона"
- extendedWaitUntil:
    visible: .*Сообщение с телефона.*
    timeout: 10000
- takeScreenshot: conversation
- tapOn:
    id: conversation-back
- runFlow:
    file: tabs.yaml
    env:
      TAB: threads
- assertVisible:
    id: thread-list
- runFlow:
    file: tabs.yaml
    env:
      TAB: more
- takeScreenshot: more
