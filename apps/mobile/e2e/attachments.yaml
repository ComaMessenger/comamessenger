# Picks a photo from the simulator library, sends it and checks the preview.
# Run after sign-in.yaml: maestro test e2e/attachments.yaml
appId: com.comamessenger.app
---
- runFlow: open-app.yaml
- tapOn:
    id: chat-row-0
# "+" opens the sheet of attachments and actions.
- tapOn:
    id: composer-attach
- extendedWaitUntil:
    visible:
      id: composer-sheet
    timeout: 5000
- takeScreenshot: composer-sheet
- tapOn:
    id: composer-action-photos
- extendedWaitUntil:
    visible: .*(Photos|Фото|Recents|Недавние).*
    timeout: 15000
# The second photo of the simulator's sample library, by its label: iOS 26
# picks several (a tap only marks it), and a tap by point could land before
# the grid is drawn.
- tapOn:
    text: (Photo|Фотография), .*
    index: 1
- waitForAnimationToEnd:
    timeout: 2000
# iOS 26 confirms with «Готово» (the check mark), older iOS with «Добавить»;
# single-pick pickers close by themselves.
- runFlow:
    when:
      visible: (Done|Готово)
    commands:
      - tapOn: (Done|Готово)
- runFlow:
    when:
      visible: (Add|Добавить)
    commands:
      - tapOn: (Add|Добавить)
# The send button becomes enabled once the upload finishes.
- extendedWaitUntil:
    visible:
      id: composer-send
      enabled: true
    timeout: 30000
- takeScreenshot: attachment-ready
- tapOn:
    id: composer-send
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: attachment-sent
