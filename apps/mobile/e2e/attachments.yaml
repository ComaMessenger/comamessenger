# Picks a photo from the simulator library, sends it and checks the preview.
# Run after sign-in.yaml: maestro test e2e/attachments.yaml
appId: com.comamessenger.app
---
- runFlow: open-app.yaml
- tapOn:
    id: chat-row-0
# "+" opens the sheet of attachments and actions.
- tapOn:
    id: composer-attach
- extendedWaitUntil:
    visible:
      id: composer-sheet
    timeout: 5000
- takeScreenshot: composer-sheet
- tapOn:
    id: composer-action-photos
- extendedWaitUntil:
    visible: .*(Photos|Фото|Recents|Недавние).*
    timeout: 15000
# Second photo of the simulator's sample library.
- tapOn:
    point: 50%,28%
# Older iOS confirms with «Добавить»; iOS 26 with a check mark top right.
- runFlow:
    when:
      visible: (Add|Добавить)
    commands:
      - tapOn: (Add|Добавить)
- runFlow:
    when:
      notVisible:
        id: composer-send
    commands:
      - tapOn:
          point: 89%,16%
# The send button becomes enabled once the upload finishes.
- extendedWaitUntil:
    visible:
      id: composer-send
      enabled: true
    timeout: 30000
- takeScreenshot: attachment-ready
- tapOn:
    id: composer-send
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: attachment-sent
