# Swipe back from the left edge and swipe to reply, in a feed full of
# messages (rows span the screen, so they used to take the edge swipe):
#   1. a message swiped to the left opens a reply in the composer;
#   2. a swipe from the left edge leaves a thread for its chat, the chat
#      for the chat list, and the direct chat with an agent for its card.
# Prerequisites: sign-in.yaml has run and the agents are seeded:
#   COMA_API=http://localhost:8080 node apps/mobile/e2e/seed-agents.mjs
# Run: maestro test -e THEME=light e2e/swipe-back.yaml
# (dark: xcrun simctl ui <device> appearance dark, then -e THEME=dark).
appId: com.comamessenger.app
---
- runScript: scripts/login.js
- runScript: scripts/reset-preferences.js
- runFlow: open-app.yaml
- tapOn:
    id: chat-row-0
- evalScript: ${output.tag = String(Date.now()).slice(-6)}
- runFlow:
    file: send-message.yaml
    env:
      TEXT: "Свайп ${output.tag}"
- extendedWaitUntil:
    visible: .*Свайп ${output.tag}.*
    timeout: 15000
- hideKeyboard:
    optional: true
- waitForAnimationToEnd:
    timeout: 2000

# 1. Reply: the message is swiped to the left, as in Telegram.
- swipe:
    from: .*Свайп ${output.tag}.*
    direction: LEFT
    duration: 500
- extendedWaitUntil:
    visible: Отменить ответ
    timeout: 5000
- takeScreenshot: swipe-reply-${THEME}
- tapOn: Отменить ответ
- assertNotVisible: Отменить ответ
- hideKeyboard:
    optional: true

# 2a. From a thread back to its chat. The edge swipe starts over the feed.
- runFlow:
    file: message-menu.yaml
    env:
      TEXT: ".*Свайп ${output.tag}.*"
- tapOn:
    id: message-action-thread
- extendedWaitUntil:
    visible:
      id: thread-root
    timeout: 10000
- runFlow:
    file: send-message.yaml
    env:
      TEXT: "Ответ ${output.tag}"
- extendedWaitUntil:
    visible: .*Ответ ${output.tag}.*
    timeout: 10000
- hideKeyboard:
    optional: true
- waitForAnimationToEnd:
    timeout: 2000
- swipe:
    start: 0%,55%
    end: 85%,55%
    duration: 600
- extendedWaitUntil:
    notVisible:
      id: thread-root
    timeout: 10000
- extendedWaitUntil:
    visible: .*Свайп ${output.tag}.*
    timeout: 10000

# 2b. From the chat back to the list, across the message rows.
- waitForAnimationToEnd:
    timeout: 2000
- takeScreenshot: swipe-back-chat-${THEME}
- swipe:
    start: 0%,55%
    end: 85%,55%
    duration: 600
- extendedWaitUntil:
    visible:
      id: chat-list
    timeout: 10000
- assertNotVisible:
    id: conversation
- takeScreenshot: swipe-back-list-${THEME}

# 2c. From the direct chat with an agent back to the agent's card.
- runFlow:
    file: tabs.yaml
    env:
      TAB: agents
- extendedWaitUntil:
    visible:
      id: agents-home
    timeout: 15000
- scrollUntilVisible:
    element:
      id: agent-row-e2e-svodka
    centerElement: true
    direction: DOWN
- tapOn:
    id: agent-row-e2e-svodka
- extendedWaitUntil:
    visible:
      id: agent-screen
    timeout: 10000
- scrollUntilVisible:
    element:
      id: agent-write
    direction: UP
- tapOn:
    id: agent-write
- runFlow:
    file: send-message.yaml
    env:
      TEXT: "Агенту ${output.tag}"
- extendedWaitUntil:
    visible: .*Агенту ${output.tag}.*
    timeout: 10000
- hideKeyboard:
    optional: true
- waitForAnimationToEnd:
    timeout: 2000
- swipe:
    start: 0%,55%
    end: 85%,55%
    duration: 600
- extendedWaitUntil:
    visible:
      id: agent-screen
    timeout: 10000
- assertNotVisible:
    id: conversation
- tapOn:
    id: agent-back
