# Thread reply, reaction and search on a message the flow sends itself.
# Run after sign-in.yaml (reuses its session): maestro test e2e/conversation.yaml
appId: com.comamessenger.app
---
- runFlow: open-app.yaml
- tapOn:
    id: chat-row-0
# A unique text per run keeps the flow independent of earlier runs.
- evalScript: ${output.tag = String(Date.now()).slice(-6)}
- tapOn:
    id: composer-input
- inputText: Тред ${output.tag}
- tapOn:
    id: composer-send
# Message rows are single accessible elements, so match by substring.
- extendedWaitUntil:
    visible: .*Тред ${output.tag}.*
    timeout: 15000
- longPressOn: .*Тред ${output.tag}.*
- extendedWaitUntil:
    visible:
      id: message-menu
    timeout: 5000
- tapOn:
    id: message-action-thread
# The thread screen pins the root message above the replies.
- extendedWaitUntil:
    visible:
      id: thread-root
    timeout: 10000
- tapOn:
    id: composer-input
- inputText: Ответ в треде
- tapOn:
    id: composer-send
- extendedWaitUntil:
    visible: .*Ответ в треде.*
    timeout: 10000
- takeScreenshot: thread
- tapOn:
    id: conversation-back
    retryTapIfNoChange: true
- extendedWaitUntil:
    notVisible:
      id: thread-root
    timeout: 10000
# The caption under the bubble: who replied, how many replies, when.
- extendedWaitUntil:
    visible: .*1 ответ.*
    timeout: 10000
- longPressOn: .*Тред ${output.tag}.*
- tapOn: 👍
- extendedWaitUntil:
    visible: .*👍.*
    timeout: 10000
- takeScreenshot: reactions
# Copy, forward and «views and reactions» from the long-press menu.
- longPressOn: .*Тред ${output.tag}.*
- takeScreenshot: message-menu
- tapOn:
    id: message-action-copyText
- extendedWaitUntil:
    visible: Текст скопирован
    timeout: 5000
- longPressOn: .*Тред ${output.tag}.*
- tapOn:
    id: message-action-details
- extendedWaitUntil:
    visible:
      id: message-details
    timeout: 10000
- takeScreenshot: message-details
- tapOn: Закрыть
- longPressOn: .*Тред ${output.tag}.*
- tapOn:
    id: message-action-forward
- extendedWaitUntil:
    visible:
      id: forward-sheet
    timeout: 10000
- takeScreenshot: forward
- tapOn: Закрыть
- tapOn:
    id: conversation-back
- tapOn:
    id: open-search
- inputText: ${output.tag}
- extendedWaitUntil:
    visible:
      text: .*${output.tag}.*
    timeout: 10000
- takeScreenshot: search
# Opening a search result jumps to the message and highlights it.
- eraseText: 30
- inputText: миграция
- extendedWaitUntil:
    visible: .*миграция готова.*
    timeout: 10000
- tapOn: .*миграция готова.*
- extendedWaitUntil:
    visible:
      id: conversation
    timeout: 10000
- takeScreenshot: search-jump
