# «Задача» from «+» (phase 6.6): what to do, the responsible person, a due
# date, two checklist items with their own people; then the card in the
# feed, the slot under the header, the list under it and «Все задачи чата».
# Run after sign-in.yaml:
#   node e2e/seed-tasks.mjs && maestro test -e THEME=light e2e/task-create.yaml
# THEME (light or dark) names the screenshots; no default here, a flow
# default would override -e.
appId: com.comamessenger.app
---
- runFlow: open-app.yaml
- tapOn: .*Инструкторы · задачи.*
- extendedWaitUntil:
    visible:
      id: conversation
    timeout: 10000
- evalScript: ${output.tag = String(Date.now()).slice(-6)}

# 1. «+» → «Задача».
- tapOn:
    id: composer-attach
- extendedWaitUntil:
    visible:
      id: composer-action-task
    timeout: 5000
- tapOn:
    id: composer-action-task
- extendedWaitUntil:
    visible:
      id: task-sheet
    timeout: 5000
- tapOn:
    id: task-title-input
# A form left by an earlier run comes back as it was: start it clean.
- eraseText: 200
- inputText: Подготовить зал к среде ${output.tag}
- tapOn:
    id: task-person-oleg_requests
- takeScreenshot: ${THEME}-task-sheet
- scrollUntilVisible:
    element:
      id: task-due-tomorrow
    direction: DOWN
- tapOn:
    id: task-due-tomorrow
- scrollUntilVisible:
    element:
      id: task-item-input-1
    direction: DOWN
- tapOn:
    id: task-item-input-0
- eraseText: 100
- inputText: Разложить маты
- tapOn:
    id: task-item-who-0
- extendedWaitUntil:
    visible:
      id: task-item-choice
    timeout: 5000
- takeScreenshot: ${THEME}-task-item-person
- tapOn:
    id: task-item-choice-anna_requests
- extendedWaitUntil:
    visible:
      id: task-item-input-1
    timeout: 5000
- tapOn:
    id: task-item-input-1
- eraseText: 100
- inputText: Проветрить зал
- tapOn:
    id: task-item-who-1
- tapOn:
    id: task-item-choice-lev
- scrollUntilVisible:
    element:
      id: task-create
    direction: DOWN
    visibilityPercentage: 100
- takeScreenshot: ${THEME}-task-sheet-checklist
- tapOn:
    id: task-create
- extendedWaitUntil:
    notVisible:
      id: task-sheet
    timeout: 10000

# 2. The card in the feed: «Задача · 0 из 2», Олег answers for it.
- extendedWaitUntil:
    visible: Подготовить зал к среде ${output.tag}
    timeout: 10000
- assertVisible: .*Олег.* · отвечает.*
- assertVisible: .*Задача · 0 из 2.*
- takeScreenshot: ${THEME}-task-card
# The author ticks an item.
- tapOn: Проветрить зал
- extendedWaitUntil:
    visible: .*Задача · 1 из 2.*
    timeout: 10000

# 3. The slot: «Задачи», the list under it, «Все задачи чата».
- runFlow:
    file: slot-kind.yaml
    env:
      KIND: tasks
- takeScreenshot: ${THEME}-task-slot
- tapOn:
    id: chat-slot-tasks
- extendedWaitUntil:
    visible:
      id: chat-tasks-drop
    timeout: 5000
- takeScreenshot: ${THEME}-task-drop
- tapOn:
    id: drop-all
- extendedWaitUntil:
    visible:
      id: chat-tasks
    timeout: 10000
- assertVisible: .*Подготовить зал к среде ${output.tag}.*
- takeScreenshot: ${THEME}-task-all
# The task screen of a row.
- tapOn: .*Подготовить зал к среде ${output.tag}.*
- extendedWaitUntil:
    visible:
      id: task-screen
    timeout: 10000
- assertVisible:
    id: task-edit
- takeScreenshot: ${THEME}-task-screen
- tapOn:
    id: task-screen-back
- tapOn:
    id: chat-tasks-back
- extendedWaitUntil:
    visible:
      id: conversation
    timeout: 10000
- tapOn:
    id: conversation-back
    retryTapIfNoChange: true
