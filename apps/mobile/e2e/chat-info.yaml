# Package I of phase 6.1: chat info from the conversation header — members,
# pinned messages, media, files, voice, links, notifications and the chat's search.
# Run after chat-create.yaml: the first chat is then a group the account owns.
# Fill its archive first: node e2e/seed-media.mjs, seed-voice.mjs and
# seed-archive.mjs (COMA_API, COMA_EMAIL, COMA_PASSWORD).
# maestro test e2e/chat-info.yaml
appId: com.comamessenger.app
---
- runFlow: open-app.yaml
- tapOn:
    id: chat-row-0
- extendedWaitUntil:
    visible:
      id: conversation
    timeout: 10000
- tapOn:
    id: conversation-title
- extendedWaitUntil:
    visible:
      id: chat-info
    timeout: 5000
- assertVisible:
    id: chat-info-title
- assertVisible:
    id: chat-info-mute
- assertVisible:
    id: chat-info-pin
- assertVisible:
    id: chat-info-search
- assertVisible:
    id: chat-info-folder
- takeScreenshot: chat-info

# Notification level sheet.
- tapOn:
    id: chat-info-notify
- extendedWaitUntil:
    visible:
      id: notify-levels
    timeout: 5000
- takeScreenshot: chat-info-notify
- tapOn:
    point: 50%,8%

# Pinned messages and files open as their own screens.
- tapOn:
    id: chat-info-pinned
- extendedWaitUntil:
    visible:
      id: pinned-messages
    timeout: 10000
- takeScreenshot: chat-pinned
- tapOn:
    id: pinned-back
# Media, files, voice and links: one screen with tabs, opened at the row's tab.
- tapOn:
    id: chat-info-media
- extendedWaitUntil:
    visible:
      id: chat-shared
    timeout: 10000
- takeScreenshot: chat-shared-media
# A tile opens the feed's full-screen viewer, paging through the chat's media
# from the server: the newest first, «N of N» over the whole chat; a swipe
# right shows the previous item — the portrait video, in the built-in player.
- tapOn:
    id: shared-media-tile-0
- extendedWaitUntil:
    visible:
      id: media-viewer-loaded
    timeout: 15000
- assertVisible:
    id: media-viewer-counter
- takeScreenshot: chat-shared-viewer
- swipe:
    start: 15%, 50%
    end: 90%, 50%
    duration: 300
- waitForAnimationToEnd:
    timeout: 3000
- extendedWaitUntil:
    visible:
      id: media-video-controls
    timeout: 15000
- takeScreenshot: chat-shared-viewer-video
- swipe:
    start: 50%, 45%
    end: 50%, 85%
    duration: 250
- extendedWaitUntil:
    notVisible:
      id: media-viewer
    timeout: 5000
- tapOn:
    id: shared-tab-files
- takeScreenshot: chat-shared-files
- tapOn:
    id: shared-tab-voice
- takeScreenshot: chat-shared-voice
- tapOn:
    id: shared-tab-links
- takeScreenshot: chat-shared-links
- tapOn:
    id: shared-back
- tapOn:
    id: chat-info-links
- extendedWaitUntil:
    visible:
      id: shared-links
    timeout: 10000
- tapOn:
    id: shared-back

# A group owner sees members with actions and the add button.
- scrollUntilVisible:
    element:
      id: chat-member-0
    direction: DOWN
- assertVisible:
    id: chat-info-add-members
- tapOn:
    id: chat-member-0
- extendedWaitUntil:
    visible:
      id: member-actions
    timeout: 5000
- takeScreenshot: member-actions
- tapOn:
    point: 50%,8%
- tapOn:
    id: chat-info-add-members
- extendedWaitUntil:
    visible:
      id: add-members
    timeout: 5000
- takeScreenshot: add-members
- tapOn:
    id: add-members-back

# Edit screen of an owner.
- scrollUntilVisible:
    element:
      id: chat-info-edit
    direction: UP
- tapOn:
    id: chat-info-edit
- extendedWaitUntil:
    visible:
      id: edit-chat
    timeout: 5000
- takeScreenshot: edit-chat
- tapOn:
    id: edit-chat-back

# Search inside the chat: back from the screens above the list scrolled
# down, the search button is near the top
# (Maestro counts it as visible under the header, so swipe to the top.)
- swipe:
    start: 50%, 35%
    end: 50%, 90%
    duration: 300
- swipe:
    start: 50%, 35%
    end: 50%, 90%
    duration: 300
- waitForAnimationToEnd:
    timeout: 2000
- tapOn:
    id: chat-info-search
- extendedWaitUntil:
    visible:
      id: search-input
    timeout: 5000
- takeScreenshot: chat-search
