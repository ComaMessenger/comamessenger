# Shared start for flows that reuse the signed-in state of sign-in.yaml.
# Release builds start by themselves; a development build is pointed at
# Metro first: maestro test -e DEV_CLIENT=true e2e/<flow>.yaml
appId: com.comamessenger.app
---
- runScript: scripts/launch-env.js
- launchApp:
    stopApp: true
- runFlow:
    when:
      true: ${output.launch.dev}
    commands:
      # A link sent while the launcher is still starting (Android, after a
      # state reset) is dropped; wait for the launcher first.
      - extendedWaitUntil:
          visible: .*(Development Build|DEVELOPMENT SERVERS).*
          timeout: 20000
          optional: true
      - openLink: exp+coma://expo-development-client/?url=${output.launch.metro}
      - extendedWaitUntil:
          notVisible: .*DEVELOPMENT SERVERS.*
          timeout: 20000
          optional: true
- runFlow:
    when:
      visible: Continue
    commands:
      - tapOn: Continue
- runFlow:
    when:
      visible: Reload
    commands:
      - tapOn:
          point: 91%,47%
- extendedWaitUntil:
    visible:
      id: chat-list
    timeout: 60000
