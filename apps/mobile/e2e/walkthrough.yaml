# Acceptance pass over the messenger screens of phase 6.1 on a seeded
# instance (see sign-in.yaml): the «Backend» chat with thread captions, a
# reply quote, reactions and a photo; thread, forward, views and reactions,
# a new folder and «Important» with chat filters. Screenshots are named
# after THEME so light and dark runs sit side by side:
#   xcrun simctl ui booted appearance dark
#   maestro test -e THEME=dark e2e/walkthrough.yaml
# THEME has no default here: a flow default would override -e.
appId: com.comamessenger.app
env:
  PHOTO: IMG_0005.jpg
---
- runFlow: open-app.yaml
- tapOn: .*Backend.*
- extendedWaitUntil:
    visible:
      id: conversation
    timeout: 10000
# The thread caption: avatars of those who replied, «N ответ», time.
- extendedWaitUntil:
    visible:
      id: thread-caption
    timeout: 10000
- assertVisible: .*👍.*
- takeScreenshot: ${THEME}-01-backend-threads-reactions
- runFlow:
    file: message-menu.yaml
    env:
      TEXT: ".*Тред 119147.*"
- tapOn:
    id: message-action-thread
- extendedWaitUntil:
    visible:
      id: thread-root
    timeout: 10000
- takeScreenshot: ${THEME}-02-thread
- tapOn:
    id: conversation-back
    retryTapIfNoChange: true
- extendedWaitUntil:
    notVisible:
      id: thread-root
    timeout: 10000
# Forward and «views and reactions» from the long-press menu.
- runFlow:
    file: message-menu.yaml
    env:
      TEXT: ".*Тред 119147.*"
- takeScreenshot: ${THEME}-03-message-menu
- tapOn:
    id: message-action-forward
- extendedWaitUntil:
    visible:
      id: forward-sheet
    timeout: 10000
- takeScreenshot: ${THEME}-04-forward
- tapOn: Закрыть
- runFlow:
    file: message-menu.yaml
    env:
      TEXT: ".*Тред 119147.*"
- tapOn:
    id: message-action-details
- extendedWaitUntil:
    visible:
      id: message-details
    timeout: 10000
- takeScreenshot: ${THEME}-05-views-and-reactions
- tapOn: Закрыть
# The photo opens full screen once its bytes are loaded.
- scrollUntilVisible:
    element: .*${PHOTO}.*
    direction: UP
    timeout: 20000
- tapOn: .*${PHOTO}.*
- extendedWaitUntil:
    visible:
      id: photo-viewer
    timeout: 10000
# Give the full-size image time to load before the screenshot.
- extendedWaitUntil:
    visible:
      id: photo-viewer-loaded
    timeout: 20000
- takeScreenshot: ${THEME}-06-photo
- tapOn: Закрыть
# A reply quotes the message it answers.
- scrollUntilVisible:
    element: .*, Тест, .*
    direction: UP
    timeout: 20000
- takeScreenshot: ${THEME}-07-reply-quote
- tapOn:
    id: conversation-back
    retryTapIfNoChange: true
# The sheet of a new folder.
# «+» closes the row of folder tabs, often past the screen edge.
- repeat:
    while:
      notVisible:
        id: new-folder
    times: 4
    commands:
      - swipe:
          from:
            id: chat-tabs
          direction: LEFT
- tapOn:
    id: new-folder
- extendedWaitUntil:
    visible:
      id: folder-sheet
    timeout: 5000
- takeScreenshot: ${THEME}-08-new-folder
# iOS may show its one-time «Quickly Change Keyboards» tip over the sheet.
- runFlow:
    when:
      visible: Continue
    commands:
      - tapOn: Continue
# The sheet has no swipe-to-close; the dimmed area above it closes it.
- hideKeyboard
- tapOn:
    point: 50%,12%
- extendedWaitUntil:
    notVisible:
      id: folder-sheet
    timeout: 5000
# «Important»: the reader's saves with chat filters from the server.
- runFlow:
    file: tabs.yaml
    env:
      TAB: important
- extendedWaitUntil:
    visible:
      id: important-list
    timeout: 15000
- extendedWaitUntil:
    visible:
      id: important-tab-all
    timeout: 15000
- takeScreenshot: ${THEME}-09-important
- runFlow:
    file: tabs.yaml
    env:
      TAB: chats
