# Voice messages: playback, speed and autoplay of the next one; the
# microphone in the empty composer and the «hold to record» hint.
# A simulator cannot record, so the two messages come from the seed script:
#   node e2e/seed-voice.mjs   (COMA_API, COMA_EMAIL, COMA_PASSWORD)
# Run after sign-in.yaml: maestro test e2e/voice.yaml
appId: com.comamessenger.app
---
- runFlow: open-app.yaml
- tapOn:
    id: chat-row-0
- extendedWaitUntil:
    visible:
      id: voice-message
    timeout: 15000
- takeScreenshot: voice-bubble
# The last two messages are the seeded voice messages; start the first one.
- tapOn:
    id: voice-play
    index: -2
# While listening the speed appears; it cycles 1× → 1.5× → 2×.
- extendedWaitUntil:
    visible:
      id: voice-speed
    timeout: 15000
- takeScreenshot: voice-playing
- tapOn:
    id: voice-speed
    # The playing waveform never settles; on Android Maestro would wait
    # out the whole message before the next step.
    waitToSettleTimeoutMs: 500
- assertVisible: .*1[,.]5×.*
- tapOn:
    id: voice-speed
    # The playing waveform never settles; on Android Maestro would wait
    # out the whole message before the next step.
    waitToSettleTimeoutMs: 500
- assertVisible: .*2×.*
# At 2× the first (13.8 s) ends in a few seconds and the next one starts on
# its own: the play button of the last voice message turns into «Pause».
- extendedWaitUntil:
    visible:
      id: voice-play
      text: (Пауза|Pause)
      below:
        id: voice-play
        index: -2
    timeout: 20000
- takeScreenshot: voice-autoplay
# Pause what plays (the speed chip stays while paused).
- tapOn:
    text: (Пауза|Pause)
    waitToSettleTimeoutMs: 500
- assertVisible:
    id: voice-speed
# A drag to the left along the waveform rewinds to the start; the row's
# swipe to reply (also to the left) must not take it.
# The position is read in the bubble's label (one accessible element).
- swipe:
    from:
      id: voice-seek
      index: -1
    direction: LEFT
    duration: 600
- extendedWaitUntil:
    visible: .*Позиция в записи, 0:00.*
    timeout: 5000
- assertNotVisible: Отменить ответ
- takeScreenshot: voice-rewound
# Empty composer: the microphone instead of the send button.
- assertVisible:
    id: composer-mic
- assertNotVisible:
    id: composer-send
# A tap is too short to record: the hint asks to hold. On a fresh install the
# system asks for the microphone first; allow it and tap again.
# One tap only: a second one counts as a double tap, which starts
# hands-free recording (Maestro repeats a tap it thinks changed nothing).
# The hint lasts 2.2 s, so it is awaited at once; on a fresh install the
# system asks for the microphone first (allowing it shows the hint too).
- tapOn:
    id: composer-mic
    retryTapIfNoChange: false
- extendedWaitUntil:
    visible: (Удерживайте для записи|Hold to record|Allow|Разрешить|OK|.*записывать аудио.*|.*record audio.*)
    timeout: 5000
- takeScreenshot: voice-hold-hint
- runFlow:
    when:
      visible: (Allow|Разрешить|OK|.*записывать аудио.*|.*record audio.*)
    commands:
      - runFlow: allow-permission.yaml
      - extendedWaitUntil:
          visible: (Удерживайте для записи|Hold to record)
          timeout: 5000
# Typing brings the send button back (once the keyboard is up).
- tapOn:
    id: composer-input
- waitForAnimationToEnd
- inputText: x
- extendedWaitUntil:
    visible:
      id: composer-send
    timeout: 5000
- assertNotVisible:
    id: composer-mic
- eraseText: 1
