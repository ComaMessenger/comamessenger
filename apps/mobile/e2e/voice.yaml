# Voice messages: playback, speed and autoplay of the next one; the
# microphone in the empty composer and the «hold to record» hint.
# A simulator cannot record, so the two messages come from the seed script:
#   node e2e/seed-voice.mjs   (COMA_API, COMA_EMAIL, COMA_PASSWORD)
# Run after sign-in.yaml: maestro test e2e/voice.yaml
appId: com.comamessenger.app
---
- runFlow: open-app.yaml
- tapOn:
    id: chat-row-0
- extendedWaitUntil:
    visible:
      id: voice-message
    timeout: 15000
- takeScreenshot: voice-bubble
# The last two messages are the seeded voice messages; start the first one.
- tapOn:
    id: voice-play
    index: -2
# While listening the speed appears; it cycles 1× → 1.5× → 2×.
- extendedWaitUntil:
    visible:
      id: voice-speed
    timeout: 15000
- takeScreenshot: voice-playing
- tapOn:
    id: voice-speed
- assertVisible: .*1[,.]5×.*
- tapOn:
    id: voice-speed
- assertVisible: .*2×.*
# 1.4 s at 2×: the first ends and the next one starts on its own.
- waitForAnimationToEnd:
    timeout: 3000
- takeScreenshot: voice-autoplay
# Pause what plays (the speed chip stays while paused).
- runFlow:
    when:
      visible: (Пауза|Pause)
    commands:
      - tapOn: (Пауза|Pause)
# Empty composer: the microphone instead of the send button.
- assertVisible:
    id: composer-mic
- assertNotVisible:
    id: composer-send
# A tap is too short to record: the hint asks to hold. On a fresh install the
# system asks for the microphone first; allow it and tap again.
- tapOn:
    id: composer-mic
- runFlow:
    when:
      visible: (Allow|Разрешить|OK)
    commands:
      - tapOn: (Allow|Разрешить|OK)
      - tapOn:
          id: composer-mic
- extendedWaitUntil:
    visible: (Удерживайте для записи|Hold to record)
    timeout: 5000
- takeScreenshot: voice-hold-hint
# Typing brings the send button back.
- tapOn:
    id: composer-input
- inputText: x
- assertVisible:
    id: composer-send
- assertNotVisible:
    id: composer-mic
- eraseText: 1
