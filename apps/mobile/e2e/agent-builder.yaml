# The agent builder step by step: a custom draft, the six steps, a launch
# rule, the check panel, the publish, the steps list and advanced settings.
# Run after sign-in.yaml: maestro test -e THEME=light e2e/agent-builder.yaml
# The workspace needs a model connection and a chat named CHAT.
appId: com.comamessenger.app
env:
  CHAT: Backend
---
- runScript: scripts/login.js
# Follow the simulator appearance (light or dark); restored at the end.
- runScript: scripts/reset-preferences.js
- runScript: scripts/delete-e2e-agents.js
- runFlow: open-app.yaml
- runFlow:
    file: agent-link.yaml
    env:
      LINK: coma://agents/new
- extendedWaitUntil:
    visible:
      id: agent-create-screen
    timeout: 10000
- takeScreenshot: agent-create-${THEME}
- tapOn:
    id: agent-create-manual
- extendedWaitUntil:
    visible:
      id: agent-new-screen
    timeout: 10000
- tapOn:
    id: agent-create-name
- inputText: E2E Помощник
- tapOn:
    id: agent-create-chat
- tapOn: Название чата
- inputText: ${CHAT}
- tapOn:
    id: agent-chat-picker-${CHAT}
- takeScreenshot: agent-new-custom-${THEME}
- tapOn:
    id: agent-create-submit

# 1. Role
- extendedWaitUntil:
    visible:
      id: agent-step-role
    timeout: 15000
- tapOn:
    id: agent-task
- inputText: Отвечай на вопросы о расписании зала и коротко подводи итог дня.
- tapOn: Кто он
- tapOn:
    id: agent-tone-friendly
- extendedWaitUntil:
    visible: Сохранено
    timeout: 10000
- takeScreenshot: agent-step-role-${THEME}
- tapOn:
    id: agent-step-next

# 2. Places
- extendedWaitUntil:
    visible:
      id: agent-step-places
    timeout: 5000
- assertVisible:
    id: agent-place-${CHAT}
- takeScreenshot: agent-step-places-${THEME}
- tapOn:
    id: agent-place-add
- extendedWaitUntil:
    visible:
      id: agent-chat-picker
    timeout: 5000
- takeScreenshot: agent-step-places-picker-${THEME}
- tapOn:
    point: 50%,9%
- tapOn:
    id: agent-step-next

# 3. Knowledge
- extendedWaitUntil:
    visible:
      id: agent-step-knowledge
    timeout: 5000
- tapOn:
    id: agent-source-search
- takeScreenshot: agent-step-knowledge-${THEME}
- tapOn:
    id: agent-step-next

# 4. Skills
- extendedWaitUntil:
    visible:
      id: agent-step-skills
    timeout: 5000
- assertVisible:
    id: agent-mode-direct
- tapOn:
    id: agent-mode-post-confirm
- takeScreenshot: agent-step-skills-${THEME}
- tapOn:
    id: agent-step-next

# 5. Triggers: a schedule rule on its own screen
- extendedWaitUntil:
    visible:
      id: agent-step-triggers
    timeout: 5000
- tapOn:
    id: agent-rule-add
- tapOn:
    id: agent-rule-type-schedule
- extendedWaitUntil:
    visible:
      id: agent-rule-screen
    timeout: 5000
- tapOn: По будням
- takeScreenshot: agent-rule-schedule-${THEME}
- tapOn:
    id: agent-rule-save
- extendedWaitUntil:
    visible:
      id: agent-rule-schedule
    timeout: 10000
- takeScreenshot: agent-step-triggers-${THEME}
- tapOn:
    id: agent-step-next

# 6. Review: model, consent, blockers, check and publish
- extendedWaitUntil:
    visible:
      id: agent-step-review
    timeout: 5000
- takeScreenshot: agent-step-review-blocked-${THEME}
- tapOn:
    id: agent-data-consent
- extendedWaitUntil:
    visible: Сохранено
    timeout: 10000
- scrollUntilVisible:
    element:
      id: agent-check-example-0
    direction: DOWN
- takeScreenshot: agent-step-review-check-${THEME}
- tapOn:
    id: agent-publish
- extendedWaitUntil:
    visible: Версия опубликована
    timeout: 15000
- takeScreenshot: agent-step-review-published-${THEME}

# Steps list and advanced settings of the published agent
- tapOn:
    id: agent-step-close
- extendedWaitUntil:
    visible:
      id: agent-builder-hub
    timeout: 5000
- takeScreenshot: agent-builder-hub-${THEME}
- scrollUntilVisible:
    element:
      id: agent-hub-advanced
    direction: DOWN
- tapOn:
    id: agent-hub-advanced
- extendedWaitUntil:
    visible:
      id: agent-advanced-screen
    timeout: 5000
- takeScreenshot: agent-advanced-${THEME}
- runScript: scripts/restore-preferences.js
