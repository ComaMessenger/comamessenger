# Opens the long-press menu of a message found by TEXT (a regex over the
# accessible label of the bubble). Scrolling up brings the bubble in from
# the top, away from the composer, where a long press lands in the text
# field. (centerElement keeps scrolling past a bubble already in view.)
appId: com.comamessenger.app
---
- runFlow:
    when:
      visible: Continue
    commands:
      - tapOn: Continue
- hideKeyboard:
    optional: true
# A bubble that grew (a reaction, a thread caption) can sit under the
# composer until the feed is brought to the end (see docs/backlog.md).
- runFlow:
    when:
      visible: К последнему сообщению
    commands:
      - tapOn: К последнему сообщению
      - waitForAnimationToEnd
- scrollUntilVisible:
    element: ${TEXT}
    direction: UP
    timeout: 30000
# It comes in at the top edge: bring it nearer the middle and let the
# feed stop, or the long press only stops the scroll.
- swipe:
    start: 50%, 45%
    end: 50%, 60%
    duration: 600
- waitForAnimationToEnd:
    timeout: 2000
- longPressOn: ${TEXT}
- extendedWaitUntil:
    visible:
      id: message-menu
    timeout: 5000
