# Opens the long-press menu of a message found by TEXT (a regex over the
# accessible label of the bubble). The keyboard is put away first: with it
# open the feed is short and a long press can land in the text field.
appId: com.comamessenger.app
---
- runFlow:
    when:
      visible: Continue
    commands:
      - tapOn: Continue
- runFlow: hide-keyboard.yaml
# iOS: a drag that runs into the keyboard closes it interactively. On
# Android the same drag only scrolls the feed back in time, so there the
# feed is brought down to the message if it went past it.
- runFlow:
    when:
      platform: iOS
    commands:
      - swipe:
          start: 50%, 35%
          end: 50%, 92%
          duration: 700
- runFlow:
    when:
      platform: Android
    commands:
      - scrollUntilVisible:
          element: ${TEXT}
          direction: DOWN
          timeout: 8000
          speed: 60
          optional: true
- waitForAnimationToEnd:
    timeout: 2000
# A bubble that grew (a reaction, a thread caption) can sit under the
# composer until the feed is brought to the end (see docs/backlog.md).
- runFlow:
    when:
      visible: К последнему сообщению
    commands:
      - tapOn: К последнему сообщению
      - waitForAnimationToEnd
# No centring: a bubble near the end of the feed cannot be centred and the
# scroll would run until the timeout.
- scrollUntilVisible:
    element: ${TEXT}
    direction: UP
    timeout: 60000
    speed: 80
# Let the feed stop, or the long press only stops the scroll.
- waitForAnimationToEnd:
    timeout: 2000
- longPressOn: ${TEXT}
- extendedWaitUntil:
    visible:
      id: message-menu
    timeout: 5000
