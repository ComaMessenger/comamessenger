# Package I of phase 6.1: the people directory from «Ещё», a person's card
# and «Написать».
# Run after sign-in.yaml (reuses its session): maestro test e2e/people.yaml
appId: com.comamessenger.app
---
- runFlow: open-app.yaml
- tapOn:
    id: tab-more
- tapOn:
    id: open-people
- extendedWaitUntil:
    visible:
      id: person-row-0
    timeout: 15000
- takeScreenshot: people
# Without departments the chips filter by kind; with the org structure
# (phase 6.5 wave 2) the chips are departments and the kinds are in the
# header menu.
- runFlow:
    when:
      visible:
        id: people-filter-online
    commands:
      # «На месте» and «Отсутствуют» (phase 6.7) push the kinds to the right.
      - swipe:
          from:
            id: people-filter-online
          direction: LEFT
          duration: 500
      - tapOn:
          id: people-filter-agents
      - takeScreenshot: people-agents
      # Back to the start of the chips row.
      - swipe:
          start: 15%, 21%
          end: 95%, 21%
          duration: 400
      - waitForAnimationToEnd
      - tapOn:
          id: people-filter-all
- runFlow:
    when:
      visible:
        id: people-menu
    commands:
      - tapOn:
          id: people-menu
      - tapOn:
          id: people-view-agents
      - takeScreenshot: people-agents
      - tapOn:
          id: people-menu
      - tapOn:
          id: people-view-all
- tapOn:
    id: person-row-0
- extendedWaitUntil:
    visible:
      id: person
    timeout: 10000
- takeScreenshot: person
- tapOn:
    id: person-write
- extendedWaitUntil:
    visible:
      id: conversation
    timeout: 15000
- takeScreenshot: person-direct-chat
