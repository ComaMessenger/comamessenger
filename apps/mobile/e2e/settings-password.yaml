# Password change on the phone, on a throwaway account (never the owner's):
# the administrator's «require a new password» screen, then «Сменить пароль»
# in Settings. Signs the test account out; ends by signing the owner back in
# (sign-in.yaml). Run last: maestro test -e THEME=light e2e/settings-password.yaml
appId: com.comamessenger.app
---
- runScript: scripts/login.js
- runScript: scripts/create-member.js
- runScript: scripts/require-password.js
- evalScript: ${output.firstPassword = output.memberPassword + "-a"}
- evalScript: ${output.secondPassword = output.memberPassword + "-b"}
- launchApp:
    clearState: true
    clearKeychain: true
- extendedWaitUntil:
    visible: .*(Подключение|Вход).*
    timeout: 60000
- runFlow:
    when:
      visible:
        id: server-address
    commands:
      - tapOn:
          id: server-address
      - inputText: http://localhost:8080
      - tapOn:
          id: server-continue
- extendedWaitUntil:
    visible:
      id: login-email
    timeout: 15000
- tapOn:
    id: login-email
- inputText: ${output.memberEmail}
- tapOn:
    id: login-password-reveal
- tapOn:
    id: login-password
- inputText: ${output.memberPassword}
- tapOn:
    id: login-submit
- runFlow:
    when:
      visible: (Не сейчас|Not Now)
    commands:
      - tapOn: (Не сейчас|Not Now)

# 1. The administrator asked for a new password: only this form opens.
- extendedWaitUntil:
    visible: Смените пароль
    timeout: 15000
- takeScreenshot: settings-password-required-${THEME}
# Secure fields drop characters on the simulator: reveal them first, then
# fill them in order with the keyboard's «Next» and send with «Done».
- tapOn:
    id: password-current-reveal
- tapOn:
    id: password-new-reveal
- tapOn:
    id: password-confirm-reveal
- tapOn:
    id: password-current
- inputText: ${output.memberPassword}
- pressKey: Enter
- inputText: ${output.firstPassword}
- pressKey: Enter
- inputText: ${output.firstPassword}
- pressKey: Enter
- runFlow:
    when:
      visible: (Не сейчас|Not Now)
    commands:
      - tapOn: (Не сейчас|Not Now)
- extendedWaitUntil:
    visible:
      id: chat-list
    timeout: 15000

# 2. «Сменить пароль» in Settings; this device stays signed in.
- runFlow:
    file: tabs.yaml
    env:
      TAB: more
- tapOn:
    id: open-settings
- tapOn:
    id: settings-password
# Secure fields drop characters on the simulator: reveal them first, then
# fill them in order with the keyboard's «Next» and send with «Done».
- tapOn:
    id: password-current-reveal
- tapOn:
    id: password-new-reveal
- tapOn:
    id: password-confirm-reveal
- tapOn:
    id: password-current
- inputText: ${output.firstPassword}
- pressKey: Enter
- inputText: ${output.secondPassword}
- pressKey: Enter
- inputText: ${output.secondPassword}
- pressKey: Enter
- runFlow:
    when:
      visible: (Не сейчас|Not Now)
    commands:
      - tapOn: (Не сейчас|Not Now)
- extendedWaitUntil:
    visible: Пароль изменён.*
    timeout: 15000
- takeScreenshot: settings-password-changed-${THEME}
- tapOn: Назад
- assertVisible:
    id: settings-home

- runScript: scripts/deactivate-member.js
- runFlow:
    file: sign-in.yaml
