# Bottom tabs. Maestro does not find the tab bar by text or id on iOS 26,
# so they are tapped by position: Чаты, Треды, Важные, Агенты, Ещё.
# Pass the tab: runFlow: { file: tabs.yaml, env: { TAB: important } }.
appId: com.comamessenger.app
---
- runFlow:
    when:
      true: ${TAB == 'chats'}
    commands:
      - tapOn:
          point: 10%,94%
- runFlow:
    when:
      true: ${TAB == 'threads'}
    commands:
      - tapOn:
          point: 30%,94%
- runFlow:
    when:
      true: ${TAB == 'important'}
    commands:
      - tapOn:
          point: 50%,94%
- runFlow:
    when:
      true: ${TAB == 'agents'}
    commands:
      - tapOn:
          point: 70%,94%
- runFlow:
    when:
      true: ${TAB == 'more'}
    commands:
      - tapOn:
          point: 90%,94%
