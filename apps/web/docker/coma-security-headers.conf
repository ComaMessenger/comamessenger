# Included in every location: nginx drops server-level add_header directives
# in a location that declares its own.
add_header Content-Security-Policy $coma_csp always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header X-Frame-Options "DENY" always;
