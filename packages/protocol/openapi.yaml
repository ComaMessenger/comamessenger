        username: { type: string }
        password: { type: [string, "null"] }
        from_address: { type: string }
        from_name: { type: string }
        security: { type: string, enum: [none, starttls, tls] }
        clear_credentials: { type: boolean }
    UpdateInfrastructureSettingsRequest:
      type: object
