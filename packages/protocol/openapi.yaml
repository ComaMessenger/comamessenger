openapi: 3.1.0
info:
  title: ComaMessenger API
  version: 0.2.0
servers:
  - url: http://localhost:8080
paths:
  /healthz:
    get:
      operationId: getHealth
      responses:
        "200":
          description: Process is alive.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"
  /readyz:
    get:
      operationId: getReadiness
      responses:
        "200":
          description: Process is ready to serve traffic.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"
        "503":
          description: A required dependency is unavailable.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/v1/bootstrap/status:
    get:
      operationId: getBootstrapStatus
      responses:
        "200":
          description: Current bootstrap state.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BootstrapStatus" }
  /api/v1/bootstrap:
    post:
      operationId: bootstrap
      parameters:
        - name: X-Coma-Bootstrap-Token
          in: header
          required: false
          description: Required outside development; configure it with BOOTSTRAP_TOKEN.
          schema: { type: string, minLength: 32 }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/BootstrapRequest" }
      responses:
        "201": { $ref: "#/components/responses/Tokens" }
        "403": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
  /api/v1/auth/login:
    post:
      operationId: login
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LoginRequest" }
      responses:
        "200": { $ref: "#/components/responses/Tokens" }
        "401": { $ref: "#/components/responses/Error" }
  /api/v1/auth/refresh:
    post:
      operationId: refresh
      responses:
        "200": { $ref: "#/components/responses/Tokens" }
        "401": { $ref: "#/components/responses/Error" }
  /api/v1/auth/password/forgot:
    post:
      operationId: forgotPassword
      description: Always returns 202 so account existence cannot be enumerated.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ForgotPasswordRequest" }
      responses:
        "202": { description: Recovery request accepted. }
        "400": { $ref: "#/components/responses/Error" }
  /api/v1/auth/password/reset:
    post:
      operationId: resetPassword
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ResetPasswordRequest" }
      responses:
        "204": { description: Password reset and all sessions revoked. }
        "400": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
  /api/v1/auth/logout:
    post:
      operationId: logout
      security: [{ bearerAuth: [] }]
      responses:
        "204": { description: Session revoked. }
        "401": { $ref: "#/components/responses/Error" }
  /api/v1/ws:
    get:
      operationId: connectRealtime
      description: Upgrade to the version 1 WebSocket protocol. Authentication is sent in the first WebSocket frame.
      responses:
        "101": { description: WebSocket connection established. }
        "403": { $ref: "#/components/responses/Error" }
        "426": { description: WebSocket upgrade is required. }
  /api/v1/me:
    get:
      operationId: getMe
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: Current user.
          content:
            {
              application/json:
                { schema: { $ref: "#/components/schemas/User" } },
            }
        "401": { $ref: "#/components/responses/Error" }
    patch:
      operationId: updateMe
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          {
            application/json:
              { schema: { $ref: "#/components/schemas/UpdateProfileRequest" } },
          }
      responses:
        "200":
          description: Updated user.
          content:
            {
              application/json:
                { schema: { $ref: "#/components/schemas/User" } },
            }
        "422": { $ref: "#/components/responses/Error" }
  /api/v1/me/avatar:
    put:
      operationId: putMyAvatar
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          image/png: { schema: { type: string, format: binary } }
          image/jpeg: { schema: { type: string, format: binary } }
          image/webp: { schema: { type: string, format: binary } }
      responses:
        "200":
          description: Avatar replaced.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AvatarUpdate" }
        "422": { $ref: "#/components/responses/Error" }
        "507": { $ref: "#/components/responses/Error" }
    delete:
      operationId: deleteMyAvatar
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: Avatar removed.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AvatarUpdate" }
        "404": { $ref: "#/components/responses/Error" }
  /api/v1/me/password:
    post:
      operationId: changePassword
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ChangePasswordRequest" }
      responses:
        "204":
          { description: Password changed and other sessions revoked. }
        "403": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
  /api/v1/me/status:
    put:
      operationId: setStatus
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SetStatusRequest" }
      responses:
        "200":
          description: Updated custom status.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CustomStatus" }
        "422": { $ref: "#/components/responses/Error" }
    delete:
      operationId: clearStatus
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: Cleared custom status.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CustomStatus" }
  /api/v1/me/email/change:
    post:
      operationId: changeEmail
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ChangeEmailRequest" }
      responses:
        "200":
          description: Email changed or confirmation requested.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EmailChangeResponse" }
        "403": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
  /api/v1/me/email/confirm:
    post:
      operationId: confirmEmail
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ConfirmEmailRequest" }
      responses:
        "200":
          description: Confirmed user email.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/User" }
        "409": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
  /api/v1/sessions:
    get:
      operationId: listSessions
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: User sessions.
          content:
            application/json:
              schema:
                type: object
                required: [sessions]
                properties:
                  sessions:
                    {
                      type: array,
                      items: { $ref: "#/components/schemas/Session" },
                    }
  /api/v1/sessions/{session_id}:
    delete:
      operationId: revokeSession
      security: [{ bearerAuth: [] }]
      parameters:
        - {
            name: session_id,
            in: path,
            required: true,
            schema: { type: string, format: uuid },
          }
      responses:
        "204": { description: Session revoked. }
        "404": { $ref: "#/components/responses/Error" }
  /api/v1/sessions/revoke-others:
    post:
      operationId: revokeOtherSessions
      security: [{ bearerAuth: [] }]
      responses:
        "204":
          { description: Every session except the current one was revoked. }
  /api/v1/branding:
    get:
      operationId: getPublicBranding
      responses:
        "200":
          description: Public workspace branding used before authentication.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PublicBranding" }
  /api/v1/branding/{kind}:
    get:
      operationId: getBrandingAsset
      parameters:
        - name: kind
          in: path
          required: true
          schema: { type: string, enum: [logo, favicon] }
      responses:
        "200":
          description: A workspace branding image.
          content:
            image/png: { schema: { type: string, format: binary } }
            image/jpeg: { schema: { type: string, format: binary } }
            image/webp: { schema: { type: string, format: binary } }
            image/x-icon: { schema: { type: string, format: binary } }
        "404": { $ref: "#/components/responses/Error" }
  /api/v1/organization:
    get:
      operationId: getOrganizationSettings
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: Workspace settings visible to a member.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OrganizationSettings" }
    patch:
      operationId: updateOrganizationSettings
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              { $ref: "#/components/schemas/UpdateOrganizationSettingsRequest" }
      responses:
        "200":
          description: Updated workspace settings.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OrganizationSettings" }
        "403": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
  /api/v1/organization/branding/{kind}:
    put:
      operationId: putBrandingAsset
      security: [{ bearerAuth: [] }]
      parameters:
        - name: kind
          in: path
          required: true
          schema: { type: string, enum: [logo, favicon] }
      requestBody:
        required: true
        content:
          image/png:
            { schema: { type: string, format: binary, maxLength: 524288 } }
          image/jpeg:
            { schema: { type: string, format: binary, maxLength: 524288 } }
          image/webp:
            { schema: { type: string, format: binary, maxLength: 524288 } }
          image/x-icon:
            { schema: { type: string, format: binary, maxLength: 524288 } }
      responses:
        "204": { description: Branding image saved. }
        "403": { $ref: "#/components/responses/Error" }
        "413": { $ref: "#/components/responses/Error" }
        "415": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
    delete:
      operationId: deleteBrandingAsset
      security: [{ bearerAuth: [] }]
      parameters:
        - name: kind
          in: path
          required: true
          schema: { type: string, enum: [logo, favicon] }
      responses:
        "204": { description: Branding image removed. }
        "403": { $ref: "#/components/responses/Error" }
  /api/v1/organization/infrastructure:
    get:
      operationId: getInfrastructureSettings
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: Masked S3 and SMTP configuration.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/InfrastructureSettings" }
        "403": { $ref: "#/components/responses/Error" }
    patch:
      operationId: updateInfrastructureSettings
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              {
                $ref: "#/components/schemas/UpdateInfrastructureSettingsRequest",
              }
      responses:
        "200":
          description: Updated masked infrastructure configuration.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/InfrastructureSettings" }
        "403": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
  /api/v1/organization/infrastructure/test:
    post:
      operationId: testInfrastructureConnection
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ConnectionTestRequest" }
      responses:
        "200":
          description: Server-side connection test result.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ConnectionTestResult" }
        "403": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
  /api/v1/organization/members:
    get:
      operationId: listOrganizationMembers
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: Workspace members and access state.
          content:
            application/json:
              schema:
                type: object
                required: [members]
                properties:
                  members:
                    type: array
                    items: { $ref: "#/components/schemas/OrganizationMember" }
        "403": { $ref: "#/components/responses/Error" }
  /api/v1/organization/members/{actor_id}:
    patch:
      operationId: updateOrganizationMember
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: "#/components/parameters/ActorId" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              { $ref: "#/components/schemas/UpdateOrganizationMemberRequest" }
      responses:
        "200":
          description: Updated workspace member.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OrganizationMember" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
  /api/v1/organization/members/{actor_id}/avatar:
    put:
      operationId: putOrganizationMemberAvatar
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: "#/components/parameters/ActorId" }]
      requestBody:
        required: true
        content:
          image/png: { schema: { type: string, format: binary } }
          image/jpeg: { schema: { type: string, format: binary } }
          image/webp: { schema: { type: string, format: binary } }
      responses:
        "200":
          description: Member avatar replaced.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AvatarUpdate" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
        "507": { $ref: "#/components/responses/Error" }
    delete:
      operationId: deleteOrganizationMemberAvatar
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: "#/components/parameters/ActorId" }]
      responses:
        "200":
          description: Member avatar removed.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AvatarUpdate" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
  /api/v1/organization/members/{actor_id}/require-password-change:
    post:
      operationId: requireMemberPasswordChange
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: "#/components/parameters/ActorId" }]
      responses:
        "204":
          { description: Password change required and all sessions revoked. }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
  /api/v1/organization/members/{actor_id}/password-reset:
    post:
      operationId: issueMemberPasswordReset
      description: Sends a one-use reset link to the member. The caller never receives the token.
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: "#/components/parameters/ActorId" }]
      responses:
        "202": { description: Password reset email accepted for delivery. }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }
  /api/v1/organization/transfer-ownership:
    post:
      operationId: transferOrganizationOwnership
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TransferOwnershipRequest" }
      responses:
        "200":
          description: The authenticated previous owner, now an administrator with full explicit permissions.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/User" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
  /api/v1/organization/audit:
    get:
      operationId: listOrganizationAudit
      security: [{ bearerAuth: [] }]
      parameters:
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 50 }
        - name: category
          in: query
          schema: { type: string, enum: [organization, members, invitations, security, chats, infrastructure] }
        - name: actor_id
          in: query
          schema: { type: string, format: uuid }
        - name: from
          in: query
          schema: { type: string, format: date-time }
        - name: to
          in: query
          schema: { type: string, format: date-time }
        - name: after_id
          in: query
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Most recent administrative audit events.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AuditPage" }
        "403": { $ref: "#/components/responses/Error" }
  /api/v1/invitations:
    get:
      operationId: listInvitations
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: Pending and expired invitations visible to invitation managers.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/InvitationSummary" }
        "403": { $ref: "#/components/responses/Error" }
    post:
      operationId: createInvitation
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          {
            application/json:
              {
                schema:
                  { $ref: "#/components/schemas/CreateInvitationRequest" },
              },
          }
      responses:
        "201":
          description: Invitation created.
          content:
            {
              application/json:
                { schema: { $ref: "#/components/schemas/Invitation" } },
            }
        "403": { $ref: "#/components/responses/Error" }
  /api/v1/invitations/{invitation_id}:
    delete:
      operationId: revokeInvitation
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: invitation_id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "204": { description: Invitation revoked. }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
  /api/v1/invitations/{invitation_id}/rotate:
    post:
      operationId: rotateInvitation
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: invitation_id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "201":
          description: Previous token revoked and replacement invitation created.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Invitation" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
  /api/v1/invitations/{token}/accept:
    post:
      operationId: acceptInvitation
      parameters:
        - { name: token, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          {
            application/json:
              {
                schema:
                  { $ref: "#/components/schemas/AcceptInvitationRequest" },
              },
          }
      responses:
        "201": { $ref: "#/components/responses/Tokens" }
        "410": { $ref: "#/components/responses/Error" }
  /api/v1/chats:
    get:
      operationId: listChats
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: Chats visible through membership.
          content:
            application/json:
              schema:
                type: object
                required: [chats]
                properties:
                  chats:
                    {
                      type: array,
                      items: { $ref: "#/components/schemas/Chat" },
                    }
    post:
      operationId: createChat
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          {
            application/json:
              { schema: { $ref: "#/components/schemas/CreateChatRequest" } },
          }
      responses:
        "201":
          description: Created or existing direct chat.
          content:
            {
              application/json:
                { schema: { $ref: "#/components/schemas/Chat" } },
            }
        "403": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
  /api/v1/actors:
    get:
      operationId: listActors
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: q, in: query, schema: { type: string, maxLength: 120 } }
        - { name: after_id, in: query, schema: { type: string, format: uuid } }
        - {
            name: limit,
            in: query,
            schema: { type: integer, minimum: 1, maximum: 100, default: 30 },
          }
      responses:
        "200":
          description: Active organization actors ordered by id.
          content:
            {
              application/json:
                { schema: { $ref: "#/components/schemas/ActorPage" } },
            }
        "422": { $ref: "#/components/responses/Error" }
  /api/v1/actors/{actor_id}/avatar:
    get:
      operationId: getActorAvatar
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: "#/components/parameters/ActorId" }]
      responses:
        "200":
          description: Authorized actor avatar.
          headers:
            Cache-Control: { schema: { type: string } }
          content:
            image/png: { schema: { type: string, format: binary } }
            image/jpeg: { schema: { type: string, format: binary } }
            image/webp: { schema: { type: string, format: binary } }
        "404": { $ref: "#/components/responses/Error" }
  /api/v1/chats/{chat_id}:
    get:
      operationId: getChat
      security: [{ bearerAuth: [] }]
      parameters:
        - {
            name: chat_id,
            in: path,
            required: true,
            schema: { type: string, format: uuid },
          }
      responses:
        "200":
          description: Chat visible to the current member.
          content:
            {
              application/json:
                { schema: { $ref: "#/components/schemas/Chat" } },
            }
        "404": { $ref: "#/components/responses/Error" }
    patch:
      operationId: updateChat
      security: [{ bearerAuth: [] }]
      parameters:
        - { $ref: "#/components/parameters/ChatId" }
      requestBody:
        required: true
        content:
          {
            application/json:
              { schema: { $ref: "#/components/schemas/UpdateChatRequest" } },
          }
      responses:
        "200":
          description: Updated chat.
          content:
            {
              application/json:
                { schema: { $ref: "#/components/schemas/Chat" } },
            }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
    delete:
      operationId: archiveChat
      security: [{ bearerAuth: [] }]
      parameters:
        - { $ref: "#/components/parameters/ChatId" }
      responses:
        "204":
          description: Group or channel archived by its manager or a workspace moderator.
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
