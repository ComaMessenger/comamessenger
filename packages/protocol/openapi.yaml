  /api/v1/search:
    get:
      operationId: searchMessagesAndFiles
      security: [{ bearerAuth: [] }]
      parameters:
        - {
            name: q,
            in: query,
            required: true,
            schema: { type: string, minLength: 1, maxLength: 200 },
          }
        - { name: chat_id, in: query, schema: { type: string, format: uuid } }
        - { name: author_id, in: query, schema: { type: string, format: uuid } }
