        [
          actor_id,
          email,
          display_name,
          handle,
          title,
          role,
          status,
          permissions,
          created_at,
          last_seen_at,
          status_emoji,
          status_text,
          status_expires_at,
          avatar_version,
        ]
      properties:
        actor_id: { type: string, format: uuid }
        email: { type: string, format: email }
        display_name: { type: string }
        handle: { type: string }
        title: { type: string }
        role: { type: string, enum: [owner, admin, member] }
        status: { type: string, enum: [active, deactivated] }
        permissions:
          type: array
          uniqueItems: true
          items: { $ref: "#/components/schemas/Permission" }
        created_at: { type: string, format: date-time }
        last_seen_at: { type: [string, "null"], format: date-time }
        status_emoji: { type: string, maxLength: 16 }
        status_text: { type: string, maxLength: 100 }
        status_expires_at: { type: [string, "null"], format: date-time }
        avatar_version: { type: integer, format: int64, minimum: 0 }
    UpdateOrganizationMemberRequest:
      type: object
      additionalProperties: false
      properties:
        role: { type: [string, "null"], enum: [admin, member, null] }
        status: { type: [string, "null"], enum: [active, deactivated, null] }
        permissions:
          type: [array, "null"]
          uniqueItems: true
          items: { $ref: "#/components/schemas/Permission" }
    TransferOwnershipRequest:
      type: object
      additionalProperties: false
      required: [target_actor_id, current_password]
      properties:
        target_actor_id: { type: string, format: uuid }
        current_password: { type: string, minLength: 1, maxLength: 1024 }
    AuditEntry:
