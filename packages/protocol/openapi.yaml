          content:
            application/json: { schema: { $ref: "#/components/schemas/Message" } }
        "403": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
  /api/v1/agent-runtime/runs/{run_id}/complete:
    post:
      operationId: completeAgentRuntimeRun
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: "#/components/parameters/AgentRunId" }]
      requestBody:
        required: true
        content:
          application/json:
            { schema: { $ref: "#/components/schemas/CompleteAgentRunRequest" } }
      responses:
        "200":
          description: Run completed and usage recorded.
          content:
            application/json:
              { schema: { $ref: "#/components/schemas/AgentRun" } }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
  /api/v1/agent-runtime/runs/{run_id}/fail:
    post:
      operationId: failAgentRuntimeRun
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: "#/components/parameters/AgentRunId" }]
      requestBody:
        required: true
        content:
          application/json:
            { schema: { $ref: "#/components/schemas/FailAgentRunRequest" } }
      responses:
        "200":
          description: Run failed, requeued, canceled, or timed out according to durable retry policy.
          content:
            application/json:
              { schema: { $ref: "#/components/schemas/AgentRun" } }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
  /api/v1/agent-runtime/checkpoints/{consumer}:
    parameters:
      - name: consumer
        in: path
        required: true
        schema: { type: string, pattern: "^[a-z0-9][a-z0-9_.-]{0,63}$" }
    get:
      operationId: getAgentRuntimeCheckpoint
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: Durable resume checkpoint initialized at the current organization watermark when first read.
          content:
            application/json:
              {
                schema: { $ref: "#/components/schemas/AgentRuntimeCheckpoint" },
              }
        "403": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
    put:
      operationId: updateAgentRuntimeCheckpoint
      description: Advances a consumer checkpoint monotonically; rewinds are ignored.
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            {
              schema:
                {
                  $ref: "#/components/schemas/UpdateAgentRuntimeCheckpointRequest",
                },
            }
      responses:
        "200":
          description: Durable checkpoint advanced.
          content:
            application/json:
              {
                schema: { $ref: "#/components/schemas/AgentRuntimeCheckpoint" },
              }
        "403": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
  /api/v1/agent-runtime/mcp-servers:
    post:
      operationId: listAgentRuntimeMcpServers
      description: Returns enabled MCP endpoints for the agent bound to an active run lease over a no-store response.
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AgentRuntimeRunLeaseRequest" }
      responses:
        "200":
          description: Runtime-only MCP configurations.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/AgentRuntimeMcpServer" }
        "403": { $ref: "#/components/responses/Error" }
  /api/v1/agent-runtime/provider-calls:
    post:
      operationId: startAgentProviderCall
      description: Atomically reserves cost against daily and monthly budgets before a provider request.
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            {
              schema:
                { $ref: "#/components/schemas/StartAgentProviderCallRequest" },
            }
      responses:
        "201":
          description: Provider call reservation recorded with the run correlation ID.
          content:
            application/json:
              { schema: { $ref: "#/components/schemas/AgentProviderCall" } }
        "402": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
  /api/v1/agent-runtime/provider/chat:
    post:
      operationId: proxyAgentProviderChat
      description: Streams a model response through core; provider credentials and authoritative usage accounting never leave core.
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AgentProviderProxyRequest" }
      responses:
        "200":
          description: Provider SSE stream with credentials removed.
          content:
            text/event-stream:
              schema: { type: string }
        "402": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
        "429": { $ref: "#/components/responses/Error" }
        "502": { $ref: "#/components/responses/Error" }
  /api/v1/agent-runtime/provider-calls/{call_id}/finish:
    post:
      operationId: finishAgentProviderCall
      security: [{ bearerAuth: [] }]
      parameters:
        - name: call_id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            {
              schema:
                { $ref: "#/components/schemas/FinishAgentProviderCallRequest" },
            }
      responses:
        "200":
          description: Provider call usage finalized.
          content:
            application/json:
              { schema: { $ref: "#/components/schemas/AgentProviderCall" } }
        "403": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
  /api/v1/agent-runtime/mcp-tool-calls:
    post:
      operationId: startAgentRuntimeMcpToolCall
      description: Authorizes and records an allowlisted MCP tool call against its run correlation ID.
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              { $ref: "#/components/schemas/StartAgentMcpToolCallRequest" }
      responses:
        "201":
          description: MCP tool call authorized and started.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AgentMcpToolCall" }
        "403": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
  /api/v1/agent-runtime/mcp-tool-calls/{call_id}/finish:
    post:
      operationId: finishAgentRuntimeMcpToolCall
      security: [{ bearerAuth: [] }]
      parameters:
        - name: call_id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              { $ref: "#/components/schemas/FinishAgentMcpToolCallRequest" }
      responses:
        "204": { description: MCP tool call finalized and audited. }
        "403": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
components:
  securitySchemes:
    bearerAuth:
      { type: http, scheme: bearer, bearerFormat: JWT-or-Agent-API-Key }
  responses:
    Error:
      description: Stable API error.
      content:
        { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
    Tokens:
      description: Access token and user. Refresh token is set as an HttpOnly cookie.
      content:
        {
          application/json:
            { schema: { $ref: "#/components/schemas/TokenResponse" } },
        }
  parameters:
    ChatId:
      name: chat_id
      in: path
      required: true
      schema: { type: string, format: uuid }
    ActorId:
      name: actor_id
      in: path
      required: true
      schema: { type: string, format: uuid }
    MessageId:
      name: message_id
      in: path
      required: true
      schema: { type: string, format: uuid }
    UploadId:
      name: upload_id
      in: path
      required: true
      schema: { type: string, format: uuid }
    FileId:
      name: file_id
      in: path
      required: true
      schema: { type: string, format: uuid }
    AgentId:
      name: agent_id
      in: path
      required: true
      schema: { type: string, format: uuid }
    AgentKeyId:
      name: key_id
      in: path
      required: true
      schema: { type: string, format: uuid }
    AgentRunId:
      name: run_id
      in: path
      required: true
      schema: { type: string, format: uuid }
    AgentToolConfirmationId:
      name: confirmation_id
      in: path
      required: true
      schema: { type: string, format: uuid }
    AgentTriggerId:
      name: trigger_id
      in: path
      required: true
      schema: { type: string, format: uuid }
  schemas:
    Health:
      type: object
      additionalProperties: false
      required: [status]
      properties:
        status:
          type: string
    Error:
      type: object
      additionalProperties: false
      required: [code, message, request_id]
      properties:
        code:
          $ref: "#/components/schemas/ErrorCode"
        message:
          type: string
        request_id:
          type: string
        details:
          type: object
          additionalProperties: true
    ErrorCode:
      type: string
      enum:
        - already_bootstrapped
        - agent_budget_exceeded
        - agent_conflict
        - agent_configuration_not_found
        - agent_not_found
        - agent_trigger_conflict
        - agent_trigger_not_found
        - chat_conflict
        - chat_not_found
        - forbidden
        - file_conflict
        - file_not_found
        - idempotency_conflict
        - internal_error
        - invalid_credentials
        - invalid_refresh_token
        - invalid_request
        - invitation_invalid
        - message_not_found
        - origin_not_allowed
        - payload_too_large
        - password_change_required
        - push_unavailable
        - rate_limited
        - service_not_ready
        - session_not_found
        - smtp_not_configured
        - storage_full
        - email_taken
        - reauthentication_failed
        - token_invalid
        - unauthorized
        - unsupported_format
        - validation_failed
        - version_conflict
        - workspace_not_found
    File:
      type: object
      additionalProperties: false
      required:
        [
          id,
          name,
          mime,
          size,
          status,
          processing_status,
          created_at,
          uploader_id,
        ]
      properties:
        id: { type: string, format: uuid }
        name: { type: string, minLength: 1, maxLength: 255 }
        mime: { type: string, minLength: 1, maxLength: 255 }
        size: { type: integer, format: int64, minimum: 0 }
        sha256: { type: string, pattern: "^[a-f0-9]{64}$" }
        status: { type: string, enum: [pending, ready, failed, deleted] }
        processing_status:
          { type: string, enum: [pending, processing, ready, failed, skipped] }
        preview_file_id: { type: string, format: uuid }
        created_at: { type: string, format: date-time }
        ready_at: { type: string, format: date-time }
        uploader_id: { type: string, format: uuid }
    SearchResult:
      type: object
      additionalProperties: false
      required:
        [
          kind,
          chat_id,
          message_id,
          actor_id,
          snippet,
          rank,
          created_seq,
          created_at,
        ]
      properties:
        kind: { type: string, enum: [message, file] }
        chat_id: { type: string, format: uuid }
        message_id: { type: string, format: uuid }
        thread_root_id: { type: [string, "null"], format: uuid }
        actor_id: { type: string, format: uuid }
        file_id: { type: string, format: uuid }
        file_name: { type: string }
        file_mime: { type: string }
        snippet: { type: string, maxLength: 1000 }
        rank: { type: number, format: float, minimum: 0 }
        created_seq: { type: integer, format: int64, minimum: 1 }
        created_at: { type: string, format: date-time }
    SearchPage:
      type: object
      additionalProperties: false
      required: [results, next_cursor]
      properties:
        results:
          type: array
          items: { $ref: "#/components/schemas/SearchResult" }
        next_cursor: { type: [string, "null"] }
    CreateFileUploadRequest:
      type: object
      additionalProperties: false
      required: [name, mime, size]
      properties:
        name: { type: string, minLength: 1, maxLength: 255 }
        mime: { type: string, minLength: 1, maxLength: 255 }
        size: { type: integer, format: int64, minimum: 1 }
        sha256: { type: string, pattern: "^[a-fA-F0-9]{64}$" }
    FileUpload:
      type: object
      additionalProperties: false
      required: [id, file, mode, expires_at]
      properties:
        id: { type: string, format: uuid }
        file: { $ref: "#/components/schemas/File" }
        mode: { type: string, enum: [streaming, presigned, multipart] }
        upload_url: { type: string, format: uri-reference }
        expires_at: { type: string, format: date-time }
        parts:
          type: array
          items: { $ref: "#/components/schemas/FilePartLink" }
    FilePartLink:
      type: object
      additionalProperties: false
      required: [number, url]
      properties:
        number: { type: integer, minimum: 1, maximum: 10000 }
        url: { type: string, format: uri }
    SignFilePartsRequest:
      type: object
      additionalProperties: false
      required: [part_numbers]
      properties:
        part_numbers:
          type: array
          minItems: 1
          maxItems: 100
          uniqueItems: true
          items: { type: integer, minimum: 1, maximum: 10000 }
    CompletedFilePart:
      type: object
      additionalProperties: false
      required: [number, etag]
      properties:
        number: { type: integer, minimum: 1, maximum: 10000 }
        etag: { type: string, minLength: 1, maxLength: 512 }
        size: { type: integer, format: int64, minimum: 1 }
    CompleteFileUploadRequest:
      type: object
      additionalProperties: false
      properties:
        parts:
          type: array
          maxItems: 10000
          items: { $ref: "#/components/schemas/CompletedFilePart" }
    DurableEventTypeV1:
      $ref: "./schemas/realtime/v1.schema.json#/$defs/KnownDurableEventType"
    RealtimeCloseCodeV1:
      $ref: "./schemas/realtime/v1.schema.json#/$defs/CloseCode"
    RealtimeAuthFrameV1:
      $ref: "./schemas/realtime/v1.schema.json#/$defs/AuthFrame"
    RealtimeAckFrameV1:
      $ref: "./schemas/realtime/v1.schema.json#/$defs/AckFrame"
    RealtimeSubscribeActiveFrameV1:
      $ref: "./schemas/realtime/v1.schema.json#/$defs/SubscribeActiveFrame"
    RealtimeTypingFrameV1:
      $ref: "./schemas/realtime/v1.schema.json#/$defs/TypingFrame"
    RealtimeSetPresenceFrameV1:
      $ref: "./schemas/realtime/v1.schema.json#/$defs/SetPresenceFrame"
    RealtimeAgentStatusFrameV1:
      $ref: "./schemas/realtime/v1.schema.json#/$defs/AgentStatusFrame"
    RealtimeMessageStreamingFrameV1:
      $ref: "./schemas/realtime/v1.schema.json#/$defs/MessageStreamingFrame"
    RealtimeHelloFrameV1:
      $ref: "./schemas/realtime/v1.schema.json#/$defs/HelloFrame"
    RealtimeDurableEventFrameV1:
      $ref: "./schemas/realtime/v1.schema.json#/$defs/DurableEventFrame"
    RealtimeResyncRequiredFrameV1:
      $ref: "./schemas/realtime/v1.schema.json#/$defs/ResyncRequiredFrame"
    RealtimeTypingEventFrameV1:
      $ref: "./schemas/realtime/v1.schema.json#/$defs/TypingEventFrame"
    RealtimePresenceEventFrameV1:
      $ref: "./schemas/realtime/v1.schema.json#/$defs/PresenceEventFrame"
    RealtimeAgentStatusEventFrameV1:
      $ref: "./schemas/realtime/v1.schema.json#/$defs/AgentStatusEventFrame"
    RealtimeMessageStreamingEventFrameV1:
      $ref: "./schemas/realtime/v1.schema.json#/$defs/MessageStreamingEventFrame"
    RealtimeProtocolErrorFrameV1:
      $ref: "./schemas/realtime/v1.schema.json#/$defs/ProtocolErrorFrame"
    BootstrapStatus:
      type: object
      required: [bootstrapped]
      properties: { bootstrapped: { type: boolean } }
    BootstrapRequest:
      type: object
      additionalProperties: false
      required:
        [
          organization_name,
          organization_slug,
          display_name,
          handle,
          email,
          password,
        ]
      properties:
        organization_name: { type: string, minLength: 1, maxLength: 120 }
        organization_slug:
          { type: string, pattern: "^[a-z0-9][a-z0-9-]{1,62}$" }
        display_name: { type: string, minLength: 1, maxLength: 120 }
        handle: { type: string, pattern: "^[a-z0-9][a-z0-9_.-]{1,31}$" }
        email: { type: string, format: email }
        password: { type: string, minLength: 10, maxLength: 1024 }
        timezone: { type: string, default: UTC }
    LoginRequest:
      type: object
      additionalProperties: false
      required: [email, password]
      properties:
        email: { type: string, format: email }
        password: { type: string }
    UpdateProfileRequest:
      type: object
      additionalProperties: false
      properties:
        display_name: { type: string, minLength: 1, maxLength: 120 }
        handle: { type: string }
        title: { type: string, maxLength: 120 }
        about: { type: string, maxLength: 280 }
        timezone: { type: string }
    ChangePasswordRequest:
      type: object
      additionalProperties: false
      required: [current_password, new_password]
      properties:
        current_password: { type: string, minLength: 1, maxLength: 1024 }
        new_password: { type: string, minLength: 10, maxLength: 1024 }
    ForgotPasswordRequest:
      type: object
      additionalProperties: false
      required: [email]
      properties:
        email: { type: string, format: email }
    ResetPasswordRequest:
      type: object
      additionalProperties: false
      required: [token, new_password]
      properties:
        token: { type: string, minLength: 1, maxLength: 1024 }
        new_password: { type: string, minLength: 10, maxLength: 1024 }
    ChangeEmailRequest:
      type: object
      additionalProperties: false
      required: [new_email, current_password]
      properties:
        new_email: { type: string, format: email }
        current_password: { type: string, minLength: 1, maxLength: 1024 }
    ConfirmEmailRequest:
      type: object
      additionalProperties: false
      required: [token]
      properties:
        token: { type: string, minLength: 1, maxLength: 1024 }
    EmailChangeResponse:
      type: object
      additionalProperties: false
      required: [pending_confirmation, user]
      properties:
        pending_confirmation: { type: boolean }
        user:
          oneOf:
            - { $ref: "#/components/schemas/User" }
            - { type: "null" }
    User:
      type: object
      required:
        [
          id,
          org_id,
          organization_name,
          role,
          email,
          display_name,
          handle,
          title,
          about,
          timezone,
          status,
          permissions,
          must_change_password,
          can_create_invitations,
          status_emoji,
          status_text,
          status_expires_at,
          avatar_version,
          created_at,
        ]
      properties:
        id: { type: string, format: uuid }
        org_id: { type: string, format: uuid }
        organization_name: { type: string }
        role: { type: string, enum: [owner, admin, member] }
        email: { type: string, format: email }
        display_name: { type: string }
        handle: { type: string }
        title: { type: string }
        about: { type: string }
        timezone: { type: string }
        status: { type: string, enum: [active, deactivated] }
        permissions:
          type: array
          uniqueItems: true
          items: { $ref: "#/components/schemas/Permission" }
        must_change_password: { type: boolean }
        can_create_invitations: { type: boolean }
        status_emoji: { type: string, maxLength: 16 }
        status_text: { type: string, maxLength: 100 }
        status_expires_at: { type: [string, "null"], format: date-time }
        avatar_version: { type: integer, format: int64, minimum: 0 }
        created_at: { type: string, format: date-time }
    AgentScope:
      type: string
      enum:
        [
          chats:read,
          messages:read,
          messages:write,
          reactions:write,
          files:read,
          search:read,
          members:read,
          memory:read,
          memory:write,
          runtime:execute,
          runtime:worker,
        ]
    Agent:
      type: object
      additionalProperties: false
      required:
        [
          id,
          org_id,
          owner_actor_id,
          display_name,
          handle,
          kind,
          recipe,
          recipe_version,
          description,
          enabled,
          allowed_scopes,
          provider,
          model,
          external_data_sharing_approved,
          daily_cost_limit,
          monthly_cost_limit,
          max_output_tokens,
          max_tool_iterations,
          max_chain_depth,
          per_chat_concurrency,
          rate_limit_per_minute,
          provider_rate_limit_per_minute,
          execution_timeout_seconds,
          chat_ids,
          readiness,
          avatar_version,
          created_at,
          updated_at,
        ]
      properties:
        id: { type: string, format: uuid }
        org_id: { type: string, format: uuid }
        owner_actor_id: { type: string, format: uuid }
        display_name: { type: string, minLength: 1, maxLength: 120 }
        handle: { type: string, pattern: "^[a-z0-9][a-z0-9_.-]{1,31}$" }
        kind: { type: string, enum: [builtin, external] }
        recipe: { type: string, enum: [custom, summarizer, qa, onboarding] }
        recipe_version: { type: integer, minimum: 1 }
        description: { type: string, maxLength: 2000 }
        enabled: { type: boolean }
        allowed_scopes:
          {
            type: array,
            uniqueItems: true,
            items: { $ref: "#/components/schemas/AgentScope" },
          }
        provider: { type: string, maxLength: 100 }
        model: { type: string, maxLength: 200 }
        endpoint_url: { type: string, maxLength: 2048 }
        external_data_sharing_approved: { type: boolean }
        daily_cost_limit:
          { type: [string, "null"], pattern: '^[0-9]+(?:\.[0-9]{1,8})?$' }
        monthly_cost_limit:
          { type: [string, "null"], pattern: '^[0-9]+(?:\.[0-9]{1,8})?$' }
        max_output_tokens: { type: integer, minimum: 1, maximum: 1000000 }
        max_tool_iterations: { type: integer, minimum: 0, maximum: 64 }
        max_chain_depth: { type: integer, minimum: 0, maximum: 16 }
        per_chat_concurrency: { type: integer, minimum: 1, maximum: 32 }
        rate_limit_per_minute: { type: integer, minimum: 1, maximum: 100000 }
        provider_rate_limit_per_minute:
          { type: integer, minimum: 1, maximum: 100000 }
        execution_timeout_seconds: { type: integer, minimum: 30, maximum: 3600 }
        chat_ids:
          {
            type: array,
            uniqueItems: true,
            maxItems: 100,
            items: { type: string, format: uuid },
          }
        avatar_version: { type: integer, format: int64, minimum: 0 }
        readiness: { $ref: "#/components/schemas/AgentReadiness" }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    AgentReadiness:
      type: object
      additionalProperties: false
      required: [state, ready, blockers]
      properties:
        state: { type: string, enum: [needs_setup, ready, enabled, error] }
        ready: { type: boolean }
        blockers:
          type: array
          uniqueItems: true
          items:
            type: string
            enum:
              [
                chat_required,
                runtime_key_required,
                provider_model_required,
                provider_credential_required,
                external_data_approval_required,
                trigger_required,
              ]
    CreateAgentRequest:
      type: object
      additionalProperties: false
      required:
        [
          display_name,
          handle,
          kind,
          enabled,
          allowed_scopes,
          external_data_sharing_approved,
