    post:
      operationId: invokeAgentTool
      description: Invokes a tool through the same scope and membership checks as its REST operations.
      security: [{ bearerAuth: [] }]
      parameters:
        - name: tool_name
          in: path
          required: true
          schema: { type: string, minLength: 1, maxLength: 120 }
