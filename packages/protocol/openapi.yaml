openapi: 3.1.0
info:
  title: ComaMessenger API
  version: 0.2.0
servers:
  - url: http://localhost:8080
paths:
  /healthz:
    get:
      operationId: getHealth
      responses:
        "200":
          description: Process is alive.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"
  /readyz:
    get:
      operationId: getReadiness
      responses:
        "200":
          description: Process is ready to serve traffic.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"
        "503":
          description: A required dependency is unavailable.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/v1/bootstrap/status:
    get:
      operationId: getBootstrapStatus
      responses:
        "200":
          description: Current bootstrap state.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BootstrapStatus" }
  /api/v1/bootstrap:
    post:
      operationId: bootstrap
      parameters:
        - name: X-Coma-Bootstrap-Token
          in: header
          required: false
          description: Required outside development; configure it with BOOTSTRAP_TOKEN.
          schema: { type: string, minLength: 32 }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/BootstrapRequest" }
      responses:
        "201": { $ref: "#/components/responses/Tokens" }
        "403": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
  /api/v1/auth/login:
    post:
      operationId: login
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LoginRequest" }
      responses:
        "200": { $ref: "#/components/responses/Tokens" }
        "401": { $ref: "#/components/responses/Error" }
  /api/v1/auth/refresh:
    post:
      operationId: refresh
      responses:
        "200": { $ref: "#/components/responses/Tokens" }
        "401": { $ref: "#/components/responses/Error" }
  /api/v1/auth/logout:
    post:
      operationId: logout
      security: [{ bearerAuth: [] }]
      responses:
        "204": { description: Session revoked. }
        "401": { $ref: "#/components/responses/Error" }
  /api/v1/ws:
    get:
      operationId: connectRealtime
      description: Upgrade to the version 1 WebSocket protocol. Authentication is sent in the first WebSocket frame.
      responses:
        "101": { description: WebSocket connection established. }
        "403": { $ref: "#/components/responses/Error" }
        "426": { description: WebSocket upgrade is required. }
  /api/v1/me:
    get:
      operationId: getMe
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: Current user.
          content:
            {
              application/json:
                { schema: { $ref: "#/components/schemas/User" } },
            }
        "401": { $ref: "#/components/responses/Error" }
    patch:
      operationId: updateMe
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          {
            application/json:
              { schema: { $ref: "#/components/schemas/UpdateProfileRequest" } },
          }
      responses:
        "200":
          description: Updated user.
          content:
            {
              application/json:
                { schema: { $ref: "#/components/schemas/User" } },
            }
        "422": { $ref: "#/components/responses/Error" }
  /api/v1/sessions:
    get:
      operationId: listSessions
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: User sessions.
          content:
            application/json:
              schema:
                type: object
                required: [sessions]
                properties:
                  sessions:
                    {
                      type: array,
                      items: { $ref: "#/components/schemas/Session" },
                    }
  /api/v1/sessions/{session_id}:
    delete:
      operationId: revokeSession
      security: [{ bearerAuth: [] }]
      parameters:
        - {
            name: session_id,
            in: path,
            required: true,
            schema: { type: string, format: uuid },
          }
      responses:
        "204": { description: Session revoked. }
        "404": { $ref: "#/components/responses/Error" }
  /api/v1/invitations:
    post:
      operationId: createInvitation
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          {
            application/json:
              {
                schema:
                  { $ref: "#/components/schemas/CreateInvitationRequest" },
              },
          }
      responses:
        "201":
          description: Invitation created.
          content:
            {
              application/json:
                { schema: { $ref: "#/components/schemas/Invitation" } },
            }
        "403": { $ref: "#/components/responses/Error" }
  /api/v1/invitations/{token}/accept:
    post:
      operationId: acceptInvitation
      parameters:
        - { name: token, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          {
            application/json:
              {
                schema:
                  { $ref: "#/components/schemas/AcceptInvitationRequest" },
              },
          }
      responses:
        "201": { $ref: "#/components/responses/Tokens" }
        "410": { $ref: "#/components/responses/Error" }
  /api/v1/chats:
    get:
      operationId: listChats
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: Chats visible through membership.
          content:
            application/json:
              schema:
                type: object
                required: [chats]
                properties:
                  chats:
                    {
                      type: array,
                      items: { $ref: "#/components/schemas/Chat" },
                    }
    post:
      operationId: createChat
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          {
            application/json:
              { schema: { $ref: "#/components/schemas/CreateChatRequest" } },
          }
      responses:
        "201":
          description: Created or existing direct chat.
          content:
            {
              application/json:
                { schema: { $ref: "#/components/schemas/Chat" } },
            }
        "403": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
  /api/v1/chats/{chat_id}:
    get:
      operationId: getChat
      security: [{ bearerAuth: [] }]
      parameters:
        - {
            name: chat_id,
            in: path,
            required: true,
            schema: { type: string, format: uuid },
          }
      responses:
        "200":
          description: Chat visible to the current member.
          content:
            {
              application/json:
                { schema: { $ref: "#/components/schemas/Chat" } },
            }
        "404": { $ref: "#/components/responses/Error" }
    patch:
      operationId: updateChat
      security: [{ bearerAuth: [] }]
      parameters:
        - { $ref: "#/components/parameters/ChatId" }
      requestBody:
        required: true
        content:
          {
            application/json:
              { schema: { $ref: "#/components/schemas/UpdateChatRequest" } },
          }
      responses:
        "200":
          description: Updated chat.
          content:
            {
              application/json:
                { schema: { $ref: "#/components/schemas/Chat" } },
            }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
    delete:
      operationId: archiveChat
      security: [{ bearerAuth: [] }]
      parameters:
        - { $ref: "#/components/parameters/ChatId" }
      responses:
        "204": { description: Chat archived. }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /api/v1/chats/discover:
    get:
      operationId: discoverChats
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: Public chats the current user has not joined.
          content:
            application/json:
              schema:
                type: object
                required: [chats]
                properties:
                  chats:
                    {
                      type: array,
                      items: { $ref: "#/components/schemas/DirectoryChat" },
                    }
  /api/v1/chats/{chat_id}/join:
    post:
      operationId: joinChat
      security: [{ bearerAuth: [] }]
      parameters:
        - { $ref: "#/components/parameters/ChatId" }
      responses:
        "200":
          description: Joined public chat, or current membership.
          content:
            {
              application/json:
                { schema: { $ref: "#/components/schemas/Chat" } },
            }
        "404": { $ref: "#/components/responses/Error" }
  /api/v1/chats/{chat_id}/members:
    get:
      operationId: listChatMembers
      security: [{ bearerAuth: [] }]
      parameters:
        - { $ref: "#/components/parameters/ChatId" }
      responses:
        "200":
          description: Active chat members.
          content:
            application/json:
              schema:
                type: object
                required: [members]
                properties:
                  members:
                    {
                      type: array,
                      items: { $ref: "#/components/schemas/ChatMember" },
                    }
        "404": { $ref: "#/components/responses/Error" }
    post:
      operationId: addChatMember
      security: [{ bearerAuth: [] }]
      parameters:
        - { $ref: "#/components/parameters/ChatId" }
      requestBody:
        required: true
        content:
          {
            application/json:
              { schema: { $ref: "#/components/schemas/AddChatMemberRequest" } },
          }
      responses:
        "201":
          description: Member added.
          content:
            {
              application/json:
                { schema: { $ref: "#/components/schemas/ChatMember" } },
            }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
  /api/v1/chats/{chat_id}/members/{actor_id}:
    patch:
      operationId: updateChatMember
      security: [{ bearerAuth: [] }]
      parameters:
        - { $ref: "#/components/parameters/ChatId" }
        - { $ref: "#/components/parameters/ActorId" }
      requestBody:
        required: true
        content:
          {
            application/json:
              {
                schema:
                  { $ref: "#/components/schemas/UpdateChatMemberRequest" },
              },
          }
      responses:
        "200":
          description: Member role updated.
          content:
            {
              application/json:
                { schema: { $ref: "#/components/schemas/ChatMember" } },
            }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
    delete:
      operationId: removeChatMember
      security: [{ bearerAuth: [] }]
      parameters:
        - { $ref: "#/components/parameters/ChatId" }
        - { $ref: "#/components/parameters/ActorId" }
      responses:
        "204": { description: Member removed. }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /api/v1/chats/{chat_id}/messages:
    get:
      operationId: listMessages
      security: [{ bearerAuth: [] }]
      parameters:
        - { $ref: "#/components/parameters/ChatId" }
        - {
            name: before_seq,
            in: query,
            schema: { type: integer, format: int64, minimum: 1 },
          }
        - {
            name: limit,
            in: query,
            schema: { type: integer, minimum: 1, maximum: 100, default: 50 },
          }
        - {
            name: thread_root_id,
            in: query,
            schema: { type: string, format: uuid },
          }
      responses:
        "200":
          description: Messages visible to the current chat member, newest first.
          content:
            {
              application/json:
                { schema: { $ref: "#/components/schemas/MessagePage" } },
            }
        "404": { $ref: "#/components/responses/Error" }
        "429": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
    post:
      operationId: createMessage
      security: [{ bearerAuth: [] }]
      parameters:
        - { $ref: "#/components/parameters/ChatId" }
      requestBody:
        required: true
        content:
          {
            application/json:
              { schema: { $ref: "#/components/schemas/CreateMessageRequest" } },
          }
      responses:
        "200":
          description: The original message for an idempotent replay.
          content:
            {
              application/json:
                { schema: { $ref: "#/components/schemas/Message" } },
            }
        "201":
          description: Message created.
          content:
            {
              application/json:
                { schema: { $ref: "#/components/schemas/Message" } },
            }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "413": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
  /api/v1/chats/{chat_id}/pins:
    get:
      operationId: listMessagePins
      security: [{ bearerAuth: [] }]
      parameters:
        - { $ref: "#/components/parameters/ChatId" }
      responses:
        "200":
          description: Current pins in the chat, newest first.
          content:
            {
              application/json:
                { schema: { $ref: "#/components/schemas/MessagePinList" } },
            }
        "404": { $ref: "#/components/responses/Error" }
  /api/v1/messages/{message_id}:
    patch:
      operationId: updateMessage
      security: [{ bearerAuth: [] }]
      parameters:
        - { $ref: "#/components/parameters/MessageId" }
      requestBody:
        required: true
        content:
          {
            application/json:
              { schema: { $ref: "#/components/schemas/UpdateMessageRequest" } },
          }
      responses:
        "200":
          description: Message updated.
          content:
            {
              application/json:
                { schema: { $ref: "#/components/schemas/Message" } },
            }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "413": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
    delete:
      operationId: deleteMessage
      security: [{ bearerAuth: [] }]
      parameters:
        - { $ref: "#/components/parameters/MessageId" }
      responses:
        "200":
          description: Soft-deleted message, or the existing tombstone for an idempotent replay.
          content:
            {
              application/json:
                { schema: { $ref: "#/components/schemas/Message" } },
            }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
  /api/v1/messages/{message_id}/reactions/{emoji}:
    put:
      operationId: putReaction
      security: [{ bearerAuth: [] }]
      parameters:
        - { $ref: "#/components/parameters/MessageId" }
        - {
            name: emoji,
            in: path,
            required: true,
            schema: { type: string, minLength: 1, maxLength: 64 },
          }
      responses:
        "200":
          description: Existing reaction for an idempotent replay.
          content:
            {
              application/json:
                { schema: { $ref: "#/components/schemas/Reaction" } },
            }
        "201":
          description: Reaction added.
          content:
            {
              application/json:
                { schema: { $ref: "#/components/schemas/Reaction" } },
            }
        "404": { $ref: "#/components/responses/Error" }
        "429": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
    delete:
      operationId: deleteReaction
      security: [{ bearerAuth: [] }]
      parameters:
        - { $ref: "#/components/parameters/MessageId" }
        - {
            name: emoji,
            in: path,
            required: true,
            schema: { type: string, minLength: 1, maxLength: 64 },
          }
      responses:
        "204": { description: Reaction is absent. }
        "404": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
  /api/v1/messages/{message_id}/reactions:
    get:
      operationId: listReactions
      security: [{ bearerAuth: [] }]
      parameters:
        - { $ref: "#/components/parameters/MessageId" }
      responses:
        "200":
          description: Current reactions on the message.
          content:
            {
              application/json:
                { schema: { $ref: "#/components/schemas/ReactionList" } },
            }
        "404": { $ref: "#/components/responses/Error" }
  /api/v1/messages/{message_id}/pin:
    put:
      operationId: putMessagePin
      security: [{ bearerAuth: [] }]
      parameters:
        - { $ref: "#/components/parameters/MessageId" }
      responses:
        "200":
          description: Existing pin for an idempotent replay.
          content:
            {
              application/json:
                { schema: { $ref: "#/components/schemas/MessagePin" } },
            }
        "201":
          description: Message pinned.
          content:
            {
              application/json:
                { schema: { $ref: "#/components/schemas/MessagePin" } },
            }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
    delete:
      operationId: deleteMessagePin
      security: [{ bearerAuth: [] }]
      parameters:
        - { $ref: "#/components/parameters/MessageId" }
      responses:
        "204": { description: Message pin is absent. }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
  /api/v1/messages/{message_id}/forward:
    post:
      operationId: forwardMessage
      security: [{ bearerAuth: [] }]
      parameters:
        - { $ref: "#/components/parameters/MessageId" }
      requestBody:
        required: true
        content:
          {
            application/json:
              {
                schema: { $ref: "#/components/schemas/ForwardMessageRequest" },
              },
          }
      responses:
        "200":
          description: Original forwarded snapshot for an idempotent replay.
          content:
            {
              application/json:
                { schema: { $ref: "#/components/schemas/Message" } },
            }
        "201":
          description: Forwarded snapshot created.
          content:
            {
              application/json:
                { schema: { $ref: "#/components/schemas/Message" } },
            }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
  /api/v1/messages/{message_id}/thread/follow:
    put:
      operationId: followThread
      security: [{ bearerAuth: [] }]
      parameters:
        - { $ref: "#/components/parameters/MessageId" }
      responses:
        "200":
          description: Existing thread follow for an idempotent replay.
          content:
            {
              application/json:
                { schema: { $ref: "#/components/schemas/ThreadFollow" } },
            }
        "201":
          description: Thread followed.
          content:
            {
              application/json:
                { schema: { $ref: "#/components/schemas/ThreadFollow" } },
            }
        "404": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
    delete:
      operationId: unfollowThread
      security: [{ bearerAuth: [] }]
      parameters:
        - { $ref: "#/components/parameters/MessageId" }
      responses:
        "204": { description: Thread follow is absent. }
        "404": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
  /api/v1/messages/{message_id}/thread:
    get:
      operationId: listThreadMessages
      security: [{ bearerAuth: [] }]
      parameters:
        - { $ref: "#/components/parameters/MessageId" }
        - {
            name: before_seq,
            in: query,
            schema: { type: integer, format: int64, minimum: 1 },
          }
        - {
            name: limit,
            in: query,
            schema: { type: integer, minimum: 1, maximum: 100, default: 50 },
          }
      responses:
        "200":
          description: Replies in the thread, newest first.
          content:
            {
              application/json:
                { schema: { $ref: "#/components/schemas/MessagePage" } },
            }
        "404": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
  /api/v1/threads:
    get:
      operationId: listFollowedThreads
      security: [{ bearerAuth: [] }]
      parameters:
        - {
            name: before_seq,
            in: query,
            schema: { type: integer, format: int64, minimum: 1 },
          }
        - {
            name: limit,
            in: query,
            schema: { type: integer, minimum: 1, maximum: 100, default: 50 },
          }
      responses:
        "200":
          description: Followed threads visible to the current member, ordered by latest activity.
          content:
            {
              application/json:
                { schema: { $ref: "#/components/schemas/ThreadPage" } },
            }
        "422": { $ref: "#/components/responses/Error" }
  /api/v1/unread:
    get:
      operationId: getUnreadSnapshot
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: Current chat and followed-thread unread counters.
          content:
            {
              application/json:
                { schema: { $ref: "#/components/schemas/UnreadSnapshot" } },
            }
  /api/v1/chats/{chat_id}/read:
    post:
      operationId: markChatRead
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: "#/components/parameters/ChatId" }]
      requestBody:
        required: true
        content:
          {
            application/json:
              { schema: { $ref: "#/components/schemas/MarkReadRequest" } },
          }
      responses:
        "200":
          description: Monotonic chat read marker.
          content:
            {
              application/json:
                { schema: { $ref: "#/components/schemas/ReadMarker" } },
            }
        "404": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
  /api/v1/messages/{message_id}/thread/read:
    post:
      operationId: markThreadRead
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: "#/components/parameters/MessageId" }]
      requestBody:
        required: true
        content:
          {
            application/json:
              { schema: { $ref: "#/components/schemas/MarkReadRequest" } },
          }
      responses:
        "200":
          description: Monotonic thread read marker.
          content:
            {
              application/json:
                { schema: { $ref: "#/components/schemas/ReadMarker" } },
            }
        "404": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
  /api/v1/drafts:
    get:
      operationId: listDrafts
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: Drafts visible only to the current actor.
          content:
            {
              application/json:
                { schema: { $ref: "#/components/schemas/DraftList" } },
            }
  /api/v1/drafts/{chat_id}:
    put:
      operationId: putDraft
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: "#/components/parameters/ChatId" }]
      requestBody:
        required: true
        content:
          {
            application/json:
              { schema: { $ref: "#/components/schemas/PutDraftRequest" } },
          }
      responses:
        "200":
          description: Existing or updated draft.
          content:
            {
              application/json:
                { schema: { $ref: "#/components/schemas/Draft" } },
            }
        "201":
          description: Draft created.
          content:
            {
              application/json:
                { schema: { $ref: "#/components/schemas/Draft" } },
            }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "413": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
    delete:
      operationId: deleteDraft
      security: [{ bearerAuth: [] }]
      parameters:
        - { $ref: "#/components/parameters/ChatId" }
        - {
            name: thread_root_id,
            in: query,
            schema: { type: string, format: uuid },
          }
      responses:
        "204": { description: Draft is absent. }
        "404": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
components:
  securitySchemes:
    bearerAuth: { type: http, scheme: bearer, bearerFormat: JWT }
  responses:
    Error:
      description: Stable API error.
      content:
        { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
    Tokens:
      description: Access token and user. Refresh token is set as an HttpOnly cookie.
      content:
        {
          application/json:
            { schema: { $ref: "#/components/schemas/TokenResponse" } },
        }
  parameters:
    ChatId:
      name: chat_id
      in: path
      required: true
      schema: { type: string, format: uuid }
    ActorId:
      name: actor_id
      in: path
      required: true
      schema: { type: string, format: uuid }
    MessageId:
      name: message_id
      in: path
      required: true
      schema: { type: string, format: uuid }
  schemas:
    Health:
      type: object
      additionalProperties: false
      required: [status]
      properties:
        status:
          type: string
    Error:
      type: object
      additionalProperties: false
      required: [code, message, request_id]
      properties:
        code:
          $ref: "#/components/schemas/ErrorCode"
        message:
          type: string
        request_id:
          type: string
        details:
          type: object
          additionalProperties: true
    ErrorCode:
      type: string
      enum:
        - already_bootstrapped
        - chat_conflict
        - chat_not_found
        - forbidden
        - idempotency_conflict
        - internal_error
        - invalid_credentials
        - invalid_refresh_token
        - invalid_request
        - invitation_invalid
        - message_not_found
        - origin_not_allowed
        - payload_too_large
        - rate_limited
        - service_not_ready
        - session_not_found
        - unauthorized
        - unsupported_format
        - validation_failed
        - version_conflict
    DurableEventTypeV1:
      $ref: "./schemas/realtime/v1.schema.json#/$defs/KnownDurableEventType"
    RealtimeCloseCodeV1:
      $ref: "./schemas/realtime/v1.schema.json#/$defs/CloseCode"
    RealtimeAuthFrameV1:
      $ref: "./schemas/realtime/v1.schema.json#/$defs/AuthFrame"
    RealtimeAckFrameV1:
      $ref: "./schemas/realtime/v1.schema.json#/$defs/AckFrame"
    RealtimeSubscribeActiveFrameV1:
      $ref: "./schemas/realtime/v1.schema.json#/$defs/SubscribeActiveFrame"
    RealtimeTypingFrameV1:
      $ref: "./schemas/realtime/v1.schema.json#/$defs/TypingFrame"
    RealtimeSetPresenceFrameV1:
      $ref: "./schemas/realtime/v1.schema.json#/$defs/SetPresenceFrame"
    RealtimeHelloFrameV1:
      $ref: "./schemas/realtime/v1.schema.json#/$defs/HelloFrame"
    RealtimeDurableEventFrameV1:
      $ref: "./schemas/realtime/v1.schema.json#/$defs/DurableEventFrame"
    RealtimeResyncRequiredFrameV1:
      $ref: "./schemas/realtime/v1.schema.json#/$defs/ResyncRequiredFrame"
    RealtimeTypingEventFrameV1:
      $ref: "./schemas/realtime/v1.schema.json#/$defs/TypingEventFrame"
    RealtimePresenceEventFrameV1:
      $ref: "./schemas/realtime/v1.schema.json#/$defs/PresenceEventFrame"
    RealtimeProtocolErrorFrameV1:
      $ref: "./schemas/realtime/v1.schema.json#/$defs/ProtocolErrorFrame"
    BootstrapStatus:
      type: object
      required: [bootstrapped]
      properties: { bootstrapped: { type: boolean } }
    BootstrapRequest:
      type: object
      additionalProperties: false
      required:
        [
          organization_name,
          organization_slug,
          display_name,
          handle,
          email,
          password,
        ]
      properties:
        organization_name: { type: string, minLength: 1, maxLength: 120 }
        organization_slug:
          { type: string, pattern: "^[a-z0-9][a-z0-9-]{1,62}$" }
        display_name: { type: string, minLength: 1, maxLength: 120 }
        handle: { type: string, pattern: "^[a-z0-9][a-z0-9_.-]{1,31}$" }
        email: { type: string, format: email }
        password: { type: string, minLength: 10, maxLength: 1024 }
        timezone: { type: string, default: UTC }
    LoginRequest:
      type: object
      additionalProperties: false
      required: [email, password]
      properties:
        email: { type: string, format: email }
        password: { type: string }
    UpdateProfileRequest:
      type: object
      additionalProperties: false
      properties:
        display_name: { type: string, minLength: 1, maxLength: 120 }
        handle: { type: string }
        timezone: { type: string }
    User:
      type: object
      required:
        [
          id,
          org_id,
          role,
          email,
          display_name,
          handle,
          timezone,
          status,
          created_at,
        ]
      properties:
        id: { type: string, format: uuid }
        org_id: { type: string, format: uuid }
        role: { type: string, enum: [owner, admin, member] }
        email: { type: string, format: email }
        display_name: { type: string }
        handle: { type: string }
        timezone: { type: string }
        status: { type: string, enum: [active, deactivated] }
        created_at: { type: string, format: date-time }
    TokenResponse:
      type: object
      required: [access_token, access_expires_at, user]
      properties:
        access_token: { type: string }
        access_expires_at: { type: string, format: date-time }
        user: { $ref: "#/components/schemas/User" }
    Session:
      type: object
      required: [id, user_agent, created_at, last_seen_at, expires_at, current]
      properties:
        id: { type: string, format: uuid }
        user_agent: { type: string }
        ip_address: { type: string }
        created_at: { type: string, format: date-time }
        last_seen_at: { type: string, format: date-time }
        expires_at: { type: string, format: date-time }
        revoked_at: { type: [string, "null"], format: date-time }
        current: { type: boolean }
    CreateInvitationRequest:
      type: object
      additionalProperties: false
      required: [email]
      properties:
        email: { type: string, format: email }
        role: { type: string, enum: [admin, member], default: member }
    Invitation:
      type: object
      required: [id, email, role, expires_at]
      properties:
        id: { type: string, format: uuid }
        email: { type: string, format: email }
        role: { type: string, enum: [admin, member] }
        expires_at: { type: string, format: date-time }
        accept_url: { type: string, format: uri }
    AcceptInvitationRequest:
      type: object
      additionalProperties: false
      required: [display_name, handle, password]
      properties:
        display_name: { type: string }
        handle: { type: string }
        password: { type: string, minLength: 10 }
        timezone: { type: string, default: UTC }
    CreateChatRequest:
      type: object
      additionalProperties: false
      required: [kind]
      properties:
        kind: { type: string, enum: [direct, group, channel] }
        visibility: { type: string, enum: [private, public], default: private }
        name: { type: string }
        topic: { type: string, maxLength: 500 }
        member_ids:
          {
            type: array,
            items: { type: string, format: uuid },
            uniqueItems: true,
          }
    Chat:
      type: object
      required: [id, kind, visibility, topic, role, created_at]
      properties:
        id: { type: string, format: uuid }
        kind: { type: string, enum: [direct, group, channel] }
        visibility: { type: string, enum: [private, public] }
        name: { type: [string, "null"] }
        topic: { type: string }
        role: { type: string, enum: [owner, admin, member] }
        created_at: { type: string, format: date-time }
        archived_at: { type: [string, "null"], format: date-time }
    UpdateChatRequest:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        name: { type: string, minLength: 1, maxLength: 120 }
        topic: { type: string, maxLength: 500 }
        visibility: { type: string, enum: [private, public] }
    DirectoryChat:
      type: object
      required: [id, kind, name, topic, created_at]
      properties:
        id: { type: string, format: uuid }
        kind: { type: string, enum: [group, channel] }
        name: { type: string }
        topic: { type: string }
        created_at: { type: string, format: date-time }
    ChatMember:
      type: object
      required: [actor_id, display_name, handle, role, joined_at]
      properties:
        actor_id: { type: string, format: uuid }
        display_name: { type: string }
        handle: { type: string }
        role: { type: string, enum: [owner, admin, member] }
        joined_at: { type: string, format: date-time }
    AddChatMemberRequest:
      type: object
      additionalProperties: false
      required: [actor_id]
      properties:
        actor_id: { type: string, format: uuid }
        role: { type: string, enum: [owner, admin, member], default: member }
    UpdateChatMemberRequest:
      type: object
      additionalProperties: false
      required: [role]
      properties:
        role: { type: string, enum: [owner, admin, member] }
    Message:
      type: object
      additionalProperties: false
      required:
        [
          id,
          chat_id,
          actor_id,
          client_msg_id,
          type,
          body,
          body_format,
          mentioned_actor_ids,
          version,
          created_seq,
          created_at,
        ]
      properties:
        id: { type: string, format: uuid }
        chat_id: { type: string, format: uuid }
        actor_id: { type: string, format: uuid }
        client_msg_id: { type: string, format: uuid }
        type: { type: string, enum: [text] }
        body: { type: string }
        body_format: { type: string, enum: [plain, markdown] }
        reply_to_id: { type: [string, "null"], format: uuid }
        thread_root_id: { type: [string, "null"], format: uuid }
        version: { type: integer, minimum: 1 }
        created_seq: { type: integer, format: int64, minimum: 1 }
        created_at: { type: string, format: date-time }
        edited_at: { type: [string, "null"], format: date-time }
        deleted_at: { type: [string, "null"], format: date-time }
        forwarded_from:
          oneOf:
            - { $ref: "#/components/schemas/ForwardAttribution" }
            - { type: "null" }
        mentioned_actor_ids:
          type: array
          items: { type: string, format: uuid }
          uniqueItems: true
    MessagePage:
      type: object
      additionalProperties: false
      required: [messages, next_before_seq]
      properties:
        messages:
          { type: array, items: { $ref: "#/components/schemas/Message" } }
        next_before_seq: { type: [integer, "null"], format: int64, minimum: 1 }
    CreateMessageRequest:
      type: object
      additionalProperties: false
      required: [client_msg_id, body]
      properties:
        client_msg_id: { type: string, format: uuid }
        body: { type: string, minLength: 1 }
        body_format: { type: string, enum: [plain, markdown], default: plain }
        reply_to_id: { type: string, format: uuid }
        thread_root_id: { type: string, format: uuid }
        mentioned_actor_ids:
          type: array
          items: { type: string, format: uuid }
          uniqueItems: true
    UpdateMessageRequest:
      type: object
      additionalProperties: false
      required: [body, expected_version]
      properties:
        body: { type: string, minLength: 1 }
        body_format: { type: string, enum: [plain, markdown], default: plain }
        expected_version: { type: integer, minimum: 1 }
        mentioned_actor_ids:
          type: array
          items: { type: string, format: uuid }
          uniqueItems: true
    ForwardAttribution:
      type: object
      additionalProperties: false
      required: [author_name, author_handle, created_at]
      properties:
        author_name: { type: string }
        author_handle: { type: string }
        created_at: { type: string, format: date-time }
    ForwardMessageRequest:
      type: object
      additionalProperties: false
      required: [chat_id, client_msg_id]
      properties:
        chat_id: { type: string, format: uuid }
        client_msg_id: { type: string, format: uuid }
    Reaction:
      type: object
      additionalProperties: false
      required: [message_id, actor_id, emoji, created_at]
      properties:
        message_id: { type: string, format: uuid }
        actor_id: { type: string, format: uuid }
        emoji: { type: string, minLength: 1, maxLength: 64 }
        created_at: { type: string, format: date-time }
    ReactionList:
      type: object
      additionalProperties: false
      required: [reactions]
      properties:
        reactions:
          { type: array, items: { $ref: "#/components/schemas/Reaction" } }
    MessagePin:
      type: object
      additionalProperties: false
      required: [message_id, pinned_by, pinned_at]
      properties:
        message_id: { type: string, format: uuid }
        pinned_by: { type: string, format: uuid }
        pinned_at: { type: string, format: date-time }
    MessagePinList:
      type: object
      additionalProperties: false
      required: [pins]
      properties:
        pins:
          { type: array, items: { $ref: "#/components/schemas/MessagePin" } }
    ThreadFollow:
      type: object
      additionalProperties: false
      required: [thread_root_id, followed_at]
      properties:
        thread_root_id: { type: string, format: uuid }
        followed_at: { type: string, format: date-time }
    ThreadSummary:
      type: object
      additionalProperties: false
      required: [root, reply_count, last_activity_seq, followed_at]
      properties:
        root: { $ref: "#/components/schemas/Message" }
        reply_count: { type: integer, format: int64, minimum: 0 }
        last_reply_seq: { type: [integer, "null"], format: int64, minimum: 1 }
        last_activity_seq: { type: integer, format: int64, minimum: 1 }
        followed_at: { type: string, format: date-time }
    ThreadPage:
      type: object
      additionalProperties: false
      required: [threads, next_before_seq]
      properties:
        threads:
          { type: array, items: { $ref: "#/components/schemas/ThreadSummary" } }
        next_before_seq: { type: [integer, "null"], format: int64, minimum: 1 }
    MarkReadRequest:
      type: object
      additionalProperties: false
      required: [last_read_seq]
      properties:
        last_read_seq: { type: integer, format: int64, minimum: 1 }
    ReadMarker:
      type: object
      additionalProperties: false
      required: [chat_id, last_read_seq, last_read_at]
      properties:
        chat_id: { type: string, format: uuid }
        thread_root_id: { type: [string, "null"], format: uuid }
        last_read_seq: { type: integer, format: int64, minimum: 1 }
        last_read_at: { type: string, format: date-time }
    Draft:
      type: object
      additionalProperties: false
      required: [chat_id, body, body_format, version, updated_at]
      properties:
        chat_id: { type: string, format: uuid }
        thread_root_id: { type: [string, "null"], format: uuid }
        body: { type: string }
        body_format: { type: string, enum: [plain, markdown] }
        version: { type: integer, minimum: 1 }
        updated_at: { type: string, format: date-time }
    PutDraftRequest:
      type: object
      additionalProperties: false
      required: [body, expected_version]
      properties:
        thread_root_id: { type: [string, "null"], format: uuid }
        body: { type: string }
        body_format: { type: string, enum: [plain, markdown], default: plain }
        expected_version: { type: integer, minimum: 0 }
    DraftList:
      type: object
      additionalProperties: false
      required: [drafts]
      properties:
        drafts: { type: array, items: { $ref: "#/components/schemas/Draft" } }
    ChatUnread:
      type: object
      additionalProperties: false
      required: [chat_id, last_read_seq, unread_count, mention_count]
      properties:
        chat_id: { type: string, format: uuid }
        last_read_seq: { type: integer, format: int64, minimum: 0 }
        unread_count: { type: integer, format: int64, minimum: 0 }
        mention_count: { type: integer, format: int64, minimum: 0 }
    ThreadUnread:
      type: object
      additionalProperties: false
      required:
        [thread_root_id, chat_id, last_read_seq, unread_count, mention_count]
      properties:
        thread_root_id: { type: string, format: uuid }
        chat_id: { type: string, format: uuid }
        last_read_seq: { type: integer, format: int64, minimum: 0 }
        unread_count: { type: integer, format: int64, minimum: 0 }
        mention_count: { type: integer, format: int64, minimum: 0 }
    UnreadSnapshot:
      type: object
      additionalProperties: false
      required: [chats, threads]
      properties:
        chats:
          { type: array, items: { $ref: "#/components/schemas/ChatUnread" } }
        threads:
          { type: array, items: { $ref: "#/components/schemas/ThreadUnread" } }
