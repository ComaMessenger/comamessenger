        "200":
          description: Chat notification policy reset to the global default.
          content:
            application/json:
              schema:
                { $ref: "#/components/schemas/ChatNotificationPreferences" }
        "422": { $ref: "#/components/responses/Error" }
  /api/v1/chats/notification-overrides:
    get:
      operationId: listChatNotificationOverrides
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: Chats with notification settings that differ from the global defaults.
          content:
            application/json:
              schema:
                type: array
                items:
                  { $ref: "#/components/schemas/ChatNotificationOverride" }
  /api/v1/files/uploads:
    post:
      operationId: createFileUpload
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateFileUploadRequest" }
      responses:
        "201":
          description: Reserved upload session with a selected transport flow.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FileUpload" }
        "413": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
        "507": { $ref: "#/components/responses/Error" }
  /api/v1/files/uploads/{upload_id}/content:
    put:
      operationId: putFileUploadContent
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: "#/components/parameters/UploadId" }]
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema: { type: string, format: binary }
      responses:
        "200":
          description: Completed streaming upload.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/File" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "413": { $ref: "#/components/responses/Error" }
        "415": { $ref: "#/components/responses/Error" }
        "507": { $ref: "#/components/responses/Error" }
  /api/v1/files/uploads/{upload_id}/parts:
    post:
      operationId: signFileUploadParts
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: "#/components/parameters/UploadId" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SignFilePartsRequest" }
      responses:
        "200":
          description: Short-lived multipart part URLs.
          content:
            application/json:
              schema:
                type: object
                required: [parts]
                properties:
                  parts:
                    type: array
                    items: { $ref: "#/components/schemas/FilePartLink" }
        "404": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
  /api/v1/files/uploads/{upload_id}/complete:
    post:
      operationId: completeFileUpload
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: "#/components/parameters/UploadId" }]
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CompleteFileUploadRequest" }
      responses:
        "200":
          description: Completed presigned or multipart upload.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/File" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
  /api/v1/files/uploads/{upload_id}:
    delete:
      operationId: abortFileUpload
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: "#/components/parameters/UploadId" }]
      responses:
        "204": { description: Upload aborted and quota reservation released. }
        "404": { $ref: "#/components/responses/Error" }
  /api/v1/files/{file_id}:
    get:
      operationId: getFile
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: "#/components/parameters/FileId" }]
      responses:
        "200":
          description: Membership-authorized file metadata.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/File" }
        "404": { $ref: "#/components/responses/Error" }
  /api/v1/files/{file_id}/download:
    get:
      operationId: downloadFile
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: "#/components/parameters/FileId" }]
      responses:
        "200":
          description: Authorized local blob stream.
          content:
            application/octet-stream: { schema: { type: string, format: binary } }
        "307": { description: Short-lived authorized object-store URL. }
        "404": { $ref: "#/components/responses/Error" }
components:
  securitySchemes:
    bearerAuth: { type: http, scheme: bearer, bearerFormat: JWT }
  responses:
    Error:
      description: Stable API error.
      content:
        { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
    Tokens:
      description: Access token and user. Refresh token is set as an HttpOnly cookie.
      content:
        {
          application/json:
            { schema: { $ref: "#/components/schemas/TokenResponse" } },
        }
  parameters:
    ChatId:
      name: chat_id
      in: path
      required: true
      schema: { type: string, format: uuid }
    ActorId:
      name: actor_id
      in: path
      required: true
      schema: { type: string, format: uuid }
    MessageId:
      name: message_id
      in: path
      required: true
      schema: { type: string, format: uuid }
    UploadId:
      name: upload_id
      in: path
      required: true
      schema: { type: string, format: uuid }
    FileId:
      name: file_id
      in: path
      required: true
      schema: { type: string, format: uuid }
  schemas:
    Health:
      type: object
      additionalProperties: false
      required: [status]
      properties:
        status:
          type: string
    Error:
      type: object
      additionalProperties: false
      required: [code, message, request_id]
      properties:
        code:
          $ref: "#/components/schemas/ErrorCode"
        message:
          type: string
        request_id:
          type: string
        details:
          type: object
          additionalProperties: true
    ErrorCode:
      type: string
      enum:
        - already_bootstrapped
        - chat_conflict
        - chat_not_found
        - forbidden
        - file_conflict
        - file_not_found
        - idempotency_conflict
        - internal_error
        - invalid_credentials
        - invalid_refresh_token
        - invalid_request
        - invitation_invalid
        - message_not_found
        - origin_not_allowed
        - payload_too_large
        - password_change_required
        - push_unavailable
        - rate_limited
        - service_not_ready
        - session_not_found
        - smtp_not_configured
        - storage_full
        - email_taken
        - reauthentication_failed
        - token_invalid
        - unauthorized
        - unsupported_format
        - validation_failed
        - version_conflict
        - workspace_not_found
    File:
      type: object
      additionalProperties: false
      required: [id, name, mime, size, status, processing_status, created_at, uploader_id]
      properties:
        id: { type: string, format: uuid }
        name: { type: string, minLength: 1, maxLength: 255 }
        mime: { type: string, minLength: 1, maxLength: 255 }
        size: { type: integer, format: int64, minimum: 0 }
        sha256: { type: string, pattern: "^[a-f0-9]{64}$" }
        status: { type: string, enum: [pending, ready, failed, deleted] }
        processing_status: { type: string, enum: [pending, processing, ready, failed, skipped] }
        preview_file_id: { type: string, format: uuid }
        created_at: { type: string, format: date-time }
        ready_at: { type: string, format: date-time }
        uploader_id: { type: string, format: uuid }
    CreateFileUploadRequest:
      type: object
      additionalProperties: false
      required: [name, mime, size]
      properties:
        name: { type: string, minLength: 1, maxLength: 255 }
        mime: { type: string, minLength: 1, maxLength: 255 }
        size: { type: integer, format: int64, minimum: 1 }
        sha256: { type: string, pattern: "^[a-fA-F0-9]{64}$" }
    FileUpload:
      type: object
      additionalProperties: false
      required: [id, file, mode, expires_at]
      properties:
        id: { type: string, format: uuid }
        file: { $ref: "#/components/schemas/File" }
        mode: { type: string, enum: [streaming, presigned, multipart] }
        upload_url: { type: string, format: uri-reference }
        expires_at: { type: string, format: date-time }
        parts:
          type: array
          items: { $ref: "#/components/schemas/FilePartLink" }
    FilePartLink:
      type: object
      additionalProperties: false
      required: [number, url]
      properties:
        number: { type: integer, minimum: 1, maximum: 10000 }
        url: { type: string, format: uri }
    SignFilePartsRequest:
      type: object
      additionalProperties: false
      required: [part_numbers]
      properties:
        part_numbers:
          type: array
          minItems: 1
          maxItems: 100
          uniqueItems: true
          items: { type: integer, minimum: 1, maximum: 10000 }
    CompletedFilePart:
      type: object
      additionalProperties: false
      required: [number, etag]
      properties:
        number: { type: integer, minimum: 1, maximum: 10000 }
        etag: { type: string, minLength: 1, maxLength: 512 }
        size: { type: integer, format: int64, minimum: 1 }
    CompleteFileUploadRequest:
      type: object
      additionalProperties: false
      properties:
        parts:
          type: array
          maxItems: 10000
          items: { $ref: "#/components/schemas/CompletedFilePart" }
    DurableEventTypeV1:
      $ref: "./schemas/realtime/v1.schema.json#/$defs/KnownDurableEventType"
    RealtimeCloseCodeV1:
      $ref: "./schemas/realtime/v1.schema.json#/$defs/CloseCode"
    RealtimeAuthFrameV1:
      $ref: "./schemas/realtime/v1.schema.json#/$defs/AuthFrame"
    RealtimeAckFrameV1:
      $ref: "./schemas/realtime/v1.schema.json#/$defs/AckFrame"
    RealtimeSubscribeActiveFrameV1:
      $ref: "./schemas/realtime/v1.schema.json#/$defs/SubscribeActiveFrame"
    RealtimeTypingFrameV1:
      $ref: "./schemas/realtime/v1.schema.json#/$defs/TypingFrame"
    RealtimeSetPresenceFrameV1:
      $ref: "./schemas/realtime/v1.schema.json#/$defs/SetPresenceFrame"
    RealtimeHelloFrameV1:
      $ref: "./schemas/realtime/v1.schema.json#/$defs/HelloFrame"
    RealtimeDurableEventFrameV1:
      $ref: "./schemas/realtime/v1.schema.json#/$defs/DurableEventFrame"
    RealtimeResyncRequiredFrameV1:
      $ref: "./schemas/realtime/v1.schema.json#/$defs/ResyncRequiredFrame"
    RealtimeTypingEventFrameV1:
      $ref: "./schemas/realtime/v1.schema.json#/$defs/TypingEventFrame"
    RealtimePresenceEventFrameV1:
      $ref: "./schemas/realtime/v1.schema.json#/$defs/PresenceEventFrame"
    RealtimeProtocolErrorFrameV1:
      $ref: "./schemas/realtime/v1.schema.json#/$defs/ProtocolErrorFrame"
    BootstrapStatus:
      type: object
      required: [bootstrapped]
      properties: { bootstrapped: { type: boolean } }
    BootstrapRequest:
      type: object
      additionalProperties: false
      required:
        [
          organization_name,
          organization_slug,
          display_name,
          handle,
          email,
          password,
        ]
      properties:
        organization_name: { type: string, minLength: 1, maxLength: 120 }
        organization_slug:
          { type: string, pattern: "^[a-z0-9][a-z0-9-]{1,62}$" }
        display_name: { type: string, minLength: 1, maxLength: 120 }
        handle: { type: string, pattern: "^[a-z0-9][a-z0-9_.-]{1,31}$" }
        email: { type: string, format: email }
        password: { type: string, minLength: 10, maxLength: 1024 }
        timezone: { type: string, default: UTC }
    LoginRequest:
      type: object
      additionalProperties: false
      required: [email, password]
      properties:
        email: { type: string, format: email }
        password: { type: string }
    UpdateProfileRequest:
      type: object
      additionalProperties: false
      properties:
        display_name: { type: string, minLength: 1, maxLength: 120 }
        handle: { type: string }
        title: { type: string, maxLength: 120 }
        about: { type: string, maxLength: 280 }
        timezone: { type: string }
    ChangePasswordRequest:
      type: object
      additionalProperties: false
      required: [current_password, new_password]
      properties:
        current_password: { type: string, minLength: 1, maxLength: 1024 }
        new_password: { type: string, minLength: 10, maxLength: 1024 }
    ForgotPasswordRequest:
      type: object
      additionalProperties: false
      required: [email]
      properties:
        email: { type: string, format: email }
    ResetPasswordRequest:
      type: object
      additionalProperties: false
      required: [token, new_password]
      properties:
        token: { type: string, minLength: 1, maxLength: 1024 }
        new_password: { type: string, minLength: 10, maxLength: 1024 }
    ChangeEmailRequest:
      type: object
      additionalProperties: false
      required: [new_email, current_password]
      properties:
        new_email: { type: string, format: email }
        current_password: { type: string, minLength: 1, maxLength: 1024 }
    ConfirmEmailRequest:
      type: object
      additionalProperties: false
      required: [token]
      properties:
        token: { type: string, minLength: 1, maxLength: 1024 }
    EmailChangeResponse:
      type: object
      additionalProperties: false
      required: [pending_confirmation, user]
      properties:
        pending_confirmation: { type: boolean }
        user:
          oneOf:
            - { $ref: "#/components/schemas/User" }
            - { type: "null" }
    User:
      type: object
      required:
        [
          id,
          org_id,
          organization_name,
          role,
          email,
          display_name,
          handle,
          title,
          about,
          timezone,
          status,
          permissions,
          must_change_password,
          can_create_invitations,
          status_emoji,
          status_text,
          status_expires_at,
          avatar_version,
          created_at,
        ]
      properties:
        id: { type: string, format: uuid }
        org_id: { type: string, format: uuid }
        organization_name: { type: string }
        role: { type: string, enum: [owner, admin, member] }
        email: { type: string, format: email }
        display_name: { type: string }
        handle: { type: string }
        title: { type: string }
        about: { type: string }
        timezone: { type: string }
        status: { type: string, enum: [active, deactivated] }
        permissions:
          type: array
          uniqueItems: true
          items: { $ref: "#/components/schemas/Permission" }
        must_change_password: { type: boolean }
        can_create_invitations: { type: boolean }
        status_emoji: { type: string, maxLength: 16 }
        status_text: { type: string, maxLength: 100 }
        status_expires_at: { type: [string, "null"], format: date-time }
        avatar_version: { type: integer, format: int64, minimum: 0 }
        created_at: { type: string, format: date-time }
    AvatarUpdate:
      type: object
      additionalProperties: false
      required: [actor_id, avatar_version]
      properties:
        actor_id: { type: string, format: uuid }
        avatar_version: { type: integer, format: int64, minimum: 0 }
    SetStatusRequest:
      type: object
      additionalProperties: false
      required: [emoji, text, expires_at]
      properties:
        emoji: { type: string, maxLength: 16 }
        text: { type: string, maxLength: 100 }
        expires_at: { type: [string, "null"], format: date-time }
    CustomStatus:
      type: object
      additionalProperties: false
      required: [emoji, text, expires_at]
      properties:
        emoji: { type: string, maxLength: 16 }
        text: { type: string, maxLength: 100 }
        expires_at: { type: [string, "null"], format: date-time }
    Permission:
      type: string
      enum:
        - members.manage
        - invitations.manage
        - workspace.settings
        - workspace.policies
        - branding.manage
        - integrations.manage
        - audit.read
        - chats.moderate
    TokenResponse:
      type: object
      required: [access_token, access_expires_at, user]
      properties:
        access_token: { type: string }
        access_expires_at: { type: string, format: date-time }
        user: { $ref: "#/components/schemas/User" }
    Session:
      type: object
      required: [id, user_agent, created_at, last_seen_at, expires_at, current]
      properties:
        id: { type: string, format: uuid }
        user_agent: { type: string }
        ip_address: { type: string }
        created_at: { type: string, format: date-time }
        last_seen_at: { type: string, format: date-time }
        expires_at: { type: string, format: date-time }
        revoked_at: { type: [string, "null"], format: date-time }
        current: { type: boolean }
    PublicBranding:
