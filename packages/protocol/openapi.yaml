        next_before_seq: { type: [integer, "null"], format: int64, minimum: 1 }
    MarkReadRequest:
      type: object
      additionalProperties: false
      required: [last_read_seq]
      properties:
        last_read_seq: { type: integer, format: int64, minimum: 1 }
    ReadMarker:
      type: object
      additionalProperties: false
      required: [chat_id, last_read_seq, last_read_at]
      properties:
        chat_id: { type: string, format: uuid }
        thread_root_id: { type: [string, "null"], format: uuid }
        last_read_seq: { type: integer, format: int64, minimum: 1 }
        last_read_at: { type: string, format: date-time }
    Draft:
      type: object
      additionalProperties: false
      required: [chat_id, body, body_format, version, updated_at]
      properties:
        chat_id: { type: string, format: uuid }
        thread_root_id: { type: [string, "null"], format: uuid }
        body: { type: string }
        body_format: { type: string, enum: [plain, markdown] }
        version: { type: integer, minimum: 1 }
        updated_at: { type: string, format: date-time }
    PutDraftRequest:
      type: object
      additionalProperties: false
      required: [body, expected_version]
      properties:
        thread_root_id: { type: [string, "null"], format: uuid }
        body: { type: string }
        body_format: { type: string, enum: [plain, markdown], default: plain }
        expected_version: { type: integer, minimum: 0 }
    DraftList:
      type: object
      additionalProperties: false
      required: [drafts]
      properties:
