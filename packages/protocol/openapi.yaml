        default_timezone: { type: string, minLength: 1, maxLength: 64 }
        allow_member_invitations: { type: boolean }
        allow_public_chat_creation: { type: boolean }
        allow_channel_creation: { type: boolean }
        accent_color: { type: string, pattern: "^#[0-9A-Fa-f]{6}$" }
        has_logo: { type: boolean }
        has_favicon: { type: boolean }
    UpdateOrganizationSettingsRequest:
