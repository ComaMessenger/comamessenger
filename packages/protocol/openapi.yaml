        unread_count: { type: integer, format: int64, minimum: 0 }
        mention_count: { type: integer, format: int64, minimum: 0 }
    ThreadUnread:
      type: object
      additionalProperties: false
      required:
        [thread_root_id, chat_id, last_read_seq, unread_count, mention_count]
      properties:
        thread_root_id: { type: string, format: uuid }
        chat_id: { type: string, format: uuid }
        last_read_seq: { type: integer, format: int64, minimum: 0 }
        unread_count: { type: integer, format: int64, minimum: 0 }
        mention_count: { type: integer, format: int64, minimum: 0 }
    UnreadSnapshot:
      type: object
      additionalProperties: false
      required: [chats, threads]
      properties:
        chats:
          { type: array, items: { $ref: "#/components/schemas/ChatUnread" } }
        threads:
          { type: array, items: { $ref: "#/components/schemas/ThreadUnread" } }
    PushConfig:
      type: object
      additionalProperties: false
      required: [enabled, public_key]
      properties:
        enabled: { type: boolean }
        public_key: { type: string }
    PushSubscriptionRequest:
      type: object
      additionalProperties: false
      required: [endpoint, keys]
      properties:
        endpoint: { type: string, format: uri }
        keys:
          type: object
          additionalProperties: false
          required: [p256dh, auth]
          properties: { p256dh: { type: string }, auth: { type: string } }
    PushSubscription:
      type: object
      additionalProperties: false
      required: [id, endpoint, created_at]
      properties:
        id: { type: string, format: uuid }
        endpoint: { type: string, format: uri }
        created_at: { type: string, format: date-time }
    PushSubscriptionInfo:
      type: object
      additionalProperties: false
      required: [id, user_agent, created_at, updated_at, current]
      properties:
        id: { type: string, format: uuid }
        user_agent: { type: string }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        current: { type: boolean }
    PushTestResult:
      type: object
      additionalProperties: false
      required: [sent, failed]
      properties:
        sent: { type: integer, minimum: 0 }
        failed: { type: integer, minimum: 0 }
    UserPreferences:
      type: object
      additionalProperties: false
      required:
        [
          theme,
          locale,
          in_app_enabled,
          push_enabled,
          push_preview,
          notify_messages,
          notify_threads,
          notify_reactions,
          notify_invites,
          notify_system,
          sound_enabled,
          sound_id,
          schedule,
          snoozed_until,
          email_digest,
        ]
      properties:
        theme: { type: string, enum: [system, light, dark] }
        locale: { type: string, enum: [ru, en] }
        in_app_enabled: { type: boolean }
        push_enabled: { type: boolean }
        push_preview: { type: boolean }
        notify_messages:
          { type: string, enum: [all, direct_and_mentions, none] }
        notify_threads: { type: string, enum: [all, mentions, none] }
        notify_reactions: { type: boolean }
        notify_invites: { type: boolean }
        notify_system: { type: boolean }
        sound_enabled: { type: boolean }
        sound_id: { type: string, enum: [default] }
        schedule:
          oneOf:
            - { $ref: "#/components/schemas/NotificationSchedule" }
            - { type: "null" }
        snoozed_until: { type: [string, "null"], format: date-time }
        email_digest: { type: boolean }
    UpdatePreferencesRequest:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        theme: { type: string, enum: [system, light, dark] }
        locale: { type: string, enum: [ru, en] }
        in_app_enabled: { type: boolean }
        push_enabled: { type: boolean }
        push_preview: { type: boolean }
        notify_messages:
          { type: string, enum: [all, direct_and_mentions, none] }
        notify_threads: { type: string, enum: [all, mentions, none] }
        notify_reactions: { type: boolean }
        notify_invites: { type: boolean }
        notify_system: { type: boolean }
        sound_enabled: { type: boolean }
        sound_id: { type: string, enum: [default] }
        schedule:
          oneOf:
            - { $ref: "#/components/schemas/NotificationSchedule" }
            - { type: "null" }
        snoozed_until: { type: [string, "null"], format: date-time }
        email_digest: { type: boolean }
    NotificationSchedule:
      type: object
      additionalProperties: false
      required: [days, from, to]
      properties:
        days:
          oneOf:
            - { type: string, enum: [all, weekdays] }
            - type: array
              minItems: 1
              maxItems: 7
              uniqueItems: true
              items: { type: integer, minimum: 0, maximum: 6 }
        from: { type: string, pattern: "^(?:[01][0-9]|2[0-3]):[0-5][0-9]$" }
        to: { type: string, pattern: "^(?:[01][0-9]|2[0-3]):[0-5][0-9]$" }
    ChatFolders:
      type: array
