# Your own reverse proxy on the host (nginx.conf.example) instead of Caddy.
# In .env:
#   COMPOSE_FILE=compose.yaml:compose.host-proxy.yaml
#   COMPOSE_PROFILES=            (without "caddy"; keep "agents" or "s3" if used)
# Core and Web then listen on 127.0.0.1 only.
services:
  core:
    ports:
      - "127.0.0.1:${CORE_HOST_PORT:-8080}:8080"
  web:
    ports:
      - "127.0.0.1:${WEB_HOST_PORT:-8081}:8080"
  s3gw:
    ports:
      - "127.0.0.1:${S3_HOST_PORT:-9100}:9000"
