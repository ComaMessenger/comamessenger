name: comamessenger

services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-comamessenger}
      POSTGRES_USER: ${POSTGRES_USER:-comamessenger}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-comamessenger}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20
    volumes:
      - postgres-data:/var/lib/postgresql/data

  minio:
    image: minio/minio:latest
    command: server /data --console-address :9001
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-comamessenger}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-comamessenger-local-secret}
    ports:
      - "9000:9000"
      - "9001:9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 3s
      retries: 20
    volumes:
      - minio-data:/data

  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint:
      - /bin/sh
      - -ec
      - |
        mc alias set local http://minio:9000 "$${MINIO_ROOT_USER}" "$${MINIO_ROOT_PASSWORD}"
        mc mb --ignore-existing "local/$${S3_BUCKET}"
        mc anonymous set none "local/$${S3_BUCKET}"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-comamessenger}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-comamessenger-local-secret}
      S3_BUCKET: ${S3_BUCKET:-comamessenger}
    restart: "no"

  core:
    build:
      context: ..
      dockerfile: core/Dockerfile
    environment:
      APP_ENV: ${APP_ENV:-development}
      HTTP_ADDR: :8080
      DATABASE_URL: ${DATABASE_URL:-postgres://comamessenger:comamessenger@postgres:5432/comamessenger?sslmode=disable}
      PUBLIC_APP_URL: http://localhost:${WEB_PORT:-5173}
      AUTH_SIGNING_KEY: ${AUTH_SIGNING_KEY:-comamessenger-local-signing-key-change-me}
      ACCESS_TOKEN_TTL: ${ACCESS_TOKEN_TTL:-15m}
      REFRESH_TOKEN_TTL: ${REFRESH_TOKEN_TTL:-720h}
      INVITATION_TTL: ${INVITATION_TTL:-168h}
      AUTH_COOKIE_SECURE: ${AUTH_COOKIE_SECURE:-}
      ARGON2_MEMORY_KIB: ${ARGON2_MEMORY_KIB:-65536}
      ARGON2_ITERATIONS: ${ARGON2_ITERATIONS:-3}
      ARGON2_PARALLELISM: ${ARGON2_PARALLELISM:-2}
      S3_ENDPOINT: ${S3_ENDPOINT:-http://minio:9000}
      S3_PUBLIC_ENDPOINT: ${S3_PUBLIC_ENDPOINT:-http://localhost:9000}
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_BUCKET: ${S3_BUCKET:-comamessenger}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-comamessenger}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-comamessenger-local-secret}
      S3_PREFIX: ${S3_PREFIX:-}
      S3_FORCE_PATH_STYLE: ${S3_FORCE_PATH_STYLE:-true}
    depends_on:
      postgres:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "/comamessenger", "healthcheck"]
      interval: 10s
      timeout: 3s
      retries: 10

  web:
    build:
      context: ..
      dockerfile: apps/web/Dockerfile
    environment:
      VITE_API_URL: ${PUBLIC_API_URL:-http://localhost:8080}
    depends_on:
      core:
        condition: service_started
    ports:
      - "${WEB_PORT:-5173}:5173"

  agent-runtime:
    profiles: ["agents"]
    build:
      context: ..
      dockerfile: apps/agent-runtime/Dockerfile
    environment:
      CORE_API_URL: http://core:8080
    depends_on:
      core:
        condition: service_started

volumes:
  postgres-data:
  minio-data:
