name: comamessenger

services:
  postgres:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-comamessenger}
      POSTGRES_USER: ${POSTGRES_USER:-comamessenger}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-comamessenger}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20
    volumes:
      - postgres-data:/var/lib/postgresql/data

  redis:
    image: redis:8.10.0-alpine3.23
    restart: unless-stopped
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:-comamessenger-local-redis-secret}
    command:
      - redis-server
      - --save
      - ""
      - --appendonly
      - "no"
      - --maxmemory
      - ${REDIS_MAXMEMORY:-128mb}
      - --maxmemory-policy
      - allkeys-lru
      - --requirepass
      - ${REDIS_PASSWORD:-comamessenger-local-redis-secret}
    healthcheck:
      test:
        [
          "CMD-SHELL",
          'redis-cli --no-auth-warning -a "$${REDIS_PASSWORD}" ping | grep -q PONG',
        ]
      interval: 5s
      timeout: 3s
      retries: 20

  minio:
    profiles: ["s3"]
    image: minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address :9001
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-comamessenger}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-comamessenger-local-secret}
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:9000:9000"
      - "${BIND_ADDRESS:-127.0.0.1}:9001:9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 3s
      retries: 20
    volumes:
      - minio-data:/data

  minio-init:
    profiles: ["s3"]
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint:
      - /bin/sh
      - -ec
      - |
        mc alias set local http://minio:9000 "$${MINIO_ROOT_USER}" "$${MINIO_ROOT_PASSWORD}"
        mc mb --ignore-existing "local/$${S3_BUCKET}"
        mc anonymous set none "local/$${S3_BUCKET}"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-comamessenger}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-comamessenger-local-secret}
      S3_BUCKET: ${S3_BUCKET:-comamessenger}
    restart: "no"

  # S3 storage for new installations (STORAGE_DRIVER=s3, `--profile s3gw`):
  # versitygw with its posix backend, pinned by digest. Core seals every
  # client upload with a server-side copy pinned to the source ETag, which
  # needs x-amz-copy-source-if-match; versitygw honours it (CI checks this).
  # It has its own host port, so it can run next to the MinIO above while
  # objects are moved (docs/runbooks/files-search.md). Installations already
  # on MinIO keep the `s3` profile and need no change.
  s3gw:
    profiles: ["s3gw"]
    image: versity/versitygw:v1.10.0@sha256:89cad13cc981986ee284cbafea4613f9533ce6fd5f37a2c96c4c4fb8adb3a316
    restart: unless-stopped
    # The root key pair has no default: the bucket may be proxied publicly.
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - |
        if [ -z "$${ROOT_ACCESS_KEY}" ] || [ -z "$${ROOT_SECRET_KEY}" ]; then
          echo "Set S3_GATEWAY_ACCESS_KEY and S3_GATEWAY_SECRET_KEY (deploy/generate-env.sh creates them)." >&2
          exit 1
        fi
        exec /usr/local/bin/versitygw --port :9000 --health /health posix --sidecar /meta /data
    environment:
      ROOT_ACCESS_KEY: ${S3_GATEWAY_ACCESS_KEY:-}
      ROOT_SECRET_KEY: ${S3_GATEWAY_SECRET_KEY:-}
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${S3_GATEWAY_PORT:-9100}:9000"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:9000/health"]
      interval: 5s
      timeout: 3s
      retries: 20
    depends_on:
      s3gw-volume-init:
        condition: service_completed_successfully
    volumes:
      - s3gw-data:/data
      - s3gw-meta:/meta

  # A bucket of the posix backend is a top-level directory.
  s3gw-volume-init:
    profiles: ["s3gw"]
    image: alpine:3.23
    command: ["/bin/sh", "-ec", "mkdir -p \"/data/$${S3_BUCKET}\""]
    environment:
      S3_BUCKET: ${S3_BUCKET:-comamessenger}
    volumes:
      - s3gw-data:/data
    restart: "no"

  # Browsers upload straight to the bucket: allow PUBLIC_APP_URL and expose
  # ETag for multipart completion; other origins are refused. Multipart
  # uploads nobody completed are aborted by Core's reconciliation, so the
  # bucket needs no lifecycle rule.
  s3gw-init:
    profiles: ["s3gw"]
    image: amazon/aws-cli:2.38.6@sha256:bdb0dd07c54dfc7fe6526387dcf23eaab269875a20d647ae4de8196ea04d6bd4
    depends_on:
      s3gw:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - |
        aws --endpoint-url http://s3gw:9000 s3api put-bucket-cors --bucket "$${S3_BUCKET}" --cors-configuration \
          "{\"CORSRules\":[{\"AllowedOrigins\":[\"$${PUBLIC_APP_URL}\"],\"AllowedMethods\":[\"GET\",\"PUT\",\"HEAD\"],\"AllowedHeaders\":[\"*\"],\"ExposeHeaders\":[\"ETag\"],\"MaxAgeSeconds\":3600}]}"
        echo "CORS for $${PUBLIC_APP_URL} set on bucket $${S3_BUCKET}"
    environment:
      AWS_ACCESS_KEY_ID: ${S3_GATEWAY_ACCESS_KEY:-}
      AWS_SECRET_ACCESS_KEY: ${S3_GATEWAY_SECRET_KEY:-}
      AWS_DEFAULT_REGION: ${S3_REGION:-us-east-1}
      S3_BUCKET: ${S3_BUCKET:-comamessenger}
      PUBLIC_APP_URL: ${PUBLIC_APP_URL:-http://localhost:5173}
    restart: "no"

  storage-init:
    image: alpine:3.23
    command: ["/bin/sh", "-ec", "mkdir -p /var/lib/coma/files && chown 65532:65532 /var/lib/coma/files && chmod 0700 /var/lib/coma/files"]
    volumes:
      - files-data:/var/lib/coma/files
    restart: "no"

  core:
    build:
      context: ..
      dockerfile: core/Dockerfile
    restart: unless-stopped
    # Core waits for upload completions in flight before it exits (35 s plus
    # 10 s for the default FILE_MAX_BYTES; see shutdownTimeout in
    # core/cmd/server). Raise this with FILE_MAX_BYTES (1 s per 20 MiB).
    stop_grace_period: 60s
    environment:
      APP_ENV: ${APP_ENV:-development}
      HTTP_ADDR: :8080
      DATABASE_URL: ${DATABASE_URL:-postgres://comamessenger:comamessenger@postgres:5432/comamessenger?sslmode=disable}
      PUBLIC_APP_URL: ${PUBLIC_APP_URL:-http://localhost:5173}
      AUTH_SIGNING_KEY: ${AUTH_SIGNING_KEY:-comamessenger-local-signing-key-change-me}
      INTEGRATION_ENCRYPTION_KEY: ${INTEGRATION_ENCRYPTION_KEY:-comamessenger-local-integration-key-change-me}
      BOOTSTRAP_TOKEN: ${BOOTSTRAP_TOKEN:-}
      AGENT_TRIGGER_SHARD_INDEX: ${AGENT_TRIGGER_SHARD_INDEX:-0}
      AGENT_TRIGGER_SHARD_COUNT: ${AGENT_TRIGGER_SHARD_COUNT:-1}
      AGENT_QUIET_HOURS: ${AGENT_QUIET_HOURS:-21:00-08:00}
      AGENT_REMINDERS_PER_PERSON_PER_DAY: ${AGENT_REMINDERS_PER_PERSON_PER_DAY:-6}
      ARCHITECT_DAILY_COST_LIMIT: ${ARCHITECT_DAILY_COST_LIMIT:-5}
      ARCHITECT_MONTHLY_COST_LIMIT: ${ARCHITECT_MONTHLY_COST_LIMIT:-50}
      ARCHITECT_CALLS_PER_MINUTE: ${ARCHITECT_CALLS_PER_MINUTE:-30}
      ARCHITECT_USER_DAILY_CALLS: ${ARCHITECT_USER_DAILY_CALLS:-150}
      ARCHITECT_USER_DAILY_TOKENS: ${ARCHITECT_USER_DAILY_TOKENS:-1500000}
      INTEGRATIONS_ALLOWED_PRIVATE_TARGETS: ${INTEGRATIONS_ALLOWED_PRIVATE_TARGETS:-}
      AGENT_RUNTIME_API_KEY: ${AGENT_RUNTIME_API_KEY:-}
      TRUSTED_PROXY_CIDRS: ${TRUSTED_PROXY_CIDRS:-127.0.0.1/32,::1/128,172.16.0.0/12}
      ACCESS_TOKEN_TTL: ${ACCESS_TOKEN_TTL:-15m}
      REFRESH_TOKEN_TTL: ${REFRESH_TOKEN_TTL:-720h}
      INVITATION_TTL: ${INVITATION_TTL:-168h}
      AUTH_COOKIE_SECURE: ${AUTH_COOKIE_SECURE:-}
      ARGON2_MEMORY_KIB: ${ARGON2_MEMORY_KIB:-65536}
      ARGON2_ITERATIONS: ${ARGON2_ITERATIONS:-3}
      ARGON2_PARALLELISM: ${ARGON2_PARALLELISM:-2}
      MESSAGE_MAX_BODY_BYTES: ${MESSAGE_MAX_BODY_BYTES:-65536}
      MESSAGE_MAX_PAGE_SIZE: ${MESSAGE_MAX_PAGE_SIZE:-100}
      WS_AUTH_TIMEOUT: ${WS_AUTH_TIMEOUT:-5s}
      WS_MAX_FRAME_BYTES: ${WS_MAX_FRAME_BYTES:-262144}
      WS_MAX_CONNECTIONS_PER_ACTOR: ${WS_MAX_CONNECTIONS_PER_ACTOR:-10}
      WS_MAX_PENDING_CONNECTIONS: ${WS_MAX_PENDING_CONNECTIONS:-256}
      WS_MAX_CONCURRENT_WRITES: ${WS_MAX_CONCURRENT_WRITES:-8}
      WS_MAX_QUEUED_EVENTS: ${WS_MAX_QUEUED_EVENTS:-256}
      WS_MAX_QUEUED_BYTES: ${WS_MAX_QUEUED_BYTES:-1048576}
      WS_MAX_UNACKED_EVENTS: ${WS_MAX_UNACKED_EVENTS:-128}
      WS_HEARTBEAT_INTERVAL: ${WS_HEARTBEAT_INTERVAL:-25s}
      WS_PONG_TIMEOUT: ${WS_PONG_TIMEOUT:-10s}
      WS_ACK_INTERVAL: ${WS_ACK_INTERVAL:-1s}
      WS_ACK_TIMEOUT: ${WS_ACK_TIMEOUT:-30s}
      WS_ACK_BATCH_SIZE: ${WS_ACK_BATCH_SIZE:-50}
      EVENT_POLL_INTERVAL: ${EVENT_POLL_INTERVAL:-200ms}
      EVENT_WAKE_COALESCE: ${EVENT_WAKE_COALESCE:-5ms}
      EVENT_RETENTION: ${EVENT_RETENTION:-72h}
      EVENT_RETENTION_MIN_COUNT: ${EVENT_RETENTION_MIN_COUNT:-100000}
      EVENT_RETENTION_INTERVAL: ${EVENT_RETENTION_INTERVAL:-5m}
      EVENT_RETENTION_BATCH_SIZE: ${EVENT_RETENTION_BATCH_SIZE:-10000}
      REDIS_MODE: ${REDIS_MODE:-required}
      REDIS_URL: ${REDIS_URL:-redis://:comamessenger-local-redis-secret@redis:6379/0}
      REDIS_EPHEMERAL_SIGNING_KEY: ${REDIS_EPHEMERAL_SIGNING_KEY:-comamessenger-local-ephemeral-signing-key}
      REDIS_NAMESPACE: ${REDIS_NAMESPACE:-coma:v1}
      REDIS_CONNECT_TIMEOUT: ${REDIS_CONNECT_TIMEOUT:-1s}
      REDIS_OPERATION_TIMEOUT: ${REDIS_OPERATION_TIMEOUT:-500ms}
      VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY:-}
      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY:-}
      VAPID_SUBJECT: ${VAPID_SUBJECT:-mailto:admin@localhost}
      PUSH_POLL_INTERVAL: ${PUSH_POLL_INTERVAL:-1s}
      PUSH_RELAY_URL: ${PUSH_RELAY_URL:-}
      STORAGE_DRIVER: ${STORAGE_DRIVER:-local}
      LOCAL_STORAGE_PATH: /var/lib/coma/files
      LOCAL_STORAGE_QUOTA_BYTES: ${LOCAL_STORAGE_QUOTA_BYTES:-2147483648}
      LOCAL_STORAGE_MIN_FREE_BYTES: ${LOCAL_STORAGE_MIN_FREE_BYTES:-268435456}
      FILE_MAX_BYTES: ${FILE_MAX_BYTES:-104857600}
      FILE_MULTIPART_THRESHOLD_BYTES: ${FILE_MULTIPART_THRESHOLD_BYTES:-16777216}
      FILE_UPLOAD_TTL: ${FILE_UPLOAD_TTL:-24h}
      FILE_PRESIGN_TTL: ${FILE_PRESIGN_TTL:-15m}
      S3_ENDPOINT: ${S3_ENDPOINT:-}
      S3_PUBLIC_ENDPOINT: ${S3_PUBLIC_ENDPOINT:-}
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_BUCKET: ${S3_BUCKET:-}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-}
      S3_PREFIX: ${S3_PREFIX:-}
      S3_FORCE_PATH_STYLE: ${S3_FORCE_PATH_STYLE:-true}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      storage-init:
        condition: service_completed_successfully
    volumes:
      - files-data:/var/lib/coma/files
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:8080:8080"
    healthcheck:
      test: ["CMD", "/comamessenger", "healthcheck"]
      interval: 10s
      timeout: 3s
      retries: 10

  web:
    build:
      context: ..
      dockerfile: apps/web/Dockerfile
      args:
        VITE_API_URL: ${PUBLIC_API_URL:-http://localhost:8080}
    restart: unless-stopped
    environment:
      VITE_API_URL: ${PUBLIC_API_URL:-http://localhost:8080}
      VITE_ALLOWED_HOSTS: ${WEB_ALLOWED_HOSTS:-localhost,127.0.0.1}
    depends_on:
      core:
        condition: service_started
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${WEB_PORT:-5173}:5173"

  agent-runtime:
    profiles: ["agents"]
    build:
      context: ..
      dockerfile: apps/agent-runtime/Dockerfile
    restart: unless-stopped
    environment:
      COMA_CORE_URL: http://core:8080
      COMA_AGENT_API_KEY: ${AGENT_RUNTIME_API_KEY:-}
      COMA_RUNTIME_CONSUMER: ${AGENT_RUNTIME_CONSUMER:-builtin-runtime}
      COMA_RUNTIME_CONCURRENCY: ${AGENT_RUNTIME_CONCURRENCY:-4}
    depends_on:
      core:
        condition: service_started

  # Push relay of the published mobile app (docs/runbooks/push-relay.md). Only
  # the publisher of an app build runs it; ordinary instances leave it off.
  push-relay-init:
    profiles: ["relay"]
    image: pgvector/pgvector:pg16
    restart: "no"
    environment:
      PGHOST: postgres
      PGUSER: ${POSTGRES_USER:-comamessenger}
      PGPASSWORD: ${POSTGRES_PASSWORD:-comamessenger}
      PGDATABASE: ${POSTGRES_DB:-comamessenger}
      RELAY_DATABASE: ${PUSH_RELAY_DATABASE:-coma_push_relay}
    command:
      - /bin/sh
      - -ec
      - |
        psql -tAc "SELECT 1 FROM pg_database WHERE datname = '$${RELAY_DATABASE}'" | grep -q 1 \
          || createdb "$${RELAY_DATABASE}"
    depends_on:
      postgres:
        condition: service_healthy

  push-relay:
    profiles: ["relay"]
    build:
      context: ..
      dockerfile: core/Dockerfile
      target: push-relay
    restart: unless-stopped
    environment:
      RELAY_DATABASE_URL: ${PUSH_RELAY_DATABASE_URL:-postgres://comamessenger:comamessenger@postgres:5432/coma_push_relay?sslmode=disable}
      RELAY_LISTEN: :8090
      RELAY_TRUSTED_PROXY_CIDRS: ${TRUSTED_PROXY_CIDRS:-}
      APNS_KEY_FILE: ${PUSH_RELAY_APNS_KEY_FILE:-}
      APNS_KEY_ID: ${PUSH_RELAY_APNS_KEY_ID:-}
      APNS_TEAM_ID: ${PUSH_RELAY_APNS_TEAM_ID:-}
      APNS_TOPIC: ${PUSH_RELAY_APNS_TOPIC:-}
      APNS_SANDBOX: ${PUSH_RELAY_APNS_SANDBOX:-false}
      FCM_CREDENTIALS_FILE: ${PUSH_RELAY_FCM_CREDENTIALS_FILE:-}
    volumes:
      - ${PUSH_RELAY_KEYS_DIR:-./push-relay-keys}:/keys:ro
    depends_on:
      push-relay-init:
        condition: service_completed_successfully
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${PUSH_RELAY_PORT:-8090}:8090"

volumes:
  postgres-data:
  minio-data:
  s3gw-data:
  s3gw-meta:
  files-data:
