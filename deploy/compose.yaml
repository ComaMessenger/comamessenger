name: comamessenger

services:
  postgres:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-comamessenger}
      POSTGRES_USER: ${POSTGRES_USER:-comamessenger}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-comamessenger}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20
    volumes:
      - postgres-data:/var/lib/postgresql/data

  redis:
    image: redis:8.10.0-alpine3.23
    restart: unless-stopped
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:-comamessenger-local-redis-secret}
    command:
      - redis-server
      - --save
      - ""
      - --appendonly
      - "no"
      - --maxmemory
      - ${REDIS_MAXMEMORY:-128mb}
      - --maxmemory-policy
      - allkeys-lru
      - --requirepass
      - ${REDIS_PASSWORD:-comamessenger-local-redis-secret}
    healthcheck:
      test:
        [
          "CMD-SHELL",
          'redis-cli --no-auth-warning -a "$${REDIS_PASSWORD}" ping | grep -q PONG',
        ]
      interval: 5s
      timeout: 3s
      retries: 20

  minio:
    profiles: ["s3"]
    image: minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address :9001
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-comamessenger}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-comamessenger-local-secret}
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:9000:9000"
      - "${BIND_ADDRESS:-127.0.0.1}:9001:9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 3s
      retries: 20
    volumes:
      - minio-data:/data

  minio-init:
    profiles: ["s3"]
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint:
      - /bin/sh
      - -ec
      - |
        mc alias set local http://minio:9000 "$${MINIO_ROOT_USER}" "$${MINIO_ROOT_PASSWORD}"
        mc mb --ignore-existing "local/$${S3_BUCKET}"
        mc anonymous set none "local/$${S3_BUCKET}"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-comamessenger}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-comamessenger-local-secret}
      S3_BUCKET: ${S3_BUCKET:-comamessenger}
    restart: "no"

  storage-init:
    image: alpine:3.23
    command: ["/bin/sh", "-ec", "mkdir -p /var/lib/coma/files && chown 65532:65532 /var/lib/coma/files && chmod 0700 /var/lib/coma/files"]
    volumes:
      - files-data:/var/lib/coma/files
    restart: "no"

  core:
    build:
      context: ..
      dockerfile: core/Dockerfile
    restart: unless-stopped
    environment:
      APP_ENV: ${APP_ENV:-development}
      HTTP_ADDR: :8080
      DATABASE_URL: ${DATABASE_URL:-postgres://comamessenger:comamessenger@postgres:5432/comamessenger?sslmode=disable}
      PUBLIC_APP_URL: ${PUBLIC_APP_URL:-http://localhost:5173}
      AUTH_SIGNING_KEY: ${AUTH_SIGNING_KEY:-comamessenger-local-signing-key-change-me}
      INTEGRATION_ENCRYPTION_KEY: ${INTEGRATION_ENCRYPTION_KEY:-comamessenger-local-integration-key-change-me}
      BOOTSTRAP_TOKEN: ${BOOTSTRAP_TOKEN:-}
      TRUSTED_PROXY_CIDRS: ${TRUSTED_PROXY_CIDRS:-127.0.0.1/32,::1/128,172.16.0.0/12}
      ACCESS_TOKEN_TTL: ${ACCESS_TOKEN_TTL:-15m}
      REFRESH_TOKEN_TTL: ${REFRESH_TOKEN_TTL:-720h}
      INVITATION_TTL: ${INVITATION_TTL:-168h}
      AUTH_COOKIE_SECURE: ${AUTH_COOKIE_SECURE:-}
      ARGON2_MEMORY_KIB: ${ARGON2_MEMORY_KIB:-65536}
      ARGON2_ITERATIONS: ${ARGON2_ITERATIONS:-3}
      ARGON2_PARALLELISM: ${ARGON2_PARALLELISM:-2}
      MESSAGE_MAX_BODY_BYTES: ${MESSAGE_MAX_BODY_BYTES:-65536}
      MESSAGE_MAX_PAGE_SIZE: ${MESSAGE_MAX_PAGE_SIZE:-100}
      WS_AUTH_TIMEOUT: ${WS_AUTH_TIMEOUT:-5s}
      WS_MAX_FRAME_BYTES: ${WS_MAX_FRAME_BYTES:-262144}
      WS_MAX_CONNECTIONS_PER_ACTOR: ${WS_MAX_CONNECTIONS_PER_ACTOR:-10}
      WS_MAX_PENDING_CONNECTIONS: ${WS_MAX_PENDING_CONNECTIONS:-256}
      WS_MAX_CONCURRENT_WRITES: ${WS_MAX_CONCURRENT_WRITES:-8}
      WS_MAX_QUEUED_EVENTS: ${WS_MAX_QUEUED_EVENTS:-256}
      WS_MAX_QUEUED_BYTES: ${WS_MAX_QUEUED_BYTES:-1048576}
      WS_MAX_UNACKED_EVENTS: ${WS_MAX_UNACKED_EVENTS:-128}
      WS_HEARTBEAT_INTERVAL: ${WS_HEARTBEAT_INTERVAL:-25s}
      WS_PONG_TIMEOUT: ${WS_PONG_TIMEOUT:-10s}
      WS_ACK_INTERVAL: ${WS_ACK_INTERVAL:-1s}
      WS_ACK_TIMEOUT: ${WS_ACK_TIMEOUT:-30s}
      WS_ACK_BATCH_SIZE: ${WS_ACK_BATCH_SIZE:-50}
      EVENT_POLL_INTERVAL: ${EVENT_POLL_INTERVAL:-200ms}
      EVENT_WAKE_COALESCE: ${EVENT_WAKE_COALESCE:-5ms}
      EVENT_RETENTION: ${EVENT_RETENTION:-72h}
      EVENT_RETENTION_MIN_COUNT: ${EVENT_RETENTION_MIN_COUNT:-100000}
      EVENT_RETENTION_INTERVAL: ${EVENT_RETENTION_INTERVAL:-5m}
      EVENT_RETENTION_BATCH_SIZE: ${EVENT_RETENTION_BATCH_SIZE:-10000}
      REDIS_MODE: ${REDIS_MODE:-required}
      REDIS_URL: ${REDIS_URL:-redis://:comamessenger-local-redis-secret@redis:6379/0}
      REDIS_EPHEMERAL_SIGNING_KEY: ${REDIS_EPHEMERAL_SIGNING_KEY:-comamessenger-local-ephemeral-signing-key}
      REDIS_NAMESPACE: ${REDIS_NAMESPACE:-coma:v1}
      REDIS_CONNECT_TIMEOUT: ${REDIS_CONNECT_TIMEOUT:-1s}
      REDIS_OPERATION_TIMEOUT: ${REDIS_OPERATION_TIMEOUT:-500ms}
      VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY:-}
      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY:-}
      VAPID_SUBJECT: ${VAPID_SUBJECT:-mailto:admin@localhost}
      PUSH_POLL_INTERVAL: ${PUSH_POLL_INTERVAL:-1s}
      STORAGE_DRIVER: ${STORAGE_DRIVER:-local}
      LOCAL_STORAGE_PATH: /var/lib/coma/files
      LOCAL_STORAGE_QUOTA_BYTES: ${LOCAL_STORAGE_QUOTA_BYTES:-2147483648}
      LOCAL_STORAGE_MIN_FREE_BYTES: ${LOCAL_STORAGE_MIN_FREE_BYTES:-268435456}
      FILE_MAX_BYTES: ${FILE_MAX_BYTES:-104857600}
      FILE_MULTIPART_THRESHOLD_BYTES: ${FILE_MULTIPART_THRESHOLD_BYTES:-16777216}
      FILE_UPLOAD_TTL: ${FILE_UPLOAD_TTL:-24h}
      FILE_PRESIGN_TTL: ${FILE_PRESIGN_TTL:-15m}
      S3_ENDPOINT: ${S3_ENDPOINT:-}
      S3_PUBLIC_ENDPOINT: ${S3_PUBLIC_ENDPOINT:-}
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_BUCKET: ${S3_BUCKET:-}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-}
      S3_PREFIX: ${S3_PREFIX:-}
      S3_FORCE_PATH_STYLE: ${S3_FORCE_PATH_STYLE:-true}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      storage-init:
        condition: service_completed_successfully
    volumes:
      - files-data:/var/lib/coma/files
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:8080:8080"
    healthcheck:
      test: ["CMD", "/comamessenger", "healthcheck"]
      interval: 10s
      timeout: 3s
      retries: 10

  web:
    build:
      context: ..
      dockerfile: apps/web/Dockerfile
    restart: unless-stopped
    environment:
      VITE_API_URL: ${PUBLIC_API_URL:-http://localhost:8080}
      VITE_ALLOWED_HOSTS: ${WEB_ALLOWED_HOSTS:-localhost,127.0.0.1}
    depends_on:
      core:
        condition: service_started
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${WEB_PORT:-5173}:5173"

  agent-runtime:
    profiles: ["agents"]
    build:
      context: ..
      dockerfile: apps/agent-runtime/Dockerfile
    environment:
      COMA_CORE_URL: http://core:8080
      COMA_AGENT_API_KEY: ${AGENT_RUNTIME_API_KEY:-}
      COMA_RUNTIME_CONSUMER: ${AGENT_RUNTIME_CONSUMER:-builtin-runtime}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      OPENAI_COMPATIBLE_BASE_URL: ${OPENAI_COMPATIBLE_BASE_URL:-}
      OPENAI_COMPATIBLE_API_KEY: ${OPENAI_COMPATIBLE_API_KEY:-}
    depends_on:
      core:
        condition: service_started

volumes:
  postgres-data:
  minio-data:
  files-data:
