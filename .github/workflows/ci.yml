name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  go:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: postgres
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    env:
      TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres?sslmode=disable
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v7
        with:
          go-version-file: core/go.mod
          cache-dependency-path: core/go.sum
      - run: gofmt -w core && git diff --exit-code
      - run: cd core && go tool oapi-codegen --config internal/api/oapi-codegen.yaml ../packages/protocol/src/generated/openapi.bundle.json && git diff --exit-code
      - run: go test ./core/...
      - run: go build ./core/...

  typescript:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
        with:
          version: 10.32.1
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm generate && git diff --exit-code
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm build

  compose:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - run: docker compose --env-file .env.example -f deploy/compose.yaml config --quiet
      - run: docker compose --env-file .env.example -f deploy/compose.yaml build core web agent-runtime
      - run: ENV_FILE=.env.example make smoke
      - run: ./scripts/phase1-smoke.sh
      - name: Stop Compose services
        if: always()
        run: docker compose --env-file .env.example -f deploy/compose.yaml down
