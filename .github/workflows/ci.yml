name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  go:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: postgres
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    env:
      TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres?sslmode=disable
      # S3 contract and upload-sealing tests run against versitygw, an
      # S3-compatible gateway that honours x-amz-copy-source-if-match.
      # TEST_S3_REQUIRED turns a missing server into a failure, not a skip.
      TEST_S3_ENDPOINT: http://127.0.0.1:9000
      TEST_S3_BUCKET: coma-test
      TEST_S3_ACCESS_KEY: comatest
      TEST_S3_SECRET_KEY: comatest-secret
      TEST_S3_FORCE_PATH_STYLE: "true"
      TEST_S3_REQUIRED: "1"
    steps:
      - uses: actions/checkout@v6
      - name: Start S3 server
        run: |
          # A bucket of the posix backend is a top-level directory.
          mkdir -p "$RUNNER_TEMP/s3/data/coma-test" "$RUNNER_TEMP/s3/meta"
          docker run -d --name s3 -p 127.0.0.1:9000:7070 \
            -v "$RUNNER_TEMP/s3/data:/data" -v "$RUNNER_TEMP/s3/meta:/meta" \
            -e ROOT_ACCESS_KEY=comatest -e ROOT_SECRET_KEY=comatest-secret \
            versity/versitygw:v1.10.0@sha256:89cad13cc981986ee284cbafea4613f9533ce6fd5f37a2c96c4c4fb8adb3a316 \
            posix --sidecar /meta /data
          for attempt in $(seq 1 30); do
            curl -s -o /dev/null http://127.0.0.1:9000/ && break
            sleep 1
          done
          curl -s -o /dev/null -w 'S3 server answered HTTP %{http_code}\n' http://127.0.0.1:9000/
      - uses: actions/setup-go@v7
        with:
          go-version-file: core/go.mod
          cache-dependency-path: core/go.sum
      - name: Migration versions are unique
        run: ./scripts/check-migration-versions.sh
      - run: gofmt -w core && git diff --exit-code
      - run: cd core && go tool oapi-codegen --config internal/api/oapi-codegen.yaml ../packages/protocol/src/generated/openapi.bundle.json && git diff --exit-code
      - run: go test ./core/...
      - name: S3 tests ran
        run: |
          set -o pipefail
          go test -count=1 -v -run 'TestConfiguredS3|TestCompletedUploadCannotBeReplaced|TestFailedOrCancelledSealing|TestReconcileAgainstWrongStorage' \
            ./core/internal/storage ./core/internal/files | tee "$RUNNER_TEMP/s3-tests.log"
          ! grep -q -- '--- SKIP' "$RUNNER_TEMP/s3-tests.log"
          test "$(grep -c -- '--- PASS: TestConfiguredS3' "$RUNNER_TEMP/s3-tests.log")" -eq 4
          grep -q -- '--- PASS: TestCompletedUploadCannotBeReplacedThroughItsUploadURL/s3' "$RUNNER_TEMP/s3-tests.log"
          grep -q -- '--- PASS: TestFailedOrCancelledSealingKeepsTheUploadRetryable/s3' "$RUNNER_TEMP/s3-tests.log"
          grep -q -- '--- PASS: TestReconcileAgainstWrongStorageChangesNothing/s3' "$RUNNER_TEMP/s3-tests.log"
      - run: go build ./core/...

  typescript:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
        with:
          version: 10.32.1
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm generate && git diff --exit-code
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm build

  compose:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - run: docker compose --env-file .env.example -f deploy/compose.yaml config --quiet
      - run: docker compose --env-file .env.example -f deploy/compose.yaml build core web agent-runtime
      - name: s3gw profile allows browser uploads only from the app origin
        run: ./scripts/check-s3gw-cors.sh s3gwcheck
      - run: ENV_FILE=.env.example make smoke
      - run: ./scripts/phase1-smoke.sh
      - name: Stop Compose services
        if: always()
        run: docker compose --env-file .env.example -f deploy/compose.yaml down
      - name: Stop the s3gw check
        if: always()
        run: docker compose -p s3gwcheck -f deploy/compose.yaml --profile s3gw down -v
