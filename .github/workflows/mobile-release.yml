name: Mobile store builds

# Builds the mobile app in the cloud and uploads it to TestFlight and Google Play
# internal testing (apps/mobile/fastlane). Store builds load a laptop heavily
# enough to break macOS audio, so they run here instead.
#
#   gh workflow run mobile-release.yml --ref <branch> -f platform=ios
#
# Credentials live in the `store` environment; see docs/runbooks/mobile-store-builds.md.

on:
  workflow_dispatch:
    inputs:
      platform:
        description: Which store to build for
        type: choice
        options: [both, ios, android]
        default: both
      changelog:
        description: TestFlight «What to test» text
        type: string
        required: false

permissions:
  contents: read

concurrency:
  group: mobile-store-builds
  cancel-in-progress: false

jobs:
  ios:
    if: inputs.platform != 'android'
    runs-on: macos-26
    environment: store
    timeout-minutes: 120
    env:
      APPLE_KEY_ID: ${{ vars.APPLE_KEY_ID }}
      APPLE_ISSUER_ID: ${{ vars.APPLE_ISSUER_ID }}
      APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
      APPLE_TESTFLIGHT_CHANGELOG: ${{ inputs.changelog }}
    steps:
      - uses: actions/checkout@v6
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - uses: pnpm/action-setup@v6
        with:
          version: 10.32.1
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "4.0"
          bundler-cache: true
          working-directory: apps/mobile
      - name: Store credentials
        env:
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
          COMA_PUSH_RELAY_URL: ${{ vars.COMA_PUSH_RELAY_URL }}
        run: |
          umask 077
          dir="$RUNNER_TEMP/store"
          mkdir -p "$dir"
          printf '%s' "$APPLE_API_KEY_P8" > "$dir/AuthKey.p8"
          printf '%s' "$GOOGLE_SERVICES_JSON" > "$dir/google-services.json"
          {
            echo "APPLE_PRIVATE_KEY_PATH=$dir/AuthKey.p8"
            echo "GOOGLE_SERVICES_FILE=$dir/google-services.json"
            echo "COMA_PUSH_RELAY_URL=$COMA_PUSH_RELAY_URL"
          } > apps/mobile/.env
      - name: Distribution certificate
        env:
          IOS_DIST_P12_BASE64: ${{ secrets.IOS_DIST_P12_BASE64 }}
          IOS_DIST_P12_PASSWORD: ${{ secrets.IOS_DIST_P12_PASSWORD }}
        run: |
          # Without a certificate Xcode signs with a cloud-managed one through
          # the App Store Connect API key.
          [ -n "$IOS_DIST_P12_BASE64" ] || exit 0
          keychain="$RUNNER_TEMP/store.keychain-db"
          password="$(openssl rand -hex 16)"
          security create-keychain -p "$password" "$keychain"
          security set-keychain-settings -lut 7200 "$keychain"
          security unlock-keychain -p "$password" "$keychain"
          printf '%s' "$IOS_DIST_P12_BASE64" | base64 --decode > "$RUNNER_TEMP/dist.p12"
          security import "$RUNNER_TEMP/dist.p12" -k "$keychain" -P "$IOS_DIST_P12_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple: -s -k "$password" "$keychain" >/dev/null
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
          rm -f "$RUNNER_TEMP/dist.p12"
      - name: TestFlight
        working-directory: apps/mobile
        run: bundle exec fastlane ios beta
      - if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: ios-build-logs
          path: apps/mobile/build/ios/logs
          if-no-files-found: ignore
          retention-days: 7

  android:
    if: inputs.platform != 'ios'
    runs-on: ubuntu-latest
    environment: store
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: pnpm/action-setup@v6
        with:
          version: 10.32.1
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "4.0"
          bundler-cache: true
          working-directory: apps/mobile
      - name: Store credentials
        env:
          GOOGLE_PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
          ANDROID_UPLOAD_KEYSTORE_BASE64: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_BASE64 }}
          COMA_UPLOAD_STORE_PASSWORD: ${{ secrets.COMA_UPLOAD_STORE_PASSWORD }}
          COMA_UPLOAD_KEY_ALIAS: ${{ secrets.COMA_UPLOAD_KEY_ALIAS }}
          COMA_UPLOAD_KEY_PASSWORD: ${{ secrets.COMA_UPLOAD_KEY_PASSWORD }}
          COMA_PUSH_RELAY_URL: ${{ vars.COMA_PUSH_RELAY_URL }}
        run: |
          umask 077
          dir="$RUNNER_TEMP/store"
          mkdir -p "$dir" "$HOME/.gradle"
          printf '%s' "$GOOGLE_PLAY_SERVICE_ACCOUNT_JSON" > "$dir/play-service-account.json"
          printf '%s' "$GOOGLE_SERVICES_JSON" > "$dir/google-services.json"
          printf '%s' "$ANDROID_UPLOAD_KEYSTORE_BASE64" | base64 --decode > "$dir/coma-upload.jks"
          {
            echo "COMA_UPLOAD_STORE_FILE=$dir/coma-upload.jks"
            echo "COMA_UPLOAD_STORE_PASSWORD=$COMA_UPLOAD_STORE_PASSWORD"
            echo "COMA_UPLOAD_KEY_ALIAS=$COMA_UPLOAD_KEY_ALIAS"
            echo "COMA_UPLOAD_KEY_PASSWORD=$COMA_UPLOAD_KEY_PASSWORD"
          } >> "$HOME/.gradle/gradle.properties"
          {
            echo "GOOGLE_PLAY_SERVICE_ACCOUNT_PATH=$dir/play-service-account.json"
            echo "GOOGLE_PLAY_TRACK=internal"
            echo "GOOGLE_SERVICES_FILE=$dir/google-services.json"
            echo "COMA_PUSH_RELAY_URL=$COMA_PUSH_RELAY_URL"
          } > apps/mobile/.env
      - name: Google Play internal testing
        working-directory: apps/mobile
        run: bundle exec fastlane android beta
