name: Mobile store builds

# Compiles the mobile app in the cloud WITHOUT store credentials: an iOS
# archive signed ad hoc and an Android bundle with the debug signature. The
# owner's Mac then signs them with its own certificate and keystore and uploads
# them (apps/mobile/scripts/store-release.sh). Compiling on the laptop loads it
# enough to break macOS audio; signing and uploading take a minute.
#
#   apps/mobile/scripts/store-release.sh ios [ref]
#
# See docs/runbooks/mobile-store-builds.md.

on:
  workflow_dispatch:
    inputs:
      platform:
        description: Which app to build
        type: choice
        options: [ios, android]
        default: ios
      build_number:
        description: iOS build number or Android versionCode (next after the store)
        type: string
        required: true

permissions:
  contents: read

concurrency:
  group: mobile-store-builds-${{ inputs.platform }}
  cancel-in-progress: false

env:
  COMA_BUILD_NUMBER: ${{ inputs.build_number }}
  COMA_PUSH_RELAY_URL: ${{ vars.COMA_PUSH_RELAY_URL }}
  APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}

jobs:
  ios:
    if: inputs.platform == 'ios'
    runs-on: macos-26
    environment: store
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v6
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - uses: pnpm/action-setup@v6
        with:
          version: 10.32.1
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Prebuild
        working-directory: apps/mobile
        env:
          CI: "1"
        run: npx expo prebuild --clean --platform ios
      - name: Archive without store signing
        working-directory: apps/mobile/ios
        run: |
          set -o pipefail
          workspace=$(ls -d *.xcworkspace | head -1)
          # Xcode no longer signs iOS builds ad hoc, so the archive is built
          # unsigned and then signed ad hoc by codesign with the target
          # entitlements (App Group, push): the owner's Mac re-signs it for
          # the App Store on export and keeps those entitlements.
          xcodebuild archive \
            -workspace "$workspace" -scheme "${workspace%.xcworkspace}" \
            -configuration Release -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/Coma.xcarchive" \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO \
            | tee "$RUNNER_TEMP/archive.log" | grep -E "error:|ARCHIVE (SUCCEEDED|FAILED)" || true
          app=$(ls -d "$RUNNER_TEMP"/Coma.xcarchive/Products/Applications/*.app | head -1)
          test -d "$app"
          find "$app" -path '*/Frameworks/*' \( -name '*.framework' -o -name '*.dylib' \) -prune -print0 \
            | xargs -0 -I{} codesign --force --sign - --timestamp=none {}
          for appex in "$app"/PlugIns/*.appex; do
            [ -d "$appex" ] || continue
            name=$(basename "$appex" .appex)
            codesign --force --sign - --timestamp=none --entitlements ".targets/$name/generated.entitlements" "$appex"
          done
          codesign --force --sign - --timestamp=none --entitlements "$(basename "$app" .app)/$(basename "$app" .app).entitlements" "$app"
          codesign -d --entitlements - --xml "$app" | grep -q "group.com" || { echo "app lost its entitlements"; exit 1; }
          ditto -c -k --keepParent "$RUNNER_TEMP/Coma.xcarchive" "$RUNNER_TEMP/Coma.xcarchive.zip"
      - uses: actions/upload-artifact@v5
        with:
          name: coma-ios-${{ inputs.build_number }}
          path: ${{ runner.temp }}/Coma.xcarchive.zip
          retention-days: 7
      - if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: coma-ios-${{ inputs.build_number }}-log
          path: ${{ runner.temp }}/archive.log
          if-no-files-found: ignore
          retention-days: 7

  android:
    if: inputs.platform == 'android'
    runs-on: ubuntu-latest
    environment: store
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: pnpm/action-setup@v6
        with:
          version: 10.32.1
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Firebase client config
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          # The Firebase client config ships inside every APK; it is not a
          # signing key. The upload keystore stays on the owner's Mac.
          printf '%s' "$GOOGLE_SERVICES_JSON" > "$RUNNER_TEMP/google-services.json"
          echo "GOOGLE_SERVICES_FILE=$RUNNER_TEMP/google-services.json" >> "$GITHUB_ENV"
      - name: Prebuild
        working-directory: apps/mobile
        env:
          CI: "1"
        run: npx expo prebuild --clean --platform android
      - name: Bundle (debug signature, re-signed on the owner's Mac)
        working-directory: apps/mobile/android
        run: |
          ./gradlew bundleRelease
          cp app/build/outputs/bundle/release/app-release.aab "$RUNNER_TEMP/coma-$COMA_BUILD_NUMBER.aab"
      - uses: actions/upload-artifact@v5
        with:
          name: coma-android-${{ inputs.build_number }}
          path: ${{ runner.temp }}/coma-${{ inputs.build_number }}.aab
          retention-days: 7
